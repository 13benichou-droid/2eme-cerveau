name: Actu du jour
on:
  schedule:
    - cron: "40 5 * * 1-5"   # 7 h 40 à Paris (heure d'été), du lundi au vendredi
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  actu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mettre à jour l'actu
        run: node scripts/actu.mjs
        env:
          # 1. Gemini (clé dans les secrets du dépôt)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # 2. ton relais Cloudflare (Mistral, Cerebras, Groq, OpenRouter) : le « lien pour ton autre appareil » de l'appli
          RELAIS_LIEN: ${{ secrets.RELAIS_LIEN }}
          RELAIS_ORIGINE: ${{ vars.RELAIS_ORIGINE }}
          # 3. facultatif : des clés directes, si tu préfères les mettre ici
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Enregistrer
        run: |
          git config user.name "actu-bot"
          git config user.email "actu-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "Actu du $(date +%F)" && git push)
