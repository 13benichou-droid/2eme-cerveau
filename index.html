  ["Le travail éloigne de nous trois grands maux : l'ennui, le vice et le besoin.","Voltaire, Candide"]],
 hab:[["Nous sommes ce que nous faisons de manière répétée. L'excellence n'est donc pas un acte, mais une habitude.","Will Durant, d'après Aristote"],
  ["La motivation vous fait commencer. L'habitude vous fait continuer.","Jim Ryun"],
  ["Le succès est la somme de petits efforts, répétés jour après jour.","Robert Collier"],
  ["Ce n'est pas parce que les choses sont difficiles que nous n'osons pas, c'est parce que nous n'osons pas qu'elles sont difficiles.","Sénèque"]],
 fin:[["Le risque vient de ne pas savoir ce que l'on fait.","Warren Buffett"],
  ["Règle n° 1 : ne jamais perdre d'argent. Règle n° 2 : ne jamais oublier la règle n° 1.","Warren Buffett"],
  ["Sache ce que tu possèdes, et pourquoi tu le possèdes.","Peter Lynch"]],
 elan:[["Dans les champs de l'observation, le hasard ne favorise que les esprits préparés.","Louis Pasteur"],
  ["Le talent, c'est d'avoir envie de faire quelque chose.","Jacques Brel"],
  ["Visez la lune. Même si vous la manquez, vous atterrirez parmi les étoiles.","Les Brown"]]
};
const clamp01=x=>Math.max(0,Math.min(1,x));
const pct1=x=>(Math.round(x*10)/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1});
/* premier jour suivi (au plus 28 jours en arrière) */
function objStart(){
  const ks=[...Object.keys(S.jours||{}),...Object.keys(prog().days||{})].filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort();
  const t=today(),min=add(t,-27),first=ks.length?(([y,m,d])=>new Date(y,m-1,d))(ks[0].split("-").map(Number)):t;
  return first<min?min:first;
}
function objNotes(){
  const n=S.pronote&&S.pronote.data&&S.pronote.data.notes;if(!n)return null;
  const mats=(n.matieres||[]).filter(a=>typeof a.eleve==="number");
  let g=typeof n.moyenne==="number"?n.moyenne:(mats.length?mats.reduce((s,a)=>s+a.eleve/(a.sur||20)*20,0)/mats.length:null);
  if(g==null)return null;
  const mm=mats.filter(a=>/math/i.test(a.m||"")),maths=mm.length?mm.reduce((s,a)=>s+a.eleve/(a.sur||20)*20,0)/mm.length:null;
  const sg=clamp01((g-10)/(OBJ_CIBLE-10)),sm=maths==null?sg:clamp01((maths-10)/(OBJ_CIBLE-10));
  const low=mats.map(a=>({m:a.m,v:a.eleve/(a.sur||20)*20})).sort((a,b)=>a.v-b.v)[0]||null;
  return{g,maths,s:0.7*sg+0.3*sm,low,periode:n.periode||""};
}
/* score de régularité : tâches faites / prévues depuis le début (28 jours max), + série de jours parfaits */
function objHab(extraToday){
  const t=today();let n=0,tt=0;
  for(let d=objStart();d<=t;d=add(d,1)){const s=dayStats(d);tt+=s.t;n+=s.n;if(+d===+t&&extraToday)n=Math.min(tt,n+extraToday)}
  const rate=tt?n/tt:0,st=streak();
  return{rate,streak:st,s:0.85*rate+0.15*Math.min(st/14,1)};
}
/* score finance : défi du jour (réussite) et question d'actu, sur 14 jours max ; + niveau du Trading Lab */
function objFin(sim){
  const p=prog(),t=today(),st=objStart(),d0=add(t,-13),from=st>d0?st:d0;let sum=0,nd=0,done=0;
  const days={...p.days},actu={...p.actu};let xp=p.xp;
  if(sim&&sim.defi){const k=dkey(t);if(!days[k]){days[k]={s:5,m:5};xp+=60}}
  if(sim&&sim.actu&&S.jeu.actu){const a=S.jeu.actu;if(!actu[a.date]){actu[a.date]={ok:true};xp+=10}}
  for(let d=new Date(from);d<=t;d=add(d,1)){
    const k=dkey(d),r=days[k],we=d.getDay()===0||d.getDay()===6;nd++;
    const def=r?0.5+0.5*(r.m?r.s/r.m:1):0;if(r)done++;
    sum+=we?def:0.8*def+(actu[k]?0.2:0);
  }
  const reg=nd?sum/nd:0,lvl=Math.min(xp/1000,1);
  return{reg,lvl,done,nd,xp,s:0.7*reg+0.3*lvl};
}
function objScore(o){
  o=o||{};const N=objNotes(),H=objHab(o.hab||0),F=objFin(o);
  const total=OBJ_W.n*(N?N.s:0)+OBJ_W.h*H.s+OBJ_W.f*F.s;
  return{total,N,H,F};
}
/* ce qui ferait monter le pourcentage tout de suite */
function objActions(sc){
  const out=[],t=today(),ts=dayStats(t),rest=ts.t-ts.n;
  if(rest>0){const d=objScore({hab:rest}).total-sc.total;if(d>0.04)out.push({g:d,t:`Coche ${rest>1?"les "+rest+" tâches qui restent":"la tâche qui reste"} aujourd'hui`,p:"hab"})}
  if(!prog().days[dkey(t)]){const d=objScore({defi:true}).total-sc.total;if(d>0.04)out.push({g:d,t:"Fais le défi du jour du Trading Lab",p:"fin"})}
  const a=S.jeu.actu;if(a&&a.date===dkey(t)&&!prog().actu[a.date]){const d=objScore({actu:true}).total-sc.total;if(d>0.04)out.push({g:d,t:"Réponds à la question d'actu (Finance)",p:"fin"})}
  if(!sc.N)out.push({g:null,t:"Relie Pronote : tes notes comptent pour 50 % du score",p:"pron"});
  else{
    if(sc.N.g<OBJ_CIBLE)out.push({g:OBJ_W.n*0.7/(OBJ_CIBLE-10),t:`+1 point de moyenne générale (${pct1(sc.N.g)} → ${pct1(Math.min(20,sc.N.g+1))})`,per:true,p:"pron"});
    if(sc.N.maths!=null&&sc.N.maths<OBJ_CIBLE)out.push({g:OBJ_W.n*0.3/(OBJ_CIBLE-10),t:`+1 point de moyenne en maths (${pct1(sc.N.maths)} → ${pct1(Math.min(20,sc.N.maths+1))})`,per:true,p:"cours"});
    if(sc.N.low&&sc.N.low.v<OBJ_CIBLE-2)out.push({g:null,t:`Ta matière la plus basse : ${sc.N.low.m} (${pct1(sc.N.low.v)}). C'est là qu'un point se gagne le plus vite.`,p:"pron"});
  }
  return out.sort((x,y)=>(y.per?0:1)-(x.per?0:1)||(y.g||0)-(x.g||0));
}
function objNeed(sc){
  const r=[["notes",sc.N?sc.N.s:0],["hab",sc.H.s],["fin",sc.F.s]].sort((a,b)=>a[1]-b[1]);
  return r[0][1]>=0.75?"elan":r[0][0];
}
function objQuote(sc){const need=objNeed(sc),L=OBJ_Q[need];return{need,q:L[hashStr(dkey(today())+need)%L.length]}}
/* une valeur par jour, pour la courbe de progression */
function objSnap(sc){
  if(!S.objectif)return;const k=dkey(today()),cur=S.objectif[k],v={p:Math.round(sc.total*10)/10,n:Math.round((sc.N?sc.N.s:0)*1000)/1000,h:Math.round(sc.H.s*1000)/1000,f:Math.round(sc.F.s*1000)/1000};
  if(!cur||Math.abs((cur.p||0)-v.p)>=0.05)put("objectif",k,v,true);
}
function objPrev(){const k=dkey(today()),ks=Object.keys(S.objectif||{}).filter(x=>x<k).sort();return ks.length?S.objectif[ks[ks.length-1]]:null}
function objChart(){
  const pts=Object.entries(S.objectif||{}).filter(([k])=>/^\d{4}-/.test(k)).sort((a,b)=>a[0].localeCompare(b[0])).slice(-60);
  if(pts.length<2)return`<p class="muted small">La courbe apparaît dès demain : l'appli garde ton pourcentage de chaque jour.</p>`;
  const W=420,H=190,L=40,R=12,T=14,B=28,iw=W-L-R,ih=H-T-B,vals=pts.map(p=>p[1].p),mn=Math.max(0,Math.floor((Math.min(...vals)-5)/10)*10),mx=Math.min(100,Math.ceil((Math.max(...vals)+5)/10)*10);
  const x=i=>L+i*iw/(pts.length-1),y=v=>T+ih*(1-(v-mn)/((mx-mn)||1));
  const grid=[mn,(mn+mx)/2,mx].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.round(v)}%</text>`).join("");
  const st=Math.ceil(pts.length/5),lab=pts.map(([k],i)=>(i%st===0||i===pts.length-1)?`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="12" fill="var(--muted)">${+k.slice(8)}/${k.slice(5,7)}</text>`:"").join("");
  const line=pts.map((p,i)=>`${x(i)},${y(p[1].p)}`).join(" "),last=vals[vals.length-1];
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du pourcentage">${grid}<polyline points="${line}" fill="none" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${x(pts.length-1)}" cy="${y(last)}" r="5" fill="var(--c)"/>${lab}</svg>`;
}
function objRing(p){const r=54,Lc=2*Math.PI*r;return`<svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/>
  <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--c)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Lc}" stroke-dashoffset="${Lc*(1-p/100)}" transform="rotate(-90 66 66)"/></svg>`}
function pageObj(){

    ${bar("Régularité",OBJ_W.h,H.s,`${Math.round(H.rate*100)} % de tes tâches faites depuis le début · série de ${H.streak} jour${H.streak>1?"s":""} parfait${H.streak>1?"s":""}`,"hab")}

let SESSION=lsGet("cerveau-session",null);
function saveSession(s){SESSION=s;lsSet("cerveau-session",s)}
async function sbAuth(path,body,token){
  const c=cfg();const h={apikey:c.supabaseKey,"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;
  const r=await fetch(c.supabaseUrl+"/auth/v1/"+path,{method:body?"POST":"GET",headers:h,body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||j.error||("Erreur "+r.status));e.status=r.status;throw e}
  return j;
}
const sessFrom=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email}});
function authErr(m){m=String(m||"");if(/invalid login|invalid credentials/i.test(m))return"E-mail ou mot de passe incorrect.";if(/not confirmed/i.test(m))return"Confirme d'abord ton adresse e-mail (lien reçu par mail).";if(/already registered|already exists/i.test(m))return"Ce compte existe déjà : connecte-toi.";if(/password/i.test(m))return"Mot de passe trop faible : 8 caractères minimum.";if(/fetch|network/i.test(m))return"Pas de connexion internet.";return m}
async function signIn(email,pw){const j=await sbAuth("token?grant_type=password",{email,password:pw});saveSession(sessFrom(j));lsSet("cerveau-lastpull",null);await fullSync(true)}
async function signUp(email,pw){
  const j=await sbAuth("signup?redirect_to="+encodeURIComponent(location.origin+location.pathname),{email,password:pw});
  if(j.access_token){saveSession(sessFrom(j));await fullSync(true);return"ok"}return"confirm";
}
async function handleAuthHash(){
  if(!/access_token=/.test(location.hash)||!cfgOk())return;
  const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,"",location.pathname+location.search);
  try{const u=await sbAuth("user",null,p.get("access_token"));
    saveSession({access_token:p.get("access_token"),refresh_token:p.get("refresh_token"),expires_at:Math.floor(Date.now()/1000)+(+p.get("expires_in")||3600),user:{id:u.id,email:u.email}});
    V.authMsg="Adresse confirmée, tu es connecté.";await fullSync(true);
  }catch(e){V.authMsg="Le lien de confirmation a expiré : connecte-toi avec ton mot de passe."}
  render(true);
}
async function token(){
  if(!SESSION)return null;
  if(SESSION.expires_at-90<Date.now()/1000){
    try{const j=await sbAuth("token?grant_type=refresh_token",{refresh_token:SESSION.refresh_token});saveSession(sessFrom(j))}
    catch(e){if(e.status>=400&&e.status<500){saveSession(null);setSync("Reconnecte-toi dans Réglages");render()}return null}
  }
  return SESSION.access_token;
}
async function sbRest(method,path,body,extra){
  const c=cfg(),t=await token();if(!t)throw new Error("Pas de session");
  const r=await fetch(c.supabaseUrl+"/rest/v1/"+path,{method,headers:{apikey:c.supabaseKey,Authorization:"Bearer "+t,"Content-Type":"application/json",...(extra||{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const tx=await r.text().catch(()=>"");const e=new Error("HTTP "+r.status+" "+tx.slice(0,200));e.status=r.status;throw e}
  if(r.status===204)return null;const tx=await r.text();return tx?JSON.parse(tx):null;
}

/* ---------- synchronisation : tout part d'abord sur l'appareil, puis vers le compte ---------- */
let OUTBOX=lsGet("cerveau-outbox",{});
function enqueue(col,id,data,deleted){if(NOUP(col,id))return;OUTBOX[col+"|"+id]={col,id,data:deleted?{}:data,deleted:!!deleted,ts:Date.now()};lsSet("cerveau-outbox",OUTBOX);flushSoon()}
let flT=null;function flushSoon(){clearTimeout(flT);flT=setTimeout(flush,700)}
let flushing=false;
async function flush(){
  if(flushing||!SESSION||!cfgOk())return;
  const items=Object.values(OUTBOX);if(!items.length)return;
  if(!navigator.onLine){setSync("Hors ligne · enregistré sur l'appareil");return}
  flushing=true;
  try{
    for(let i=0;i<items.length;i+=200){
      const chunk=items.slice(i,i+200);
      await sbRest("POST","docs?on_conflict=user_id,col,id",chunk.map(x=>({user_id:SESSION.user.id,col:x.col,id:x.id,data:x.data,deleted:x.deleted})),{Prefer:"resolution=merge-duplicates,return=minimal"});
      chunk.forEach(x=>{const k=x.col+"|"+x.id;if(OUTBOX[k]&&OUTBOX[k].ts===x.ts)delete OUTBOX[k]});
    }
    lsSet("cerveau-outbox",OUTBOX);lsSet("cerveau-lastsync",Date.now());setSync("Synchronisé");
  }catch(e){setSync(navigator.onLine?"Synchro en attente":"Hors ligne · enregistré sur l'appareil")}
  finally{flushing=false;if(Object.keys(OUTBOX).length&&navigator.onLine&&SESSION)setTimeout(flushSoon,15000)}
}
let pulling=false;
async function pull(full){
  if(pulling||!SESSION||!cfgOk()||!navigator.onLine)return false;
  pulling=true;let changed=false;
  try{
    const last=full?null:lsGet("cerveau-lastpull",null);let maxTs=last||"",off=0;const seen=new Set();
    const since=last?new Date(Date.parse(last)-5000).toISOString():null;
    for(;;){
      const rows=await sbRest("GET","docs?select=col,id,data,deleted,updated_at&order=updated_at.asc&limit=1000&offset="+off+(since?"&updated_at=gt."+encodeURIComponent(since):""));
      if(!rows||!rows.length)break;
      for(const r of rows){
        const k=r.col+"|"+r.id;seen.add(k);if(r.updated_at>maxTs)maxTs=r.updated_at;
        if(OUTBOX[k]||NOSYNC(r.col,r.id)||!C.includes(r.col))continue;
        if(r.deleted){if(S[r.col]&&S[r.col][r.id]!==undefined){const n={...S[r.col]};delete n[r.id];S[r.col]=n;changed=true}}
        else if(JSON.stringify(S[r.col][r.id])!==JSON.stringify(r.data)){S[r.col]={...S[r.col],[r.id]:r.data};changed=true}
      }
      if(rows.length<1000)break;off+=1000;
    }
    if(full)C.forEach(c=>Object.keys(S[c]||{}).forEach(id=>{if(!seen.has(c+"|"+id)&&!NOUP(c,id))enqueue(c,id,S[c][id],false)}));
    if(maxTs)lsSet("cerveau-lastpull",maxTs);
    lsSet("cerveau-lastsync",Date.now());
    if(changed){localSaveSoon();render()}
    if(!Object.keys(OUTBOX).length)setSync("Synchronisé");
    return true;
  }catch(e){setSync("Synchro en attente");return false}
  finally{pulling=false}
}
async function fullSync(full){await flush();await pull(full);await flush()}
function lastSyncTxt(){const t=lsGet("cerveau-lastsync",0);if(!t)return"";const m=Math.round((Date.now()-t)/60000);return" · dernière synchro "+(m<1?"à l'instant":m<60?"il y a "+m+" min":"le "+fts(t))}

function setupAI(){const a=aiCfg();if(a.provider==="ollama"||a.key){SAMPLE=aiSample;SAMPLE_ST="ok"}else{SAMPLE=null;SAMPLE_ST="none"}TOOLS_OK=false}
function mergeTurns(input){
  const t=typeof input==="string"?[{role:"user",content:input}]:input,out=[];
  t.forEach(m=>{const role=m.role==="assistant"?"assistant":"user";if(out.length&&out[out.length-1].role===role)out[out.length-1].content+="\n\n"+m.content;else out.push({role,content:String(m.content)})});
  return out;
}
async function readLines(r,fn){
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line)try{fn(line)}catch(e){}}}
  if(buf.trim())try{fn(buf.trim())}catch(e){}
}
async function aiSample(input,opts={}){
  const a=aiCfg(),turns=mergeTurns(input),json=!!opts._json;let text="";
  const emit=d=>{if(!d)return;text+=d;try{opts.onText&&opts.onText({text,delta:d})}catch(e){}};
  try{
    if(a.provider==="ollama"){
      const r=await fetch(a.ollamaUrl.replace(/\/+$/,"")+"/api/chat",{method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:a.model||"llama3.2",messages:turns,stream:true,...(json?{format:"json"}:{})})});
      if(!r.ok)throw{code:r.status===404?"bad_model":"upstream_error",message:"Ollama "+r.status};
      await readLines(r,line=>{const j=JSON.parse(line);if(j.message&&j.message.content)emit(j.message.content)});
    }else{
      if(!a.key)throw{code:"no_key"};
      const model=a.model||"gemini-3.5-flash";
      const body={contents:turns.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),generationConfig:{temperature:0.5,...(json?{responseMimeType:"application/json"}:{})}};
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":streamGenerateContent?alt=sse",
        {method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json","x-goog-api-key":a.key},body:JSON.stringify(body)});
      if(!r.ok){const tx=await r.text().catch(()=>"");let em=tx;try{const j=JSON.parse(tx);em=(j.error&&(j.error.message||j.error.status))||tx}catch(_){}
        throw{code:r.status===429?"rate_limited":r.status===404?"bad_model":(r.status===400||r.status===401||r.status===403)&&/api.?key|permission|unauth/i.test(tx)?"bad_key":"upstream_error",message:"HTTP "+r.status+" : "+String(em).slice(0,220)}}
      await readLines(r,line=>{if(!line.startsWith("data:"))return;const j=JSON.parse(line.slice(5));
        const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];parts.forEach(p=>{if(p.text&&!p.thought)emit(p.text)})});
    }
  }catch(e){
    if(e&&e.name==="AbortError")throw{code:"cancelled",text:text||undefined};
    if(e&&e.code)throw{...e,text:text||undefined};
    throw{code:navigator.onLine?(a.provider==="ollama"?"ollama_down":"upstream_error"):"offline",text:text||undefined,message:String(e&&e.message||e)};
  }
  if(!text.trim())throw{code:"empty_completion"};
  return{text,truncated:false,modelTierApplied:"default"};
}
aiSample.json=async(input,opts={})=>{
  const r=await aiSample(input,{...opts,_json:true}),t=r.text.trim(),m=t.match(/```(?:json)?\s*([\s\S]*?)```/),s=m?m[1]:t;
  try{return JSON.parse(s)}catch(e){
    const idx=[s.indexOf("["),s.indexOf("{")].filter(i=>i>=0),a=idx.length?Math.min(...idx):-1,b=Math.max(s.lastIndexOf("]"),s.lastIndexOf("}"));
    if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(_){}}
    throw{code:"invalid_json",text:r.text};
  }
};

/* nom de la fonction dans Supabase : « pronote », ou le nom donné automatiquement par Supabase */
const PN_SLUGS=["pronote","dynamic-worker"];
async function pnCall(action,extra){
  const saved=lsGet("cerveau-pn-slug",null),order=saved?[saved,...PN_SLUGS.filter(x=>x!==saved)]:PN_SLUGS;let last;
  for(const slug of order){
    try{const j=await pnCallSlug(slug,action,extra);lsSet("cerveau-pn-slug",slug);return j}
    catch(e){last=e;if(e.code!=="unreachable"&&e.code!=="not_deployed")throw e}
  }
  throw last;
}
async function pnCallSlug(slug,action,extra){
  if(!cfgOk()||!SESSION)throw{code:"no_session"};const t=await token();if(!t)throw{code:"no_session"};const c=cfg();
  let r;try{r=await fetch(c.supabaseUrl+"/functions/v1/"+slug,{method:"POST",headers:{apikey:c.supabaseKey,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({action,...(extra||{})})})}
  catch(e){throw{code:navigator.onLine?"unreachable":"offline",detail:String(e&&e.message||e)}}
  const tx=await r.text();let j={};try{j=JSON.parse(tx)}catch(e){}
  if(r.status===404&&!j.error)throw{code:"not_deployed"};
  if(!r.ok||j.error)throw{code:j.error||(r.status===401?"auth":"http_"+r.status),detail:j.detail||j.message||tx.slice(0,160)};
  return j;
}

/* ---- lecture du QR code : caméra ou photo ---- */
function pnLoadQR(i=0){return window.jsQR?Promise.resolve(window.jsQR):new Promise((res,rej)=>{if(i>=PN_JSQR.length)return rej(new Error("jsQR"));
  const s=document.createElement("script");s.src=PN_JSQR[i];s.onload=()=>window.jsQR?res(window.jsQR):rej(new Error("jsQR"));s.onerror=()=>{s.remove();pnLoadQR(i+1).then(res,rej)};document.head.appendChild(s)})}
function pnQrOk(t){try{const o=JSON.parse(t);return!!(o&&o.url&&o.jeton&&o.login)}catch(e){return false}}
function pnGotQR(t){
  if(!pnQrOk(t)){V.pnMsg="Ce QR code n'est pas celui de Pronote pour l'appli mobile.";return render(true)}
  V.pnQR=t;V.pnMsg="";render(true);setTimeout(()=>{const i=document.getElementById("pn-pin");if(i)i.focus()},60);
}
async function pnScan(){
  let jsQR;try{jsQR=await pnLoadQR()}catch(e){V.pnMsg="Le lecteur de QR code ne se charge pas : vérifie ta connexion.";return render(true)}
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}
  catch(e){V.pnMsg="L'appareil photo n'est pas accessible. Autorise-le, ou prends une photo du QR code et utilise « Choisir une photo ».";return render(true)}
  const ov=document.createElement("div");ov.className="pnscan";
  ov.innerHTML=`<video playsinline muted autoplay></video><p>Vise le QR code affiché par Pronote sur ton ordi</p><button type="button" class="btn">Annuler</button>`;
  document.body.appendChild(ov);
  const v=ov.querySelector("video"),cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});v.srcObject=st;
  let on=true;const stop=()=>{on=false;st.getTracks().forEach(t=>t.stop());ov.remove()};ov.querySelector("button").onclick=stop;
  const tick=()=>{if(!on)return;
    if(v.readyState>=2&&v.videoWidth){const w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
      const q=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(q&&q.data){stop();return pnGotQR(q.data)}}
    requestAnimationFrame(tick)};
  try{await v.play()}catch(e){}requestAnimationFrame(tick);
}
async function pnImage(file){
  let jsQR;try{jsQR=await pnLoadQR()}catch(e){V.pnMsg="Le lecteur de QR code ne se charge pas : vérifie ta connexion.";return render(true)}
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement("canvas");cv.width=w;cv.height=h;
    const cx=cv.getContext("2d");cx.drawImage(im,0,0,w,h);const q=jsQR(cx.getImageData(0,0,w,h).data,w,h);URL.revokeObjectURL(url);
    if(q&&q.data)pnGotQR(q.data);else{V.pnMsg="Aucun QR code trouvé sur cette image : prends-la de plus près, bien nette.";render(true)}};
  im.onerror=()=>{URL.revokeObjectURL(url);V.pnMsg="Image illisible.";render(true)};im.src=url;
}

      <li>Appuie sur <b>Scanner le QR code</b>, vise l'écran, tape ton code, puis <b>Connecter</b>. Le QR code ne dure que 10 minutes : fais-le d'un coup.</li></ol>
    <h4>Cas 2 : le message parle de « page », de « challenge », ou ça échoue même avec un nouveau QR code</h4>
    <p class="small">Pronote a sûrement fait une mise à jour. Il faut mettre à jour la bibliothèque qui parle à Pronote. Ça prend 3 minutes :</p>
    <ol class="aidesteps"><li>Ouvre ${A(L.npm,"la page de la bibliothèque Pawnote-LTS")} et note le <b>numéro de version</b> écrit en haut (par exemple 1.6.5).</li>
      <li>Ouvre ${A(L.fn,"le code de ta fonction Pronote dans Supabase")}.</li>
      <li>À la <b>ligne 7</b>, tu vois : <code>import * as P from "npm:@blockshub/pawnote-lts@1.6.4";</code>. Remplace seulement le numéro à la fin (<code>1.6.4</code>) par le nouveau. Ne touche à rien d'autre.</li>
      <li>Clique sur <b>Deploy updates</b> et attends le message de réussite.</li>
      <li>Refais le <b>cas 1</b>, avec un nouveau QR code.</li></ol>
    <p class="small">Si le numéro est déjà le même, ou si ça ne marche toujours pas : va tout en bas de cette page, appuie sur « Copier les infos pour demander de l'aide » et colle-les à une IA gratuite. Ajoute le code de ta fonction : dans Supabase, onglet <b>Code</b>, puis Ctrl + A et Ctrl + C.</p>
    <h4>Cas 3 : « La fonction Pronote ne répond pas »</h4>
    <ol class="aidesteps"><li>Ton projet Supabase est sans doute en pause : suis la partie <b>« Mes données ne se synchronisent plus »</b> ci-dessous.</li>
      <li>Ensuite, sur la page Pronote de l'appli, appuie sur <b>↻ Actualiser</b>.</li></ol></details>

  <details class="card aide" ${o("ia")}><summary>🤖 L'IA ne répond plus (profs, traducteur)</summary>
    <h4>« Quota gratuit de l'IA atteint »</h4>
    <p class="small">Rien n'est cassé : Google limite le nombre de messages gratuits par jour. Réessaie plus tard ou demain.</p>
    <h4>« La clé d'IA est refusée »</h4>
    <ol class="aidesteps"><li>Ouvre ${A(L.studio,"Google AI Studio, page des clés")} avec ton compte Google.</li>
      <li>Clique sur <b>Create API key</b>, puis copie la clé qui s'affiche. Ne l'envoie à personne.</li>
      <li>Dans l'appli : ⚙️ Réglages → Intelligence artificielle → colle la clé → <b>Enregistrer et tester</b>.</li>
      <li>Fais-le aussi sur ton autre appareil, car la clé est enregistrée sur chaque appareil.</li>
      <li>Pour les résumés de l'actu : ouvre ${A(L.secrets,"les secrets de ton dépôt GitHub")} → <b>GEMINI_API_KEY</b> → crayon ✏️ → colle la nouvelle clé → <b>Update secret</b>.</li></ol>
    <h4>« Ce modèle d'IA n'existe pas »</h4>
    <ol class="aidesteps"><li>Dans ${A(L.studio,"Google AI Studio")}, regarde le nom des modèles « Flash » proposés, par exemple <code>gemini-3.5-flash</code>.</li>
      <li>Dans l'appli : ⚙️ Réglages → champ <b>Modèle</b> → tape ce nom → <b>Enregistrer et tester</b>.</li>
      <li>Pour l'actu : ouvre ${A(L.vars,"les variables de ton dépôt GitHub")}. Crée ou modifie la variable <b>GEMINI_MODEL</b> avec le même nom.</li></ol></details>

  <details class="card aide" ${o("sync")}><summary>🔄 Mes données ne se synchronisent plus</summary>
    <p class="small">Signes : l'accueil affiche « Synchro en attente », ou ton autre appareil ne voit pas tes changements. Tes données restent aussi enregistrées sur chaque appareil : rien n'est perdu.</p>
    <ol class="aidesteps"><li>Ouvre ${A(L.sb,"ton projet Supabase")}.</li>
      <li>Si tu vois « Project is paused » : clique sur <b>Restore project</b> et attends 2 à 5 minutes que tout redevienne vert. Ça arrive si l'appli n'est pas utilisée pendant 7 jours.</li>
      <li>Dans l'appli : ⚙️ Réglages → <b>Synchroniser maintenant</b>.</li>
      <li>Si l'appli dit « Reconnecte-toi » : ⚙️ Réglages → <b>Se connecter</b>, avec le même e-mail et le même mot de passe.</li></ol></details>

  <details class="card aide" ${o("actu")}><summary>📰 L'actu ou les cours de la bourse ne bougent plus</summary>
    <p class="small">Signe : les articles et les cours datent de plusieurs jours, en semaine.</p>
    <ol class="aidesteps"><li>Ouvre ${A(L.actions,"l'onglet Actions de ton dépôt GitHub")}.</li>
      <li>À gauche, clique sur <b>Actu du jour</b>.</li>
      <li>Si un bandeau jaune dit « This scheduled workflow is disabled » : clique sur <b>Enable workflow</b>. GitHub l'arrête après 60 jours sans activité.</li>
      <li>Clique sur <b>Run workflow</b>, puis sur le bouton vert <b>Run workflow</b>. Attends 1 minute : une coche verte ✓ doit apparaître.</li>
      <li>Si c'est une croix rouge ✗ : clique dessus et lis le message. S'il parle de « Gemini », suis la partie <b>« L'IA ne répond plus »</b> (étape GitHub). Les titres des articles arrivent quand même.</li></ol></details>

  <details class="card aide" ${o("app")}><summary>📱 L'appli ne s'ouvre plus ou n'est pas à jour</summary>
    <ol class="aidesteps"><li>Ferme complètement l'appli, puis rouvre-la avec internet. Fais-le deux fois.</li>
      <li>Ouvre ${A(L.app,"l'adresse de l'appli")} dans Safari ou Chrome. Si elle s'ouvre, réinstalle l'appli depuis là (⚙️ Réglages → Installer l'appli).</li>
      <li>Si GitHub affiche une erreur 404 : ouvre ${A(L.pages,"les réglages Pages de ton dépôt")}. Vérifie <b>Deploy from a branch</b>, branche <b>main</b>, dossier <b>/ (root)</b>, puis <b>Save</b>.</li>
      <li>Si tu as perdu des données : accueil → 💾 Mes données → <b>Restaurer un fichier</b>, et choisis ta dernière sauvegarde.</li></ol></details>

  <details class="card aide" ${o("appareil")}><summary>💻 Nouveau téléphone ou nouvel ordi</summary>
    <ol class="aidesteps"><li>Ouvre ${A(L.app,"l'adresse de l'appli")} et installe-la : sur iPhone, bouton Partager → « Sur l'écran d'accueil » ; sur ordi, l'icône d'installation de Chrome ; sur Mac avec Safari, Fichier → Ajouter au Dock.</li>
      <li>⚙️ Réglages → <b>Se connecter</b>, avec le même e-mail et le même mot de passe. Tout revient tout seul, Pronote compris.</li>
      <li>⚙️ Réglages → Intelligence artificielle → colle ta clé Gemini.</li></ol></details>

  <div class="card stack"><p class="label" style="margin:0">Toujours bloqué ?</p>
    <p class="small">Copie les infos de ton appli et colle-les dans une IA gratuite (Claude, Gemini, ChatGPT…) avec une capture du message d'erreur : elle aura tout ce qu'il faut pour t'aider. Ces infos ne contiennent ni mot de passe ni clé.</p>
    <div><button class="btn" data-aidecopy="1">📋 Copier les infos pour demander de l'aide</button></div>
    ${V.aideMsg?`<p class="small">${esc(V.aideMsg)}</p>`:""}${V.aideShow?`<textarea class="field" rows="10" readonly onfocus="this.select()">${esc(aideInfo())}</textarea>`:""}</div>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.aide)V.aideOpen=d.aide;
  if(d.aidecopy){const t=aideInfo();
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject())
      .then(()=>{V.aideMsg="✓ Copié. Colle-le dans une IA gratuite, avec une capture de l'erreur.";V.aideShow=false;render(true)})
      .catch(()=>{V.aideMsg="Sélectionne le texte ci-dessous et copie-le.";V.aideShow=true;render(true)});}
});

/* ================================================================
   RENDU
   ================================================================ */
const PAGES={reglages:pageReglages,aide:pageAide,pron:pagePron,hab:pageHab,proj:pageProj,fin:pageFin,obj:pageObj,cours:pageCours};
let pending=false;
function render(force){
  const a=document.activeElement;
  if(!force&&a&&a.matches&&a.matches("input:not([type=checkbox]),select,textarea,[contenteditable]")&&a.closest("#app")){pending=true;return}
  pending=false;
  const app=document.getElementById("app");
  if(V.page==="home"||!PAGES[V.page]){app.innerHTML=pageHome();return}
  if(V.page==="proj"){app.innerHTML=`<div class="sec notesapp" style="--c:var(--ny)">${pageProj()}</div>`;return}
  const n=(SECT.find(s=>s[0]===V.page)||[0,V.page==="aide"?"Dépannage":"Réglages"])[1];
  app.innerHTML=`<div class="sec" style="--c:var(${COL[V.page]||"--proj"})"><div class="head"><button class="back" data-page="home" aria-label="Accueil">‹</button><h1>${n}</h1>${(ILL[V.page]||"").replace('class="ill"',"")}</div>${PAGES[V.page]()}</div>`;
}
/* on attend la fin du toucher : sinon le bouton visé disparaît avant le clic */
document.addEventListener("focusout",()=>setTimeout(()=>{if(pending)render()},350));

/* ================================================================
   INTERACTIONS
   ================================================================ */
function go(p){if(V.note)nSave();V.page=p;V.confirm=null;V.chap=null;V.proj=null;V.note=null;V.ndraft=null;V.nf=null;V.nq="";V.newf=false;V.renf=false;if(p==="proj")nHousekeep();saveV();render(true);window.scrollTo(0,0)}
function confirmOr(id,fn){if(V.confirm===id){V.confirm=null;return fn()}V.confirm=id;render(true)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.page!==undefined)return go(d.page);
  if(d.aiprov){const a=aiCfg();a.provider=d.aiprov;lsSet("cerveau-ai",a);setupAI();V.aiMsg="";return render(true)}
  if(d.syncnow){setSync("Synchronisation…");render(true);return fullSync(false).then(()=>render(true))}
  if(d.logout){saveSession(null);lsSet("cerveau-lastpull",null);setSync("Non connecté");return render(true)}
  if(d.resetcfg){lsSet("cerveau-cfg",null);saveSession(null);lsSet("cerveau-lastpull",null);return render(true)}
  if(d.install&&INSTALL_EVT){INSTALL_EVT.prompt();INSTALL_EVT.userChoice.finally(()=>{INSTALL_EVT=null;render(true)});return}
  /* trading lab */
  if(d.ftab){V.ftab=d.ftab;saveV();return render(true)}
  if(d.play){const[m,k]=d.play.split("|");startGame(m,k);return window.scrollTo(0,0)}
  if(d.gpick!==undefined&&V.g)return gAnswer(+d.gpick);
  if(d.gnext&&V.g)return gNext();
  if(d.gquit){V.g=null;return render(true)}
  if(d.sim&&V.g&&V.g.sim)return simStep(d.sim);
  if(d.actu!==undefined){const a=S.jeu.actu,i=+d.actu;if(!a||prog().actu[a.date])return;const ok=i===a.a;return addXp(q=>{q.actu[a.date]={p:i,ok};if(ok)q.xp+=10})}
  /* données */
  if(d.export)return exportData();
  if(d.impok)return importData();
  if(d.impno){V.imp=null;V.dataMsg="";return render(true)}
  if(d.a==="prev"){V.day=add(V.day,-1);return render(true)}
  if(d.a==="next"){const n=add(V.day,1);if(n<=today())V.day=n;return render(true)}
  if(d.go){const[y,m,dd]=d.go.split("-").map(Number);V.day=new Date(y,m-1,dd);return render(true)}
  if(d.range){V.range=+d.range;return render(true)}
  /* cours */
  if(d.subj){V.subj=d.subj;saveV();return render(true)}
  if(d.open){V.chap=d.open;V.ctab="cours";V.lvl=0;render(true);return window.scrollTo(0,0)}
  if(d.closechap){V.chap=null;return render(true)}
  if(d.st!==undefined&&V.chap){const[sk,ck]=V.chap.split("|"),st={...(((S.cours[sk]||{}).st)||{})};st[ck]=+d.st;return put("cours",sk,{st})}
  if(d.rev){V.rev[d.rev]=!V.rev[d.rev];return render(true)}
  if(d.score){const[sk,ck,qi,res]=d.score.split("|"),q={...((S.quiz[sk]||{}).r||{})},cur={ok:0,ko:0,...(q[ck]||{})};cur[res]++;q[ck]=cur;V.rev[sk+"|"+ck+"|"+qi]=false;return put("quiz",sk,{r:q})}
  if(d.toprof)return toProf(d.toprof);
  if(d.ctab){V.ctab=d.ctab;return render(true)}
  if(d.lvl!==undefined){V.lvl=+d.lvl;return render(true)}
  if(d.tier){V.tier=d.tier;saveV();return render(true)}
  if(d.quick){const[sk,ck,i]=d.quick.split("|");if(ck!=="all")V.ctab="prof";sendChat(sk,ck,QUICK[+i]);return render(true)}
  if(d.stop){const c=V.ctl[d.stop];if(c)c.abort();return}
  if(d.clearchat){const id=d.clearchat;return confirmOr("chat|"+id,()=>del("chats",id))}
  if(d.fiche){const[sk,ck]=d.fiche.split("|");return genFiche(sk,ck)}
  if(d.gen)return genQuestions(d.gen);
  /* finance */
  if(d.lang){V.lang=d.lang;V.gflip=false;V.trDir=d.lang==="fr"?"en-fr":"fr-en";saveV();return render(true)}
  if(d.flip){V.gflip=!V.gflip;return render(true)}
  if(d.gl){V.gflip=false;V.gi=d.gl==="r"?Math.floor(Math.random()*GLOSS.length):(V.gi+ +d.gl+GLOSS.length)%GLOSS.length;return render(true)}
  if(d.trdir){V.trDir=d.trdir;return render(true)}
  /* 🪶 notes */
  if(d.nf!==undefined){V.nf=d.nf||null;V.nq="";V.newf=false;V.renf=false;V.confirm=null;nHousekeep();render(true);return window.scrollTo(0,0)}
  if(d.note){V.note=d.note;V.confirm=null;render(true);return window.scrollTo(0,0)}
  if(d.nback)return nBack();
  if(d.ncompose)return nCompose();
  if(d.nok){nSave();const el=document.getElementById("ned");if(el)el.blur();return}
  if(d.fmt)return nFormat(d.fmt);
  if(d.ntoggle)return nToggle(d.ntoggle);
  if(d.newf!==undefined){V.newf=d.newf==="1";render(true);const i=document.getElementById("nf-nom");if(i)i.focus();return}
  if(d.nfren){V.renf=true;render(true);const i=document.getElementById("nf-ren");if(i){i.focus();i.select()}return}
  if(d.nfdel)return confirmOr(d.nfdel,()=>{const f=d.nfdel,now=Date.now();nIn(f).forEach(([id,n])=>put("notes",id,{...n,suppr:now},true));del("projets",f);V.nf=null;render(true)});
  if(d.npin){nSave();const n=S.notes[d.npin];if(n){put("notes",d.npin,{...n,epingle:!n.epingle},true);render(true)}return}
  if(d.ndel){nSave();const n=S.notes[d.ndel];if(n&&String(n.txt||"").trim())put("notes",d.ndel,{...n,suppr:Date.now()},true);else if(n)del("notes",d.ndel);V.note=null;V.ndraft=null;render(true);return window.scrollTo(0,0)}
  if(d.nrest){const n=S.notes[d.nrest];if(n){const r={...n};delete r.suppr;r.maj=Date.now();put("notes",d.nrest,r,true)}V.note=null;return render(true)}
  if(d.nkill)return confirmOr(d.nkill,()=>{del("notes",d.nkill);V.note=null;render(true)});
  if(d.ndeb)return nDebloque(d.ndeb);
  /* lecture */
  if(d.dell)return confirmOr(d.dell,()=>del("livres",d.dell));
  if(d.pg){const[id,n]=d.pg.split("|");setPage(id,(S.livres[id].lu||0)+ +n)}
});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.ans)V.ans[d.ans]=t.value;
  if(d.ned!==undefined)nSaveSoon();
  if(d.nq!==undefined){V.nq=t.value;nFilter()}
  if(d.trin)V.trIn=t.value;
  if(d.ci)V.ci[d.ci]=t.value;
  if(d.gin)V.gin=t.value;
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.hab){const k=dkey(V.day),cur={...((S.jours[k]||{}).done||{})};if(t.checked)cur[d.hab]=true;else delete cur[d.hab];return put("jours",k,{date:k,done:cur})}
  if(d.pnd){const i=d.pnd.lastIndexOf("|"),id=d.pnd.slice(0,i),k=d.pnd.slice(i+1),cur={...((S.jours[k]||{}).done||{})};if(t.checked)cur["pn:"+id]=true;else delete cur["pn:"+id];return put("jours",k,{date:k,done:cur})}
  if(d.nmove!==undefined){nSave();const id=d.nmove,v=t.value||null;if(S.notes[id])put("notes",id,{...S.notes[id],projet:v},true);else if(V.ndraft&&V.ndraft.id===id)V.ndraft.n.projet=v;return render(true)}
  if(d.simstop&&V.g&&V.g.sim){V.g.sim.stop=t.checked;return}
  if(d.imp&&t.files&&t.files[0]){readImport(t.files[0]);t.value="";return}
  if(d.pgset){setTimeout(()=>setPage(d.pgset,+t.value),0)}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,x=Object.fromEntries(new FormData(f));
  const k=f.dataset.f;
  if(k==="cfg"){const u=String(x.url||"").trim(),key=String(x.key||"").trim();if(!/^https:\/\/.+/.test(u)||!key){return}lsSet("cerveau-cfg",{supabaseUrl:u,supabaseKey:key});setSync("Non connecté");return render(true)}
  if(k==="login"){const act=(e.submitter&&e.submitter.value)||"in",em=String(x.email||"").trim(),pw=String(x.pw||"");V.authBusy=true;V.authMsg="";render(true);
    (act==="up"?signUp(em,pw).then(r=>{V.authMsg=r==="ok"?"Compte créé, tu es connecté.":"Compte créé ! Ouvre le mail de confirmation, puis reviens te connecter ici."}):signIn(em,pw).then(()=>{V.authMsg=""}))
      .catch(err=>{V.authMsg=authErr(err.message)}).finally(()=>{V.authBusy=false;render(true)});return}
  if(k==="ai"){const a=aiCfg();if(a.provider==="gemini"){a.key=String(x.key||"").trim()}else{a.ollamaUrl=String(x.url||"").trim()||"http://localhost:11434"}a.model=String(x.model||"").trim();lsSet("cerveau-ai",a);setupAI();document.activeElement&&document.activeElement.blur();return testAI()}
  if(k==="gnum"){document.activeElement&&document.activeElement.blur();return gAnswer(V.gin)}
  if(k==="chat"){const[sk,ck]=f.dataset.chat.split("|");document.activeElement&&document.activeElement.blur();return sendChat(sk,ck,V.ci[sk+"-"+ck])}
  if(k==="tr"){const txt=V.trIn.trim();if(!txt)return;
    return stream("tr",`Traduis ce passage de presse économique ${V.trDir==="en-fr"?"de l'anglais vers le français":"du français vers l'anglais"}, de façon naturelle, dans le style d'un journal économique.
Ensuite, après une ligne contenant seulement « — », liste les 5 termes financiers les plus utiles du passage au format : terme → traduction : explication en une phrase (en français).
Texte :
${txt.slice(0,6000)}`)}
  document.activeElement&&document.activeElement.blur();
  if(k==="nfolder"){const nm=(x.nom||"").trim();if(nm)put("projets",uid(),{nom:nm,cree:Date.now()},true);V.newf=false;return render(true)}
  if(k==="nfren"){const nm=(x.nom||"").trim();if(nm&&nRealF(V.nf))put("projets",V.nf,{...S.projets[V.nf],nom:nm},true);V.renf=false;return render(true)}
  if(k==="lect"){const p=parseInt(x.pages);if(x.titre.trim()&&p>0)put("livres",uid(),{titre:x.titre.trim(),auteur:(x.auteur||"").trim(),pages:p,lu:0,fini:false,maj:Date.now()})}
});

/* ================================================================
   DÉMARRAGE
   ================================================================ */
localLoad();setupAI();
DL={save:({filename,data})=>{const b=new Blob([data],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return Promise.resolve()}};
setSync(!cfgOk()?"Sur cet appareil":SESSION?"Synchronisation…":"Non connecté");
render(true);
loadNews();handleAuthHash();
if(SESSION)fullSync(!lsGet("cerveau-lastpull",null)).then(pnAuto);
setInterval(()=>{if(document.visibilityState==="visible"&&SESSION)pull(false).then(flush)},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(SESSION)pull(false).then(flush).then(pnAuto);loadNews()}});
window.addEventListener("online",()=>{if(SESSION)fullSync(false)});
window.addEventListener("offline",()=>setSync("Hors ligne · enregistré sur l'appareil"));
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INSTALL_EVT=e;if(V.page==="reglages")render()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
