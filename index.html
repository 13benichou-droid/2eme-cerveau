function egSave(p){put("drill","eng",{...egDoc(),...p},true)}
function egDay(p){const k=todayK(),d=egDoc().d||{},cur=d[k]||{};const nd={...d,[k]:{...cur,...p}};const ks=Object.keys(nd).sort();while(ks.length>60)delete nd[ks.shift()];egSave({d:nd})}
const egToday=()=>(egDoc().d||{})[todayK()]||{};
function egStreak(){const d=egDoc().d||{};let s=0,x=today();if(!(d[dkey(x)]&&(d[dkey(x)].v||d[dkey(x)].g||d[dkey(x)].o)))x=add(x,-1);for(let i=0;i<400;i++){const k=dkey(x);if(d[k]&&(d[k].v||d[k].g||d[k].o)){s++;x=add(x,-1)}else break}return s}
function say(t){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(String(t));u.lang="en-US";u.rate=.85;const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));const v=vs.find(v=>/en(-|_)US/i.test(v.lang))||vs[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const egSay=t=>`<button type="button" class="egsay" data-egsay="${esc(t)}" aria-label="Écouter">🔊</button>`;
/* comparer deux phrases sans tenir compte des majuscules, de la ponctuation et des formes courtes */
const EG_NUM={zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",twenty:"20"};
function egNorm(s){return String(s||"").toLowerCase().replace(/[’`´]/g,"'").replace(/\bcan't\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not").replace(/\bcan not\b/g,"cannot")
  .replace(/\bi'm\b/g,"i am").replace(/'re\b/g," are").replace(/'ll\b/g," will").replace(/'ve\b/g," have").replace(/\b(he|she|it|that|there|what)'s\b/g,"$1 is").replace(/'d\b/g," would")
  .replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim().split(" ").map(w=>EG_NUM[w]||w).join(" ")}
function egScore(said,target){const a=egNorm(said).split(" ").filter(Boolean),b=egNorm(target).split(" ").filter(Boolean);if(!b.length)return 0;
  const m=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=a[i-1]===b[j-1]?m[i-1][j-1]+1:Math.max(m[i-1][j],m[i][j-1]);
  const l=m[a.length][b.length];return Math.min(l/b.length,l/Math.max(1,a.length)*1.15)}
const egTxtOk=(said,acc)=>acc.some(x=>egNorm(x)===egNorm(said));

function egQueue(){const v=egDoc().voc||{},t=todayK(),due=EG_VOC.filter(w=>v[w.en]&&v[w.en].due<=t).sort((a,b)=>(v[a.en].b-v[b.en].b)||(v[a.en].due<v[b.en].due?-1:1));
  const introduced=EG_VOC.filter(w=>v[w.en]&&v[w.en].first===t).length,fresh=EG_VOC.filter(w=>!v[w.en]).slice(0,Math.max(0,EG_NEW-introduced));
  return[...due,...fresh].map(w=>w.en)}
function egVocStart(){const q=egQueue();V.eg={m:"voc",q,i:0,flip:false,ok:0,n:q.length};render(true)}
function egVocAns(knew){const st=V.eg,en=st.q[st.i];if(!en)return;const v={...(egDoc().voc||{})},cur=v[en]||{b:0,first:todayK()},t=today();
  if(knew){const b=Math.min(5,(cur.seen?cur.b+1:2));v[en]={...cur,b,seen:1,due:dkey(add(t,EG_INT[b]))};st.ok++}
  else{v[en]={...cur,b:0,seen:1,due:todayK()};if(!st.again)st.again={};if(!st.again[en]){st.again[en]=1;st.q.push(en)}}
  egSave({voc:v});st.i++;st.flip=false;if(st.i>=st.q.length){egDay({v:1});st.m="vocfin"}else{const nx=st.q[st.i];if(((v[nx]||{}).b||0)<2)say(nx)}render(true)}
function egVocCard(){const st=V.eg,en=st.q[st.i],w=EG_VOC.find(x=>x.en===en),v=(egDoc().voc||{})[en]||{},rev=(v.b||0)>=2;if(!w)return"";
  const front=rev?`<span class="egfr">${esc(w.fr)}</span><small class="muted">Comment on dit en anglais ?</small>`:`<span class="egen">${esc(w.en)}</span>${egSay(w.en)}<small class="muted">Qu'est-ce que ça veut dire ?</small>`;
  const back=`<span class="egen">${esc(w.en)}</span>${egSay(w.en)}<span class="egfr">${esc(w.fr)}</span>`;
  return`<div class="card stack egcard"><div class="row" style="justify-content:space-between"><span class="muted small">${esc(w.th)}${v.seen?"":" · nouveau mot"}</span><span class="muted small num">${st.i+1}/${st.q.length}</span></div>
    <div class="egflash">${st.flip?back:front}</div>
    ${st.flip?`<div class="egbtns"><button class="ghost egko" data-egv="0">✗ Je ne savais pas</button><button class="btn egok" data-egv="1">✓ Je savais</button></div>`:`<button class="btn" data-egflip="1">Voir la réponse</button>`}</div>`}

/* ---- ② grammaire ---- */
function egUnit(){return Math.min(EG_U.length-1,egDoc().u||0)}
function egGramStart(i){V.eg={m:"lesson",u:i};render(true);window.scrollTo(0,0)}
function egExStart(){const u=V.eg.u;V.eg={m:"ex",u,i:0,sc:0,ans:null};render(true)}
function egExAns(val){const st=V.eg,q=EG_U[st.u].q[st.i];if(st.ans)return;const ok=q.k==="txt"?egTxtOk(val,q.a):+val===q.a;st.ans={ok,val};if(ok)st.sc++;render(true)}
function egExNext(){const st=V.eg,U=EG_U[st.u];st.i++;st.ans=null;if(st.i>=U.q.length){const g={...(egDoc().g||{})},pass=st.sc>=4;g[st.u]={best:Math.max(st.sc,(g[st.u]||{}).best||0),ts:Date.now()};
    egSave({g,u:pass&&st.u>=egUnit()?Math.min(EG_U.length,st.u+1):egDoc().u||0});egDay({g:1});st.m="exfin";st.pass=pass}render(true)}
function egExCard(){const st=V.eg,U=EG_U[st.u],q=U.q[st.i],a=st.ans;
  return`<div class="card stack egcard"><div class="row" style="justify-content:space-between"><span class="muted small">Leçon ${st.u+1} · exercice</span><span class="muted small num">${st.i+1}/${U.q.length}</span></div>
    <p class="egq">${esc(q.q)}</p>
    ${q.k==="txt"?`<form data-f="egtxt" class="row" style="flex-direction:row;flex-wrap:nowrap"><input class="field" name="r" autocomplete="off" autocapitalize="off" spellcheck="false" data-nomic="1" ${a?"disabled":""} value="${a?esc(a.val):""}" placeholder="Ta réponse"><button class="btn" ${a?"disabled":""}>Vérifier</button></form>`
      :`<div class="egopts">${q.o.map((o,i)=>`<button class="egopt ${a?(i===q.a?"ok":+a.val===i?"ko":""):""}" data-egopt="${i}" ${a?"disabled":""}>${esc(o)}</button>`).join("")}</div>`}
    ${a?`<div class="egfb ${a.ok?"ok":"ko"}"><b>${a.ok?"✓ Bravo !":"✗ Pas tout à fait."}</b> ${q.k==="txt"&&!a.ok?`Réponse : <b>${esc(q.a[0])}</b>. `:""}${esc(q.e)}</div><button class="btn" data-egnext="1">${st.i+1<U.q.length?"Suivant →":"Voir mon score"}</button>`:""}</div>`}
function egLesson(){const U=EG_U[V.eg.u];
  return`<div class="card stack egcard"><p class="label" style="margin:0">Leçon ${V.eg.u+1} / ${EG_U.length}</p><h3 class="egt">${esc(U.t)}</h3>
    <div class="egx">${U.x.split("\n").map(l=>`<p>${esc(l)}</p>`).join("")}</div>
    <p class="label" style="margin:4px 0 0">Exemples (touche 🔊 pour écouter)</p><ul class="egex">${U.ex.map(([en,fr])=>`<li>${egSay(en)}<div><b>${esc(en)}</b><span class="muted">${esc(fr)}</span></div></li>`).join("")}</ul>
    <div class="row"><button class="btn" data-egexgo="1">Faire les ${U.q.length} exercices</button><button class="ghost" data-eghome="1">Retour</button></div></div>`}

/* ---- ③ oral : dire des phrases ---- */
function egOralStart(){const ks=Object.keys(egDoc().g||{}).map(Number),done=Math.min(EG_U.length-1,ks.length?Math.max(...ks):0),L=[...EG_U[done].o];if(done>0)L.push(...EG_U[done-1].o.slice(0,2));V.eg={m:"oral",L,i:0,res:null,ok:0};V.egSaid="";render(true)}
function egOralCheck(){const st=V.eg,[fr,en]=st.L[st.i],said=String(V.egSaid||"").trim();if(!said)return;const s=egScore(said,en);st.res={s,said};if(s>=.8)st.ok++;if(typeof MIC!=="undefined"&&MIC)micStop();say(en);render(true)}
function egOralNext(){const st=V.eg;st.i++;st.res=null;V.egSaid="";if(st.i>=st.L.length){egDay({o:(egToday().o||0)+st.L.length});st.m="oralfin"}render(true)}
function egOralCard(){const st=V.eg,[fr,en]=st.L[st.i],r=st.res;
  return`<div class="card stack egcard"><div class="row" style="justify-content:space-between"><span class="muted small">Dis-le en anglais</span><span class="muted small num">${st.i+1}/${st.L.length}</span></div>
    <p class="egq">« ${esc(fr)} »</p>
    <textarea class="field" id="egsaid" rows="2" data-miclang="en-US" data-egsaid="1" placeholder="Touche 🎙️ Parler, ou écris ta phrase" ${r?"disabled":""}>${esc(V.egSaid||"")}</textarea>
    ${r?`<div class="egfb ${r.s>=.8?"ok":r.s>=.5?"mid":"ko"}"><b>${r.s>=.8?"✓ Parfait !":r.s>=.5?"Presque !":"✗ Pas encore."}</b> La phrase : <b>${esc(en)}</b> ${egSay(en)}</div><button class="btn" data-egonext="1">${st.i+1<st.L.length?"Suivant →":"Terminer"}</button>`
      :`<div class="row"><button class="btn" data-egspeak="1">🎙️ Parler</button><button class="ghost on" data-egcheck="1">Vérifier</button><button class="ghost" data-egshow="1">Je ne sais pas</button></div>`}</div>`}

/* ---- page ---- */
function egHome(){const u=egUnit(),doc=egDoc(),td=egToday(),q=egQueue(),known=Object.values(doc.voc||{}).filter(x=>x.b>=3).length,lv=EG_LV[Math.min(EG_LV.length-1,doc.u||0)],steps=[td.v,td.g,(td.o||0)>=3].filter(Boolean).length,stk=egStreak();
  const step=(n,ic,t,s,done,btn)=>`<div class="egstep ${done?"done":""}"><span class="egn">${done?"✓":n}</span><div><b>${ic} ${t}</b><small class="muted">${s}</small></div>${btn}</div>`;
  return`<div class="card stack" style="gap:12px"><div class="row" style="justify-content:space-between"><p class="label" style="margin:0">🇬🇧 Ton cycle du jour · ${steps}/3</p><span class="muted small">${stk?`🔥 ${stk} jour${stk>1?"s":""}`:""}</span></div>
    <div class="eglv"><span>Niveau <b>${esc(lv)}</b></span><span class="muted small">${known} mots bien sus · leçon ${Math.min((doc.u||0)+1,EG_U.length)}/${EG_U.length}</span><div class="mxbar"><i style="width:${Math.round((doc.u||0)/EG_U.length*100)}%"></i></div></div>
    ${step(1,"🔤","Vocabulaire",td.v&&!q.length?"Fini pour aujourd'hui":`${q.length} mot${q.length>1?"s":""} à voir (nouveaux + à revoir)`,td.v&&!q.length,q.length?`<button class="btn" data-egvoc="1">${td.v?"Continuer":"Commencer"}</button>`:"")}
    ${step(2,"📘","Grammaire",`Leçon ${u+1} : ${EG_U[u].t}`,!!td.g,`<button class="${td.g?"ghost":"btn"}" data-eggram="${u}">${(doc.g||{})[u]?"Revoir":"Commencer"}</button>`)}
    ${step(3,"🎙️","Oral","Dis des phrases de ta dernière leçon au micro",(td.o||0)>=3,`<button class="${(td.o||0)>=3?"ghost":"btn"}" data-egoral="1">${(td.o||0)>=3?"Refaire":"Commencer"}</button>`)}
    <p class="muted small" style="margin:0">Environ 15 minutes. On commence vraiment par la base : chaque leçon validée (4/6) débloque la suivante.</p></div>
  <details class="card egall"><summary><b>📚 Toutes les leçons</b></summary><ol class="eglist">${EG_U.map((U,i)=>{const g=(doc.g||{})[i],open=i<=(doc.u||0);return`<li class="${open?"":"off"}">${open?`<button class="linkb" data-eggram="${i}">${esc(U.t)}</button>`:`<span>🔒 ${esc(U.t)}</span>`}${g?` <span class="muted small">· ${g.best}/6</span>`:""}</li>`}).join("")}</ol></details>`}
function engPage(){const st=V.eg||{m:"home"};let main="";
  if(st.m==="voc")main=egVocCard();
  else if(st.m==="vocfin")main=`<div class="card stack egcard"><p class="egbig">🎉</p><p><b>Vocabulaire fini pour aujourd'hui.</b> ${st.ok}/${st.n} mots sus du premier coup. Les mots ratés reviendront demain.</p><button class="btn" data-eghome="1">Continuer le cycle</button></div>`;
  else if(st.m==="lesson")main=egLesson();
  else if(st.m==="ex")main=egExCard();
  else if(st.m==="exfin")main=`<div class="card stack egcard"><p class="egbig num">${st.sc}/${EG_U[st.u].q.length}</p><p>${st.pass?`<b>Leçon validée !</b> ${st.u+1<EG_U.length?"La leçon suivante est débloquée pour demain.":"Tu as fini toutes les leçons : passe au défi de l'article."}`:"<b>Il faut 4/6 pour valider.</b> Relis la leçon et refais les exercices : c'est en recommençant qu'on retient."}</p><div class="row"><button class="btn" data-eghome="1">Continuer le cycle</button>${st.pass?"":`<button class="ghost on" data-eggram="${st.u}">Relire la leçon</button>`}</div></div>`;
  else if(st.m==="oral")main=egOralCard();
  else if(st.m==="oralfin")main=`<div class="card stack egcard"><p class="egbig">🎙️</p><p><b>${st.ok}/${st.L.length} phrases parfaites.</b> Plus tu parles, plus ça devient facile.</p><button class="btn" data-eghome="1">Retour au cycle</button></div>`;
  else main=egHome();
  const u=egDoc().u||0;
  return`${st.m!=="home"&&st.m?`<div><button class="ghost" data-eghome="1">‹ Mon cycle du jour</button></div>`:""}${main}
  <details class="card egart" ${u>=EG_U.length||V.egArtOpen?"open":""}><summary><b>④ Défi : explique l'article du jour</b><span class="muted small">${u>=EG_U.length?"tu es prêt !":"niveau B1 : pour plus tard, mais tu peux essayer"}</span></summary><div class="stack" style="gap:12px;margin-top:10px">${entEn()}</div></details>`}

/* ---- clics et saisie ---- */
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-egsay],[data-egvoc],[data-egflip],[data-egv],[data-eggram],[data-egexgo],[data-egopt],[data-egnext],[data-egoral],[data-egspeak],[data-egcheck],[data-egshow],[data-egonext],[data-eghome]");if(!b)return;const d=b.dataset;
  if(d.egsay!==undefined)return say(d.egsay);
  if(d.egvoc){egVocStart();const st=V.eg,en=st.q[0],w=EG_VOC.find(x=>x.en===en),v=(egDoc().voc||{})[en]||{};if(w&&(v.b||0)<2)say(en);return}
  if(d.egflip){V.eg.flip=true;const en=V.eg.q[V.eg.i];render(true);return say(en)}
  if(d.egv!==undefined)return egVocAns(d.egv==="1");
  if(d.eggram!==undefined)return egGramStart(+d.eggram);
  if(d.egexgo)return egExStart();
  if(d.egopt!==undefined)return egExAns(d.egopt);
  if(d.egnext)return egExNext();
  if(d.egoral)return egOralStart();
  if(d.egspeak){const el=document.getElementById("egsaid");if(el){el.focus({preventScroll:true});micToggle(el)}return}
  if(d.egcheck)return egOralCheck();
  if(d.egshow){V.egSaid=V.egSaid||"…";V.eg.res={s:0,said:""};const en=V.eg.L[V.eg.i][1];say(en);return render(true)}
  if(d.egonext)return egOralNext();
  if(d.eghome){V.eg={m:"home"};render(true);return window.scrollTo(0,0)}});
document.addEventListener("input",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.egsaid!==undefined)V.egSaid=t.value});
document.addEventListener("submit",e=>{const f=e.target;if(f&&f.dataset&&f.dataset.f==="egtxt"){e.preventDefault();e.stopImmediatePropagation();const v=(f.querySelector("input")||{}).value||"";if(v.trim())egExAns(v)}},true);
document.addEventListener("toggle",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("egart"))V.egArtOpen=t.open},true);

/* ---- moteur : Pyodide dans un worker ---- */
const PY_BASE=window.__PYBASE||"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
let PYW=null,PYQ={},pySeq=0,pyState="off";
function pyWorker(){if(PYW)return PYW;pyState="loading";
  const src=`importScripts(${JSON.stringify(PY_BASE+"pyodide.js")});
let py=null;const ready=loadPyodide({indexURL:${JSON.stringify(PY_BASE)}}).then(p=>{py=p;postMessage({t:"ready"})}).catch(e=>postMessage({t:"fail",e:String(e&&e.message||e)}));
onmessage=async e=>{const{id,code,test}=e.data;await ready;if(!py)return postMessage({t:"res",id,out:"",err:"Python n'a pas pu se charger."});let out="";
  py.setStdout({batched:s=>{out+=s+"\\n"}});py.setStderr({batched:s=>{out+=s+"\\n"}});
  const ns=py.globals.get("dict")();let err=null,terr=null;
  try{await py.runPythonAsync(code,{globals:ns})}catch(x){err=String(x&&x.message||x)}
  if(!err&&test){try{await py.runPythonAsync(test,{globals:ns})}catch(x){terr=String(x&&x.message||x)}}
  try{py.runPython("import sys\\nsys.stdout.flush()")}catch(_){}try{ns.destroy()}catch(_){}
  postMessage({t:"res",id,out,err,terr})}`;
  try{PYW=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})))}catch(e){pyState="fail";V.pyErr=String(e&&e.message||e);return null}
  PYW.onmessage=e=>{const m=e.data;if(m.t==="ready"){pyState="ready";if(V.page==="py")pyStatus()}else if(m.t==="fail"){pyState="fail";V.pyErr=m.e;if(V.page==="py")render(true)}
    else if(m.t==="res"){const r=PYQ[m.id];if(r){delete PYQ[m.id];clearTimeout(r.to);r.ok(m)}}};
  PYW.onerror=e=>{pyState="fail";V.pyErr=String(e&&e.message||"erreur");if(V.page==="py")render(true)};return PYW}
function pyStatus(){const el=document.getElementById("pystat");if(el)el.innerHTML=pyStatTxt()}
const pyStatTxt=()=>pyState==="ready"?"🟢 Python est prêt":pyState==="loading"?"⏳ Python se télécharge (environ 10 Mo, une seule fois)…":pyState==="fail"?"🔴 Python n'a pas pu se charger : vérifie ta connexion, puis réessaie.":"";
function pyRun(code,test){const w=pyWorker();if(!w)return Promise.resolve({err:"Ton navigateur ne peut pas lancer Python ici."});const id=++pySeq,lim=pyState==="ready"?5000:120000;
  return new Promise(ok=>{const to=setTimeout(()=>{delete PYQ[id];try{w.terminate()}catch(_){}PYW=null;pyState="off";Object.values(PYQ).forEach(r=>{clearTimeout(r.to);r.ok({timeout:true,out:""})});PYQ={};ok({timeout:true,out:""})},lim);PYQ[id]={ok,to};w.postMessage({id,code,test})})}
/* erreurs de Python expliquées simplement */
function pyFriendly(err,inTest){const s=String(err||""),L=s.trim().split("\n"),last=L[L.length-1]||"",ms=[...s.matchAll(/File "<exec>", line (\d+)/g)],ln=!inTest&&ms.length?+ms[ms.length-1][1]:null,at=ln?` (ligne ${ln})`:"";
  const m=last.match(/^(\w+)(?::\s*(.*))?$/),type=m?m[1]:"",msg=m?m[2]||"":last;
  if(inTest&&type==="AssertionError")return"Pas encore : "+(msg||"le résultat n'est pas le bon.");
  if(inTest&&type==="NameError"){const n=(msg.match(/'([^']+)'/)||[])[1];return`Il manque « ${n||"?"} » : crée-le avec exactement ce nom (attention aux majuscules et aux fautes de frappe).`}
  if(/IndentationError|TabError/.test(type))return`Problème de décalage${at} : dans un if, un for, un while ou un def, les lignes du dessous doivent être décalées de 4 espaces, toutes pareil.`;
  if(type==="SyntaxError")return`Erreur d'écriture${at} : vérifie les parenthèses ( ), les guillemets " " et les deux-points : à la fin des lignes if, for, while et def.`;
  if(type==="NameError"){const n=(msg.match(/'([^']+)'/)||[])[1];return`Python ne connaît pas « ${n||"?"} »${at} : vérifie l'orthographe et les majuscules, ou crée la variable avant. Pour du texte, mets des guillemets.`}
  if(type==="TypeError")return`Tu mélanges des types${at} (du texte et un nombre ?). Utilise int() ou str() pour convertir.`;
  if(type==="ZeroDivisionError")return`Division par zéro${at}.`;
  if(type==="IndexError")return`Élément introuvable dans la liste${at} : on compte à partir de 0.`;
  if(type==="KeyError")return`Cette clé n'est pas dans le dictionnaire${at} : ${msg}.`;
  if(type==="ValueError")return`Valeur impossible${at} : ${msg}.`;
  return`Erreur${at} : ${last}`}
const pyNorm=s=>String(s||"").replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");

/* ---- progression ---- */
const pyDoc=()=>drill("py");
function pySave(p){put("drill","py",{...pyDoc(),...p},true)}
const pyDone=i=>!!((pyDoc().done||{})[i]);
function pyCur(){const d=pyDoc().done||{};let i=0;while(i<PY_L.length&&d[i])i++;return Math.min(i,PY_L.length-1)}
function pyStreak(){const d=pyDoc().d||{};let s=0,x=today();if(!d[dkey(x)])x=add(x,-1);for(let i=0;i<400;i++){if(d[dkey(x)]){s++;x=add(x,-1)}else break}return s}
function pyRevIdx(){const dn=Object.keys(pyDoc().done||{}).map(Number).filter(i=>i<PY_L.length);if(dn.length<3)return null;return dn.sort((a,b)=>a-b)[hashStr("py"+todayK())%dn.length]}
function pyCode(i,rev){const c=(pyDoc().code||{})[rev?"r"+i:i];return c!=null?c:PY_L[i].ex.start}
let pyCT=null;function pyKeep(i,rev,val){V.pyBuf={k:rev?"r"+i:i,val};clearTimeout(pyCT);pyCT=setTimeout(pyFlush,700)}
function pyFlush(){clearTimeout(pyCT);const b=V.pyBuf;if(!b)return;V.pyBuf=null;pySave({code:{...(pyDoc().code||{}),[b.k]:String(b.val).slice(0,8000)}})}

/* ---- exécuter, vérifier ---- */
async function pyGo(mode){const L=PY_L[V.pyL],rev=!!V.pyRev,ed=document.getElementById("pyed");if(mode==="ex"){V.pyOut={busy:1,ex:1};pyPaint();const r=await pyRun(L.code);V.pyOut={...r,ex:1};return pyPaint()}
  const code=ed?ed.value:pyCode(V.pyL,rev);pyKeep(V.pyL,rev,code);pyFlush();V.pyOut={busy:1};pyPaint();
  const r=await pyRun(code,L.ex.test||null);let ok=false,why="";
  if(r.timeout)why="Ton programme tourne sans s'arrêter (boucle infinie ?) : vérifie la condition de ton while, puis réessaie.";
  else if(r.err)why=pyFriendly(r.err,false);
  else{const okOut=L.ex.out==null||pyNorm(r.out)===pyNorm(L.ex.out);if(!okOut)why=`Ton programme affiche autre chose que ce qui est demandé. Il faut afficher :\n${L.ex.out}`;else if(r.terr)why=pyFriendly(r.terr,true);else ok=true}
  V.pyTries=(V.pyTries||0)+(ok?0:1);V.pyOut={...r,ok,why};
  if(ok){const d={...(pyDoc().done||{})},days={...(pyDoc().d||{})};if(!rev)d[V.pyL]=d[V.pyL]||todayK();days[todayK()]=1;pySave({done:d,d:days})}
  pyPaint()}
/* ne redessiner que la zone du résultat (le clavier reste ouvert) */
function pyPaint(){const el=document.getElementById("pyres");if(el)el.innerHTML=pyResHtml();else render(true);if(V.pyOut&&V.pyOut.ok){const n=document.getElementById("pynext");if(n)n.hidden=false}}
function pyResHtml(){const o=V.pyOut;if(!o)return"";if(o.busy)return`<p class="muted small" style="margin:0">${pyState==="ready"?"▶ Python exécute ton code…":"⏳ Python se télécharge (une seule fois), puis exécute ton code…"}</p>`;
  const out=o.out?`<pre class="pyout">${esc(pyNorm(o.out))}</pre>`:"";
  if(o.ex)return`<p class="label" style="margin:0">Ce que l'exemple affiche</p>${out||`<p class="muted small" style="margin:0">(rien)</p>`}${o.err?`<p class="small">${esc(pyFriendly(o.err))}</p>`:""}`;
  return`${out?`<p class="label" style="margin:0">Ton programme affiche</p>${out}`:""}<div class="pyfb ${o.ok?"ok":"ko"}"><b>${o.ok?"✓ Bravo, c'est juste !":"✗ Pas encore"}</b>${o.ok?"":`<span>${esc(o.why).replace(/\n/g,"<br>")}</span>`}${o.err||o.terr?`<code>${esc(String(o.err||o.terr).trim().split("\n").pop())}</code>`:""}${!o.ok&&(V.pyTries||0)>=2&&!V.pySol?`<div><button class="ghost" data-pysol="1">Voir la solution</button></div>`:""}</div>`}
/* ---- éditeur adapté au téléphone ---- */
const PY_KEYS=[["⇥","    "],[":",":"],["(","("],[")",")"],["\"","\""],["[","["],["]","]"],["=","="],["+","+"],["*","*"],["<","<"],[">",">"],["#","#"]];
function pyIns(t){const el=document.getElementById("pyed");if(!el)return;el.focus({preventScroll:true});const a=el.selectionStart,b=el.selectionEnd;el.setRangeText(t,a,b,"end");el.dispatchEvent(new Event("input",{bubbles:true}))}
document.addEventListener("keydown",e=>{const el=e.target;if(!el||el.id!=="pyed")return;
  if(e.key==="Tab"){e.preventDefault();return pyIns("    ")}
  if(e.key==="Enter"&&!e.shiftKey){const v=el.value,a=el.selectionStart,ls=v.lastIndexOf("\n",a-1)+1,line=v.slice(ls,a),ind=(line.match(/^ */)||[""])[0].length+(/:\s*$/.test(line)?4:0);e.preventDefault();pyIns("\n"+" ".repeat(ind))}});
document.addEventListener("input",e=>{const el=e.target;if(el&&el.id==="pyed")pyKeep(V.pyL,!!V.pyRev,el.value)});
const pyKeepFocus=e=>{if(e.target.closest&&e.target.closest(".pykeys button")){e.preventDefault();if(e.type==="touchstart"||e.type==="mousedown")pyIns(e.target.closest("button").dataset.k)}};
document.addEventListener("touchstart",pyKeepFocus,{passive:false,capture:true});document.addEventListener("mousedown",pyKeepFocus,true);
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest(".pykeys button")){e.preventDefault();e.stopPropagation();if(e.detail===0)pyIns(e.target.closest("button").dataset.k)}},true);

/* ---- page ---- */
function pyCodeHtml(c){return`<pre class="pycode">${esc(c)}</pre>`}
function pyLesson(){const i=V.pyL,L=PY_L[i],rev=!!V.pyRev,done=pyDone(i),code=V.pyBuf&&V.pyBuf.k===(rev?"r"+i:i)?V.pyBuf.val:pyCode(i,rev);
  return`<div class="card stack pyl"><div class="row" style="justify-content:space-between"><p class="label" style="margin:0">${rev?"🔁 Révision du jour · ":""}Leçon ${i+1} / ${PY_L.length}</p>${done&&!rev?`<span class="tag">✓ validée</span>`:""}</div>
    <h3 class="pyt">${esc(L.t)}</h3>${rev?"":`<div class="egx">${L.x.split("\n").map(l=>`<p>${esc(l)}</p>`).join("")}</div>
    <p class="label" style="margin:0">Exemple</p>${pyCodeHtml(L.code)}<div><button class="ghost on" data-pyex="1">▶ Lancer l'exemple</button></div>`}</div>
  <div class="card stack pyl"><p class="label" style="margin:0">✏️ À toi</p><p class="pyq">${esc(L.ex.q)}</p>
    <textarea class="pyed" id="pyed" rows="${Math.max(6,code.split("\n").length+2)}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" data-nomic="1" aria-label="Ton code Python">${esc(code)}</textarea>
    <div class="pykeys" aria-label="Touches utiles">${PY_KEYS.map(([l,k])=>`<button type="button" data-k="${esc(k)}" aria-label="${l==="⇥"?"4 espaces":"Insérer "+esc(l)}">${esc(l)}</button>`).join("")}</div>
    <div class="row"><button class="btn" data-pyrun="1">▶ Exécuter et vérifier</button><button class="ghost" data-pyhint="1">💡 Indice</button>${(V.pyTries||0)>=2||done?`<button class="ghost" data-pysol="1">Voir la solution</button>`:""}<button class="ghost" data-pyreset="1">↺</button></div>
    ${V.pyHint?`<p class="small pyhint">💡 ${esc(L.ex.hint)}</p>`:""}${V.pySol?`<p class="label" style="margin:0">Une solution</p>${pyCodeHtml(L.ex.sol)}`:""}
    <div id="pyres" class="stack" style="gap:8px">${pyResHtml()}</div>
    <div id="pynext" ${V.pyOut&&V.pyOut.ok?"":"hidden"} class="row"><button class="btn" data-pynav="${rev?"home":i+1<PY_L.length?i+1:"home"}">${rev?"Retour":i+1<PY_L.length?"Leçon suivante →":"🎉 Tu as fini le parcours !"}</button><span class="muted small">${rev?"":"Une leçon par jour suffit pour progresser."}</span></div></div>`}
function pagePy(){if(pyState==="off")setTimeout(pyWorker,0);if(V.pyL==null)V.pyL=pyCur();
  const dn=Object.keys(pyDoc().done||{}).length,stk=pyStreak(),td=!!(pyDoc().d||{})[todayK()],ri=pyRevIdx(),cur=pyCur();
  return`<div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between"><p class="label" style="margin:0">🐍 Ton parcours · ${dn}/${PY_L.length}</p><span class="muted small">${stk?`🔥 ${stk} jour${stk>1?"s":""}`:""}</span></div>
    <div class="mxbar"><i style="width:${Math.round(dn/PY_L.length*100)}%"></i></div>
    <p class="small" style="margin:0">${td?"✓ Ta pratique du jour est faite. Tu peux continuer si tu veux !":`Aujourd'hui : la leçon ${cur+1}, environ 10 minutes.`}</p>
    <div class="row">${V.pyL!==cur||V.pyRev?`<button class="ghost on" data-pynav="${cur}">Leçon du jour</button>`:""}${ri!=null&&!V.pyRev?`<button class="ghost on" data-pyrev="${ri}">🔁 Révision du jour</button>`:""}</div>
    <p class="muted small" id="pystat" style="margin:0">${pyStatTxt()}</p>${V.pyErr&&pyState==="fail"?`<p class="muted small" style="margin:0">${esc(V.pyErr).slice(0,160)}</p>`:""}</div>
  ${pyLesson()}
  <details class="card"><summary><b>📚 Toutes les leçons</b></summary><ol class="eglist">${PY_L.map((L,i)=>{const open=i<=cur||pyDone(i);return`<li class="${open?"":"off"}">${open?`<button class="linkb" data-pynav="${i}">${esc(L.t)}</button>`:`<span>🔒 ${esc(L.t)}</span>`}${pyDone(i)?" ✓":""}</li>`}).join("")}</ol></details>`}
function pySummary(){const dn=Object.keys(pyDoc().done||{}).length,td=!!(pyDoc().d||{})[todayK()],stk=pyStreak();return[`${dn}/${PY_L.length}`,td?`pratique du jour faite${stk>1?" · 🔥 "+stk+" jours":""}`:`leçon du jour : ${PY_L[pyCur()].t.toLowerCase()}`]}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-pyex],[data-pyrun],[data-pyhint],[data-pysol],[data-pyreset],[data-pynav],[data-pyrev]");if(!b)return;const d=b.dataset;
  if(d.pyex)return pyGo("ex");
  if(d.pyrun){return pyGo("run")}
  if(d.pyhint){V.pyHint=!V.pyHint;return render(true)}
  if(d.pysol){V.pySol=!V.pySol;return render(true)}
  if(d.pyreset){const k=V.pyRev?"r"+V.pyL:V.pyL,c={...(pyDoc().code||{})};delete c[k];V.pyBuf=null;pySave({code:c});V.pyOut=null;return render(true)}
  const fresh=()=>{pyFlush();V.pyOut=null;V.pyHint=false;V.pySol=false;V.pyTries=0};
  if(d.pynav!==undefined){fresh();V.pyRev=false;if(d.pynav!=="home")V.pyL=+d.pynav;else V.pyL=pyCur();render(true);return window.scrollTo(0,0)}
  if(d.pyrev!==undefined){fresh();V.pyRev=true;V.pyL=+d.pyrev;const c={...(pyDoc().code||{})};delete c["r"+V.pyL];pySave({code:c});render(true);return window.scrollTo(0,0)}});

async function sbAuth(path,body,token){

const sessFrom=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email}});
function authErr(m){m=String(m||"");if(/invalid login|invalid credentials/i.test(m))return"E-mail ou mot de passe incorrect.";if(/not confirmed/i.test(m))return"Confirme d'abord ton adresse e-mail (lien reçu par mail).";if(/already registered|already exists/i.test(m))return"Ce compte existe déjà : connecte-toi.";if(/password/i.test(m))return"Mot de passe trop faible : 8 caractères minimum.";if(/fetch|network/i.test(m))return"Pas de connexion internet.";return m}
async function signIn(email,pw){const j=await sbAuth("token?grant_type=password",{email,password:pw});saveSession(sessFrom(j));lsSet("cerveau-lastpull",null);await fullSync(true)}

async function handleAuthHash(){

async function token(){
  if(!SESSION)return null;
  if(SESSION.expires_at-90<Date.now()/1000){
    try{const j=await sbAuth("token?grant_type=refresh_token",{refresh_token:SESSION.refresh_token});saveSession(sessFrom(j))}
    catch(e){if(e.status>=400&&e.status<500){saveSession(null);setSync("Reconnecte-toi dans Réglages");render()}return null}
  }
  return SESSION.access_token;

async function sbRest(method,path,body,extra){
  const c=cfg(),t=await token();if(!t)throw new Error("Pas de session");
  const r=await fetch(c.supabaseUrl+"/rest/v1/"+path,{method,headers:{apikey:c.supabaseKey,Authorization:"Bearer "+t,"Content-Type":"application/json",...(extra||{})},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const tx=await r.text().catch(()=>"");const e=new Error("HTTP "+r.status+" "+tx.slice(0,200));e.status=r.status;throw e}
  if(r.status===204)return null;const tx=await r.text();return tx?JSON.parse(tx):null;
}

/* ---------- synchronisation : tout part d'abord sur l'appareil, puis vers le compte ---------- */
let OUTBOX=lsGet("cerveau-outbox",{});
function enqueue(col,id,data,deleted){if(NOUP(col,id))return;OUTBOX[col+"|"+id]={col,id,data:deleted?{}:data,deleted:!!deleted,ts:Date.now()};lsSet("cerveau-outbox",OUTBOX);flushSoon()}
let flT=null;function flushSoon(){clearTimeout(flT);flT=setTimeout(flush,700)}
let flushing=false;
async function flush(){
  if(flushing||!SESSION||!cfgOk())return;
  const items=Object.values(OUTBOX);if(!items.length)return;
  if(!navigator.onLine){setSync("Hors ligne · enregistré sur l'appareil");return}
  flushing=true;
  try{
    for(let i=0;i<items.length;i+=200){
      const chunk=items.slice(i,i+200);
      await sbRest("POST","docs?on_conflict=user_id,col,id",chunk.map(x=>({user_id:SESSION.user.id,col:x.col,id:x.id,data:x.data,deleted:x.deleted})),{Prefer:"resolution=merge-duplicates,return=minimal"});
      chunk.forEach(x=>{const k=x.col+"|"+x.id;if(OUTBOX[k]&&OUTBOX[k].ts===x.ts)delete OUTBOX[k]});
    }
    lsSet("cerveau-outbox",OUTBOX);lsSet("cerveau-lastsync",Date.now());setSync("Synchronisé");
  }catch(e){setSync(navigator.onLine?"Synchro en attente":"Hors ligne · enregistré sur l'appareil")}
  finally{flushing=false;if(Object.keys(OUTBOX).length&&navigator.onLine&&SESSION)setTimeout(flushSoon,15000)}
}
let pulling=false;
async function pull(full){
  if(pulling||!SESSION||!cfgOk()||!navigator.onLine)return false;
  pulling=true;let changed=false;
  try{
    const last=full?null:lsGet("cerveau-lastpull",null);let maxTs=last||"",off=0;const seen=new Set();
    const since=last?new Date(Date.parse(last)-5000).toISOString():null;
    for(;;){
      const rows=await sbRest("GET","docs?select=col,id,data,deleted,updated_at&order=updated_at.asc&limit=1000&offset="+off+(since?"&updated_at=gt."+encodeURIComponent(since):""));
      if(!rows||!rows.length)break;
      for(const r of rows){
        const k=r.col+"|"+r.id;seen.add(k);if(r.updated_at>maxTs)maxTs=r.updated_at;
        if(OUTBOX[k]||NOSYNC(r.col,r.id)||!C.includes(r.col))continue;
        if(r.deleted){if(S[r.col]&&S[r.col][r.id]!==undefined){const n={...S[r.col]};delete n[r.id];S[r.col]=n;changed=true}}
        else if(JSON.stringify(S[r.col][r.id])!==JSON.stringify(r.data)){S[r.col]={...S[r.col],[r.id]:r.data};changed=true}
      }
      if(rows.length<1000)break;off+=1000;
    }
    if(full)C.forEach(c=>Object.keys(S[c]||{}).forEach(id=>{if(!seen.has(c+"|"+id)&&!NOUP(c,id))enqueue(c,id,S[c][id],false)}));
    if(maxTs)lsSet("cerveau-lastpull",maxTs);
    lsSet("cerveau-lastsync",Date.now());
    if(changed){localSaveSoon();render()}
    if(!Object.keys(OUTBOX).length)setSync("Synchronisé");
    return true;
  }catch(e){setSync("Synchro en attente");return false}
  finally{pulling=false}
}
async function fullSync(full){await flush();await pull(full);await flush()}
function lastSyncTxt(){const t=lsGet("cerveau-lastsync",0);if(!t)return"";const m=Math.round((Date.now()-t)/60000);return" · dernière synchro "+(m<1?"à l'instant":m<60?"il y a "+m+" min":"le "+fts(t))}

function setupAI(){const a=aiCfg();if(a.provider==="ollama"||a.key||a.backup){SAMPLE=aiSample;SAMPLE_ST="ok"}else{SAMPLE=null;SAMPLE_ST="none"}TOOLS_OK=false}
function mergeTurns(input){
  const t=typeof input==="string"?[{role:"user",content:input}]:input,out=[];
  t.forEach(m=>{const role=m.role==="assistant"?"assistant":"user";if(out.length&&out[out.length-1].role===role)out[out.length-1].content+="\n\n"+m.content;else out.push({role,content:String(m.content)})});
  return out;
}
async function readLines(r,fn){
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line)try{fn(line)}catch(e){}}}
  if(buf.trim())try{fn(buf.trim())}catch(e){}
}
async function aiSample(input,opts={}){
  const a=aiCfg(),turns=mergeTurns(input),json=!!opts._json,prov=opts._prov||(a.provider==="gemini"&&!a.key&&a.backup?"ollama":a.provider);let text="";
  const emit=d=>{if(!d)return;text+=d;try{opts.onText&&opts.onText({text,delta:d})}catch(e){}};
  try{
    if(prov==="ollama"){
      const r=await fetch(a.ollamaUrl.replace(/\/+$/,"")+"/api/chat",{method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:(a.provider==="ollama"?a.model:a.omodel)||"llama3.2",messages:turns,stream:true,...(json?{format:"json"}:{})})});
      if(!r.ok)throw{code:r.status===404?"bad_model":"upstream_error",message:"Ollama "+r.status};
      await readLines(r,line=>{const j=JSON.parse(line);if(j.message&&j.message.content)emit(j.message.content)});
    }else{
      if(!a.key)throw{code:"no_key"};
      const model=a.model||"gemini-3.5-flash";
      const body={contents:turns.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),generationConfig:{temperature:0.5,...(json?{responseMimeType:"application/json"}:{})}};
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":streamGenerateContent?alt=sse",
        {method:"POST",signal:opts.signal,headers:{"Content-Type":"application/json","x-goog-api-key":a.key},body:JSON.stringify(body)});
      if(!r.ok){const tx=await r.text().catch(()=>"");let em=tx;try{const j=JSON.parse(tx);em=(j.error&&(j.error.message||j.error.status))||tx}catch(_){}
        throw{code:r.status===429?"rate_limited":r.status===404?"bad_model":(r.status===400||r.status===401||r.status===403)&&/api.?key|permission|unauth/i.test(tx)?"bad_key":"upstream_error",message:"HTTP "+r.status+" : "+String(em).slice(0,220)}}
      await readLines(r,line=>{if(!line.startsWith("data:"))return;const j=JSON.parse(line.slice(5));
        const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];parts.forEach(p=>{if(p.text&&!p.thought)emit(p.text)})});
    }
  }catch(e){
    if(e&&e.name==="AbortError")throw{code:"cancelled",text:text||undefined};
    /* Gemini ne répond pas (quota, réseau, panne) : on passe sur Ollama si c'est activé sur cet appareil */
    const ec=e&&e.code?e.code:navigator.onLine?"upstream_error":"offline";
    if(prov==="gemini"&&a.backup&&!opts._prov&&["rate_limited","offline","upstream_error"].includes(ec)){try{return await aiSample(input,{...opts,_prov:"ollama"})}catch(e2){if(e2&&e2.code==="cancelled")throw e2}}
    if(e&&e.code)throw{...e,text:text||undefined};
    throw{code:navigator.onLine?(prov==="ollama"?"ollama_down":"upstream_error"):"offline",text:text||undefined,message:String(e&&e.message||e)};
  }
  if(!text.trim())throw{code:"empty_completion"};
  return{text,truncated:false,modelTierApplied:"default"};
}
aiSample.json=async(input,opts={})=>{
  const r=await aiSample(input,{...opts,_json:true}),t=r.text.trim(),m=t.match(/```(?:json)?\s*([\s\S]*?)```/),s=m?m[1]:t;
  try{return JSON.parse(s)}catch(e){
    const idx=[s.indexOf("["),s.indexOf("{")].filter(i=>i>=0),a=idx.length?Math.min(...idx):-1,b=Math.max(s.lastIndexOf("]"),s.lastIndexOf("}"));
    if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(_){}}
    throw{code:"invalid_json",text:r.text};
  }
};

/* ================================================================
   PRONOTE : emploi du temps, devoirs, notes, contenu des cours
   Les données viennent de la fonction Supabase « pronote » (voir supabase/functions/pronote)
   et arrivent sur tous tes appareils par la synchronisation (collection « pronote »).
   ================================================================ */
const PN_JSQR=["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js","https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"];
const PN_COLS=["#2d7ff0","#14a27a","#e0457f","#f0a30a","#7a5cff","#0ea5b7","#ff6a55","#8a6b3d","#5b8c2a","#c2410c"];
let PN_BUSY=false;
const pnData=()=>{const p=S.pronote&&S.pronote.data;return p&&typeof p==="object"&&p.updated?p:null};
const pnDay=s=>String(s||"").slice(0,10);
const pnHM=s=>{const d=new Date(s);return isNaN(+d)?"":d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const pnNum=n=>n==null||isNaN(n)?"—":(+n).toLocaleString("fr-FR",{maximumFractionDigits:2});
const pnCol=m=>{let h=0;String(m||"").split("").forEach(c=>h=(h*31+c.charCodeAt(0))>>>0);return PN_COLS[h%PN_COLS.length]};
function pnDayName(dk){const t=dkey(today()),tm=dkey(add(today(),1));if(dk===t)return"Aujourd'hui";if(dk===tm)return"Demain";const[y,m,d]=dk.split("-").map(Number),x=new Date(y,m-1,d);return JOURS[x.getDay()]+" "+d+" "+MOIS[m-1]}
function pnAge(iso){const m=Math.round((Date.now()-Date.parse(iso))/6e4);return m<1?"à l'instant":m<60?"il y a "+m+" min":m<24*60?"il y a "+Math.round(m/60)+" h":"le "+fts(Date.parse(iso))}
function pnErr(e){
  const c=e&&e.code,d=e&&e.detail?" ("+String(e.detail).slice(0,160)+")":"";
  return({no_session:"Connecte d'abord ta synchronisation dans Réglages.",offline:"Pas de connexion internet.",
    unreachable:"La fonction Pronote ne répond pas : vérifie qu'elle est bien déployée dans Supabase (Edge Functions)."+d,
    not_deployed:"La fonction Pronote n'est pas encore installée dans Supabase (Edge Functions).",auth:"Accès refusé par Supabase : dans la fonction, onglet Settings, désactive « Verify JWT with legacy secret » puis enregistre. Sinon, reconnecte-toi dans Réglages."+d,
    qr_invalid:"Ce QR code n'est pas celui de Pronote pour l'appli mobile.",pin_invalid:"Le code doit faire 4 chiffres.",
    qr_refused:"Pronote a refusé : le QR code a sans doute expiré (il ne dure que quelques minutes) ou le code à 4 chiffres est faux. Génère un nouveau QR code et recommence."+d,
    token_refused:"La connexion à Pronote a expiré : reconnecte Pronote avec un nouveau QR code (bouton plus bas)."+d,
    not_connected:"Pronote n'est pas connecté.",server:"Erreur du côté de la fonction Pronote"+d}[c])||("Ça n'a pas marché"+(c?" ("+c+")":"")+d);
}
/* nom de la fonction dans Supabase : « pronote », ou le nom donné automatiquement par Supabase */
const PN_SLUGS=["pronote","dynamic-worker"];
async function pnCall(action,extra){
  const saved=lsGet("cerveau-pn-slug",null),order=saved?[saved,...PN_SLUGS.filter(x=>x!==saved)]:PN_SLUGS;let last;
  for(const slug of order){
    try{const j=await pnCallSlug(slug,action,extra);lsSet("cerveau-pn-slug",slug);return j}
    catch(e){last=e;if(e.code!=="unreachable"&&e.code!=="not_deployed")throw e}
  }
  throw last;
}
async function pnCallSlug(slug,action,extra){
  if(!cfgOk()||!SESSION)throw{code:"no_session"};const t=await token();if(!t)throw{code:"no_session"};const c=cfg();
  let r;try{r=await fetch(c.supabaseUrl+"/functions/v1/"+slug,{method:"POST",headers:{apikey:c.supabaseKey,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({action,...(extra||{})})})}
  catch(e){throw{code:navigator.onLine?"unreachable":"offline",detail:String(e&&e.message||e)}}
  const tx=await r.text();let j={};try{j=JSON.parse(tx)}catch(e){}
  if(r.status===404&&!j.error)throw{code:"not_deployed"};
  if(!r.ok||j.error)throw{code:j.error||(r.status===401?"auth":"http_"+r.status),detail:j.detail||j.message||tx.slice(0,160)};
  return j;
}
function pnApply(data){if(!data||typeof data!=="object")return;S.pronote={...S.pronote,data};localSaveSoon();render()}
async function pnRefresh(manual){
  if(PN_BUSY)return;PN_BUSY=true;if(manual){V.pnMsg="";render(true)}
  try{const j=await pnCall("refresh");pnApply(j.data);V.pnMsg="";V.pnBad=null;aideErr("pronote",null)}
  catch(e){V.pnMsg=pnErr(e);V.pnBad=e.code||"err";aideErr("pronote",V.pnMsg)}
  PN_BUSY=false;render(!!manual);
}
function pnAuto(){
  const p=pnData();if(!p||!SESSION||!navigator.onLine||PN_BUSY)return;
  const age=Date.now()-Date.parse(p.updated),last=lsGet("cerveau-pn-try",0);
  if(age>3*36e5&&Date.now()-last>30*6e4){lsSet("cerveau-pn-try",Date.now());pnRefresh(false)}
}
async function pnConnect(pin){
  if(!V.pnQR)return;V.pnBusy=true;V.pnMsg="Connexion à Pronote…";render(true);
  try{const j=await pnCall("connect",{qr:V.pnQR,pin});pnApply(j.data);V.pnQR=null;V.pnBad=null;V.pnConnecting=false;aideErr("pronote",null);V.pnMsg="✓ Pronote est connecté.";V.pntab="jour"}
  catch(e){V.pnMsg=pnErr(e);V.pnBad=e.code||"err";aideErr("pronote",V.pnMsg);if(e.code==="qr_refused"||e.code==="qr_invalid")V.pnQR=null}
  V.pnBusy=false;render(true);
}
async function pnLogout(){V.pnMsg="Déconnexion…";render(true);try{await pnCall("logout")}catch(e){}S.pronote={};localSaveSoon();V.pnMsg="Pronote est déconnecté.";V.pnBad=null;render(true)}

/* ---- lecture du QR code : caméra ou photo ---- */
function pnLoadQR(i=0){return window.jsQR?Promise.resolve(window.jsQR):new Promise((res,rej)=>{if(i>=PN_JSQR.length)return rej(new Error("jsQR"));
  const s=document.createElement("script");s.src=PN_JSQR[i];s.onload=()=>window.jsQR?res(window.jsQR):rej(new Error("jsQR"));s.onerror=()=>{s.remove();pnLoadQR(i+1).then(res,rej)};document.head.appendChild(s)})}
function pnQrOk(t){try{const o=JSON.parse(t);return!!(o&&o.url&&o.jeton&&o.login)}catch(e){return false}}
function pnGotQR(t){
  if(!pnQrOk(t)){V.pnMsg="Ce QR code n'est pas celui de Pronote pour l'appli mobile.";return render(true)}
  V.pnQR=t;V.pnMsg="";render(true);setTimeout(()=>{const i=document.getElementById("pn-pin");if(i)i.focus()},60);
}
async function pnScan(){
  let jsQR;try{jsQR=await pnLoadQR()}catch(e){V.pnMsg="Le lecteur de QR code ne se charge pas : vérifie ta connexion.";return render(true)}
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})}
  catch(e){V.pnMsg="L'appareil photo n'est pas accessible. Autorise-le, ou prends une photo du QR code et utilise « Choisir une photo ».";return render(true)}
  const ov=document.createElement("div");ov.className="pnscan";
  ov.innerHTML=`<video playsinline muted autoplay></video><p>Vise le QR code affiché par Pronote sur ton ordi</p><button type="button" class="btn">Annuler</button>`;
  document.body.appendChild(ov);
  const v=ov.querySelector("video"),cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});v.srcObject=st;
  let on=true;const stop=()=>{on=false;st.getTracks().forEach(t=>t.stop());ov.remove()};ov.querySelector("button").onclick=stop;
  const tick=()=>{if(!on)return;
    if(v.readyState>=2&&v.videoWidth){const w=Math.min(720,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
      const q=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(q&&q.data){stop();return pnGotQR(q.data)}}
    requestAnimationFrame(tick)};
  try{await v.play()}catch(e){}requestAnimationFrame(tick);
}
async function pnImage(file){
  let jsQR;try{jsQR=await pnLoadQR()}catch(e){V.pnMsg="Le lecteur de QR code ne se charge pas : vérifie ta connexion.";return render(true)}
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement("canvas");cv.width=w;cv.height=h;
    const cx=cv.getContext("2d");cx.drawImage(im,0,0,w,h);const q=jsQR(cx.getImageData(0,0,w,h).data,w,h);URL.revokeObjectURL(url);
    if(q&&q.data)pnGotQR(q.data);else{V.pnMsg="Aucun QR code trouvé sur cette image : prends-la de plus près, bien nette.";render(true)}};
  im.onerror=()=>{URL.revokeObjectURL(url);V.pnMsg="Image illisible.";render(true)};im.src=url;
}
