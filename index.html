const nMaj=n=>n.maj||n.ts||0;
const nLines=n=>String(n.txt||"").split("\n").map(s=>s.trim()).filter(Boolean);
const nTitle=n=>(nLines(n)[0]||"Nouvelle note").slice(0,120);
const nPrev=n=>nLines(n).slice(1).join(" ").slice(0,160)||"Aucun texte supplémentaire";
const nRealF=f=>f&&f!=="all"&&f!=="none"&&f!=="trash"&&!!S.projets[f];
function fName(f){return f==="all"?"Toutes les notes":f==="none"?"Notes":f==="trash"?"Suppr. récemment":f&&S.projets[f]?S.projets[f].nom:"Dossiers"}
function nIn(f){
  const all=Object.entries(S.notes).filter(([,n])=>n&&typeof n==="object");
  const a=f==="trash"?all.filter(([,n])=>n.suppr):all.filter(([,n])=>!n.suppr&&(f==="all"||(f==="none"?!nRealF(n.projet):n.projet===f)));
  return a.sort((x,y)=>(f==="trash"?(y[1].suppr-x[1].suppr):nMaj(y[1])-nMaj(x[1])));
}
function nDays(ts){const d=new Date(ts);d.setHours(0,0,0,0);return Math.round((today()-d)/864e5)}
function nWhen(ts){const d=new Date(ts),k=nDays(ts);
  if(k<=0)return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  if(k===1)return"Hier";if(k<7)return JOURS[d.getDay()].toLowerCase();
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})}
function nGroup(ts){const d=new Date(ts),k=nDays(ts);
  if(k<=0)return"Aujourd'hui";if(k===1)return"Hier";if(k<=7)return"7 jours précédents";if(k<=30)return"30 jours précédents";
  return MOIS[d.getMonth()].replace(/^./,c=>c.toUpperCase())+(d.getFullYear()!==today().getFullYear()?" "+d.getFullYear():"")}
function nLong(ts){const d=new Date(ts);return d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear()+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}

/* ---- HTML des notes : on ne garde que la mise en forme utile ---- */
const NTAGS={H1:1,H2:1,H3:1,P:1,DIV:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,UL:1,OL:1,LI:1};
function cleanHtmlOld(h){
  const t=document.createElement("template");t.innerHTML=String(h||"");
  const walk=el=>[...el.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|IMG|VIDEO|AUDIO|LINK|META)$/i.test(c.tagName)){c.remove();return}
    walk(c);
    if(!NTAGS[c.tagName]){c.replaceWith(...c.childNodes);return}
    const ck=c.tagName==="UL"&&c.classList.contains("ck"),ok=c.tagName==="LI"&&c.getAttribute("data-ok")==="1";
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));if(ck)c.className="ck";if(ok)c.setAttribute("data-ok","1");
  });
  walk(t.content);return t.innerHTML;
}
function nHtml(n){return n.html!=null?cleanHtml(n.html):String(n.txt||"").split("\n").map(l=>`<div>${esc(l)||"<br>"}</div>`).join("")}
function edText(el){return String(el.innerText||"").replace(/ /g," ").replace(/\n{3,}/g,"\n\n").trim()}

/* ---- rangement : anciens projets, corbeille de 30 jours ---- */
function nHousekeep(){
  const lim=Date.now()-30*864e5;
  Object.entries(S.notes).forEach(([id,n])=>{if(n&&n.suppr&&n.suppr<lim)del("notes",id)});
  Object.entries(S.projets).forEach(([pid,p])=>{if(!p||p.migre)return;const ts=p.taches||[],cl=p.clair||{},now=Date.now();
    const qa=CLAIR.map((q,i)=>cl[i]?[q,cl[i]]:null).filter(Boolean);if(!ts.length&&!qa.length)return;
    if(ts.length&&!S.notes["mig-et-"+pid])put("notes","mig-et-"+pid,{projet:pid,html:`<h1>Étapes</h1><ul class="ck">${ts.map(t=>`<li${t.ok?' data-ok="1"':""}>${esc(t.t)}</li>`).join("")}</ul>`,txt:"Étapes\n"+ts.map(t=>t.t).join("\n"),ts:p.cree||now,maj:now},true);
    if(qa.length&&!S.notes["mig-cl-"+pid])put("notes","mig-cl-"+pid,{projet:pid,html:"<h1>Y voir clair</h1>"+qa.map(([q,a])=>`<h3>${esc(q)}</h3>${String(a).split("\n").map(l=>`<div>${esc(l)||"<br>"}</div>`).join("")}`).join(""),txt:"Y voir clair\n"+qa.map(([q,a])=>q+"\n"+a).join("\n"),ts:p.cree||now,maj:now},true);
    put("projets",pid,{...p,migre:true},true);
  });
}

function nFolderCell(f,n){const ic=f==="trash"?NI.trash:NI.folder;return`<button class="ncell" data-nf="${f}">${ic}<span class="nm">${esc(fName(f))}</span><span class="ct">${n}</span><span class="chev" aria-hidden="true">›</span></button>`}
function nRow(id,n,showF){
  const f=showF&&nRealF(n.projet)?`<small>${NI.folder}${esc(S.projets[n.projet].nom)}</small>`:"";
  return`<button class="nrow" data-note="${id}"><b>${n.epingle&&!n.suppr?`<i class="npin">${NI.pin}</i>`:""}${esc(nTitle(n))}</b><span><em>${nWhen(n.suppr||nMaj(n))}</em>${esc(nPrev(n))}</span>${f}</button>`}
function nListHtml(scope,q){
  q=String(q||"").trim().toLowerCase();
  if(q){const hits=nIn(scope==="trash"?"trash":scope||"all").filter(([,n])=>String(n.txt||"").toLowerCase().includes(q));
    return`<p class="nhead">${hits.length} résultat${hits.length>1?"s":""}</p>${hits.length?`<div class="ngroup">${hits.map(([id,n])=>nRow(id,n,!scope||scope==="all")).join("")}</div>`:`<p class="nempty">Aucune note ne contient « ${esc(q)} ».</p>`}`}
  if(!scope){
    const fs=Object.entries(S.projets).filter(([,p])=>p&&p.nom).sort((a,b)=>a[1].nom.localeCompare(b[1].nom,"fr")),tr=nIn("trash").length;
    return`<div class="ngroup">${fs.length?nFolderCell("all",nIn("all").length):""}${nFolderCell("none",nIn("none").length)}${fs.map(([id])=>nFolderCell(id,nIn(id).length)).join("")}</div>
     ${V.newf?`<form class="ngroup nform" data-f="nfolder"><input class="nin" id="nf-nom" name="nom" placeholder="Nom du dossier" autocomplete="off" maxlength="60" required><button class="nlink" type="submit">Créer</button><button class="nlink" type="button" data-newf="0">Annuler</button></form>`:""}
     ${tr?`<div class="ngroup">${nFolderCell("trash",tr)}</div>`:""}`}
  const list=nIn(scope);
  if(!list.length)return`<p class="nempty">${scope==="trash"?"Aucune note supprimée.":"Aucune note"}</p>`;
  if(scope==="trash")return`<p class="nsub">Les notes sont supprimées définitivement au bout de 30 jours.</p><div class="ngroup">${list.map(([id,n])=>nRow(id,n,false)).join("")}</div>`;
  const pins=list.filter(([,n])=>n.epingle),rest=list.filter(([,n])=>!n.epingle),groups=[];
  rest.forEach(([id,n])=>{const g=nGroup(nMaj(n)),last=groups[groups.length-1];if(last&&last[0]===g)last[1].push([id,n]);else groups.push([g,[[id,n]]])});
  return(pins.length?[["Épinglées",pins],...groups]:groups).map(([g,a])=>`<p class="nhead">${g}</p><div class="ngroup">${a.map(([id,n])=>nRow(id,n,scope==="all")).join("")}</div>`).join("");
}

/* ---- édition ---- */
let nT=null;
function nSaveSoon(){clearTimeout(nT);nT=setTimeout(nSave,500)}
function nSave(){
  clearTimeout(nT);const el=document.getElementById("ned");if(!el)return;
  const id=el.dataset.ned,n=S.notes[id]||(V.ndraft&&V.ndraft.id===id?V.ndraft.n:null);if(!n)return;
  const html=cleanHtml(el.innerHTML),txt=edText(el);
  if(html===cleanHtml(nHtml(n)))return;
  if(!S.notes[id]&&!txt)return;
  put("notes",id,{...n,html,txt,maj:Date.now()},true);
  if(V.ndraft&&V.ndraft.id===id)V.ndraft=null;
}
function nBack(){
  nSave();const id=V.note,n=S.notes[id];
  if(n&&!n.suppr&&!String(n.txt||"").trim())del("notes",id);
  V.note=null;V.ndraft=null;V.confirm=null;render(true);window.scrollTo(0,0);
}
function nCompose(){
  const id=uid(),now=Date.now();V.ndraft={id,n:{projet:nRealF(V.nf)?V.nf:null,html:"",txt:"",ts:now,maj:now}};V.note=id;V.confirm=null;render(true);window.scrollTo(0,0);
  const el=document.getElementById("ned");if(el){el.focus();const r=document.createRange();r.selectNodeContents(el.firstChild||el);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
}
let nRange=null;
document.addEventListener("selectionchange",()=>{const el=document.getElementById("ned"),s=getSelection();if(el&&s.rangeCount&&el.contains(s.anchorNode))nRange=s.getRangeAt(0).cloneRange()});
const upTo=(node,sel,root)=>{let x=node&&node.nodeType===3?node.parentNode:node;while(x&&x!==root){if(x.matches&&x.matches(sel))return x;x=x.parentNode}return null};
function nFormat(cmd){
  const el=document.getElementById("ned");if(!el)return;
  if(document.activeElement!==el){el.focus();if(nRange){const s=getSelection();s.removeAllRanges();s.addRange(nRange)}}
  try{document.execCommand("defaultParagraphSeparator",false,"div")}catch(e){}
  const at=()=>getSelection().anchorNode;
  if(cmd==="ck"){
    const li=upTo(at(),"li",el),ul=li&&li.parentNode;
    if(ul&&ul.tagName==="UL"&&ul.classList.contains("ck"))document.execCommand("insertUnorderedList");
    else{if(!(ul&&ul.tagName==="UL"))document.execCommand(ul?"insertOrderedList":"insertUnorderedList");if(ul&&ul.tagName==="OL")document.execCommand("insertUnorderedList");const u=upTo(at(),"ul",el);if(u)u.className="ck"}
  }else if(cmd==="ul"||cmd==="ol"){
    const u=upTo(at(),"ul",el);if(cmd==="ul"&&u&&u.classList.contains("ck")){u.removeAttribute("class");[...u.children].forEach(li=>li.removeAttribute("data-ok"))}
    else document.execCommand(cmd==="ul"?"insertUnorderedList":"insertOrderedList");
  }else if(/^(h1|h2|h3|div)$/.test(cmd))document.execCommand("formatBlock",false,cmd==="div"?"div":"<"+cmd+">");
  else document.execCommand(cmd);
  nSaveSoon();
}
function nToggle(id){["nfmt","nmenu","nfmenu"].forEach(k=>{const p=document.getElementById(k);if(p)p.hidden=k===id?!p.hidden:true})}
function nDebloque(id){
  nSave();const n=S.notes[id];if(!n||!String(n.txt||"").trim())return;
  stream("deb|"+id,`Tu aides un lycéen à démêler ce qui lui prend la tête. Sois chaleureux, direct et concret, sans jugement et sans psychologiser.
Voici sa note${nRealF(n.projet)?` (dossier « ${S.projets[n.projet].nom} »)`:""} :
${String(n.txt).slice(0,4000)}
Réponds en français, sans titres markdown, en trois parties courtes séparées par une ligne vide :
1) Ce que tu comprends de la situation (2 phrases).
2) Trois questions pour l'aider à avancer (tirets).
3) Une micro-action faisable en 15 minutes cette semaine.`);
}
/* garder le curseur dans la note quand on touche la barre de mise en forme */
document.addEventListener("mousedown",e=>{if(e.target.closest&&e.target.closest("[data-fmt]"))e.preventDefault()});
/* cocher une case : toucher le rond à gauche de la ligne */
document.addEventListener("click",e=>{
  const li=e.target.closest&&e.target.closest("#ned ul.ck>li");if(!li)return;
  if(e.clientX<li.getBoundingClientRect().left){e.preventDefault();if(li.getAttribute("data-ok")==="1")li.removeAttribute("data-ok");else li.setAttribute("data-ok","1");nSaveSoon()}
},true);
/* une nouvelle ligne de liste n'est jamais déjà cochée */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!e.target.closest||!e.target.closest("#ned"))return;
  setTimeout(()=>{const el=document.getElementById("ned");const li=el&&upTo(getSelection().anchorNode,"li",el);if(li&&li.getAttribute("data-ok")==="1"&&!li.textContent.trim())li.removeAttribute("data-ok")},0);
});
/* coller du texte simple */
document.addEventListener("paste",e=>{
  if(!e.target.closest||!e.target.closest("#ned"))return;e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData("text/plain");document.execCommand("insertText",false,t);
});

let MOD={sig:null,tiles:[],adds:{},clicks:{},submits:{},err:{}};
let modSafe=(()=>{try{const b=localStorage.getItem("cerveau-modboot");return b==="1"||b==="2"||/[?&]sans-modules/.test(location.search)}catch(e){return false}})();
const modList=()=>(((S.params||{}).modules||{}).list)||[];
const modSig=()=>modSafe?"safe":modList().map(m=>m.id+":"+m.ts+":"+(m.on?1:0)).join(",")+"|"+(V.modTry?V.modTry.ts:"");
function modApi(m){const id=m.id;return{
  tuile:o=>{if(!o||!o.k||typeof o.page!=="function")throw new Error("C.tuile a besoin de k et de page");MOD.tiles.push({k:"m_"+String(o.k).replace(/[^a-z0-9_-]/gi,"").slice(0,20),id,nom:String(o.nom||o.k).slice(0,30),emoji:String(o.emoji||"🧩").slice(0,4),couleur:/^#[0-9a-f]{3,8}$/i.test(o.couleur||"")?o.couleur:"#5b6b82",resume:typeof o.resume==="function"?o.resume:null,page:o.page})},
  ajoute:(p,fn,pos)=>{if(typeof fn!=="function")throw new Error("C.ajoute a besoin d'une fonction");(MOD.adds[p]=MOD.adds[p]||[]).push({id,fn,pos:pos==="haut"?"haut":"bas"})},
  clic:(n,fn)=>{MOD.clicks[n]={id,fn}},envoi:(n,fn)=>{MOD.submits[n]={id,fn}},
  data:()=>JSON.parse(JSON.stringify(S.perso[id]||{})),save:o=>put("perso",id,o&&typeof o==="object"?JSON.parse(JSON.stringify(o)):{}),
  lire:c=>JSON.parse(JSON.stringify(S[c]||{})),esc,aujourdhui:()=>dkey(today()),date:s=>fdate(s),rendu:()=>render(true),va:p=>go(p),
  ia:p=>SAMPLE?SAMPLE(String(p),{}).then(r=>r.text):Promise.reject(new Error("IA non configurée"))}}
function modDrop(id){MOD.tiles=MOD.tiles.filter(t=>t.id!==id);Object.keys(MOD.adds).forEach(p=>MOD.adds[p]=MOD.adds[p].filter(x=>x.id!==id));["clicks","submits"].forEach(k=>Object.keys(MOD[k]).forEach(n=>{if(MOD[k][n].id===id)delete MOD[k][n]}))}
function modLoad(){MOD={sig:modSig(),tiles:[],adds:{},clicks:{},submits:{},err:{}};let css="";
  if(!modSafe){const L=modList().filter(m=>m.on);if(V.modTry)L.push(V.modTry);
    L.forEach(m=>{try{new Function("C",String(m.js||""))(modApi(m));css+="\n"+String(m.css||"").replace(/<\/?style[^>]*>/gi,"")}catch(e){MOD.err[m.id]=String(e&&e.message||e).slice(0,200);modDrop(m.id)}})}
  let st=document.getElementById("modcss");if(!st){st=document.createElement("style");st.id="modcss";document.head.appendChild(st)}st.textContent=css}
function modFail(id,e){MOD.err[id]=String(e&&e.message||e).slice(0,200)}
function modName(id){return(modList().find(m=>m.id===id)||(V.modTry&&V.modTry.id===id?V.modTry:{})).nom||"?"}
function modHtml(id,fn){try{const h=fn();return h==null?"":String(h)}catch(e){modFail(id,e);return`<div class="card stack" style="gap:8px"><p class="small">⚠️ Le module « ${esc(modName(id))} » a un problème : ${esc(MOD.err[id])}</p><div><button class="ghost" data-page="idees">Voir dans 💡 Suggestions</button></div></div>`}}
function modWrap(p,html){const a=MOD.adds[p];if(!a||!a.length)return html;const f=pos=>a.filter(x=>x.pos===pos).map(x=>modHtml(x.id,x.fn)).join("");return f("haut")+html+f("bas")}
function modSum(t){try{const r=t.resume?t.resume():["",""];return[esc(String((r||[])[0]??"")),esc(String((r||[])[1]??""))]}catch(e){modFail(t.id,e);return["⚠️","module en panne"]}}
function modTarget(id){const t=MOD.tiles.find(x=>x.id===id);if(t)return t.k;return Object.keys(MOD.adds).find(p=>MOD.adds[p].some(x=>x.id===id))||null}
function modCheck(id){
  MOD.tiles.filter(t=>t.id===id).forEach(t=>{modHtml(id,t.page);modSum(t)});
  Object.values(MOD.adds).forEach(a=>a.filter(x=>x.id===id).forEach(x=>modHtml(id,x.fn)));
  if(MOD.err[id])return MOD.err[id];
  if(!MOD.tiles.some(t=>t.id===id)&&!modTarget(id)&&!(V.modTry&&String(V.modTry.css||"").trim()))return"le module n'ajoute rien de visible (ni tuile, ni bloc, ni style)";
  return""}

function modPrompt(idee,fix){return`Tu écris un petit module JavaScript pour « 2ème cerveau », l'appli web personnelle de Nathan (élève de Terminale, en français, tutoiement, style épuré).

API de C :

${String(fix.code).slice(0,6000)}

`:""}Idée de Nathan : « ${String(idee).slice(0,800)} »

{c:"Économie",t:"La destruction créatrice",x:"L'idée vient de l'économiste autrichien Joseph Schumpeter, en 1942 : le capitalisme avance par vagues d'innovations qui détruisent les anciennes activités tout en en créant de nouvelles. Le smartphone a fait disparaître les baladeurs, les GPS de voiture et une bonne partie des appareils photo compacts, mais il a créé des millions d'emplois dans les applis. Pour Schumpeter, le héros de l'économie est l'entrepreneur, qui ose combiner autrement les moyens de production. Revers de la médaille : les travailleurs des secteurs qui disparaissent paient le prix de la transition. C'est un concept clé en SES quand on parle de croissance et de progrès technique.",
 s:"Kodak a inventé le premier appareil photo numérique dès 1975… et a fait faillite en 2012, balayé par la photo numérique.",q:"Quel économiste a popularisé l'expression « destruction créatrice » ?",o:["Joseph Schumpeter","John Maynard Keynes","Adam Smith"],a:0,e:"Schumpeter l'a rendue célèbre dans « Capitalisme, socialisme et démocratie » (1942)."},
{c:"Maths",t:"Le paradoxe des anniversaires",x:"Dans un groupe de seulement 23 personnes, il y a plus d'une chance sur deux que deux d'entre elles aient le même anniversaire. Ça paraît fou, car on pense à « quelqu'un qui a MON anniversaire », alors que la question porte sur toutes les paires possibles : avec 23 personnes, il y en a 253. Le calcul passe par l'événement contraire : la probabilité que tous les anniversaires soient différents vaut 365/365 × 364/365 × … × 343/365, soit environ 0,49. La probabilité d'au moins une coïncidence est donc d'environ 0,51. C'est exactement la méthode de l'événement contraire de ton cours de probas.",
 s:"Avec 70 personnes, la probabilité dépasse 99,9 %.",q:"À partir de combien de personnes la probabilité d'un anniversaire commun dépasse-t-elle 50 % ?",o:["23","183","365"],a:0,e:"Dès 23 personnes : 253 paires possibles, c'est beaucoup plus qu'on ne l'imagine."},
{c:"Histoire",t:"La chute du mur de Berlin",x:"Le mur de Berlin est construit dans la nuit du 13 août 1961 par la RDA, l'Allemagne de l'Est communiste, pour empêcher ses habitants de fuir vers l'Ouest. Pendant 28 ans, il coupe la ville en deux et devient le symbole de la guerre froide. Le 9 novembre 1989, un porte-parole du régime, Günter Schabowski, annonce par erreur en conférence de presse que les voyages sont autorisés « immédiatement ». Des milliers de Berlinois se ruent aux postes-frontières, que les gardes finissent par ouvrir. L'Allemagne est réunifiée moins d'un an plus tard, le 3 octobre 1990.",
 s:"Le 3 octobre, jour de la réunification, est aujourd'hui la fête nationale allemande.",q:"En quelle année le mur de Berlin a-t-il été construit ?",o:["1961","1949","1975"],a:0,e:"En août 1961 ; il est tombé le 9 novembre 1989, après 28 ans."},
{c:"Psychologie",t:"L'aversion à la perte",x:"Perdre 100 € nous fait environ deux fois plus mal que gagner 100 € ne nous fait plaisir. C'est l'aversion à la perte, mise en évidence par les psychologues Daniel Kahneman et Amos Tversky dans leur théorie des perspectives (1979). Elle explique un piège classique des investisseurs : garder trop longtemps une action qui baisse pour ne pas « encaisser » la perte, et vendre trop vite celles qui montent. Les bons traders fixent donc à l'avance leur stop-loss, pour que l'émotion ne décide pas à leur place. Ces travaux ont fondé la finance comportementale.",
 s:"Tversky, mort en 1996, n'a pas pu partager le prix Nobel : il n'est jamais attribué après la mort.",q:"Qui a reçu le prix Nobel d'économie en 2002 pour ces travaux ?",o:["Daniel Kahneman","Milton Friedman","Paul Krugman"],a:0,e:"Kahneman, un psychologue, a reçu le prix Nobel d'économie 2002."},
{c:"Philosophie",t:"L'allégorie de la caverne",x:"Dans « La République » (livre VII), Platon imagine des prisonniers enchaînés depuis l'enfance au fond d'une caverne : ils ne voient que des ombres projetées sur le mur et les prennent pour la réalité. L'un d'eux est libéré : la lumière l'éblouit d'abord, puis il découvre les vrais objets, et enfin le soleil. Quand il redescend pour libérer les autres, ils se moquent de lui et refusent de le suivre. Pour Platon, les ombres sont les opinions, le soleil est la vérité, et la sortie de la caverne représente l'éducation : un chemin difficile mais libérateur. C'est un classique du bac de philo, sur la vérité, la connaissance ou la liberté.",
 s:"Beaucoup voient dans la caverne l'ancêtre du cinéma… ou des écrans d'aujourd'hui.",q:"Dans quel ouvrage de Platon se trouve l'allégorie de la caverne ?",o:["La République","Le Banquet","Les Lois"],a:0,e:"Au début du livre VII de « La République »."},
{c:"Géopolitique",t:"Le détroit d'Ormuz",x:"Le détroit d'Ormuz relie le golfe Persique à l'océan Indien, entre l'Iran au nord et Oman au sud. Large d'environ 33 km à son point le plus étroit, il voit passer environ un cinquième du pétrole consommé dans le monde, venu d'Arabie saoudite, d'Irak, du Koweït ou des Émirats, ainsi qu'une grande partie du gaz naturel liquéfié du Qatar. Dès que les tensions montent dans la région, les marchés craignent un blocage et le prix du baril grimpe. C'est l'un des points de passage les plus surveillés de la planète, avec le canal de Suez et le détroit de Malacca. Pense à lui quand tu vois bouger le cours du pétrole dans la rubrique Finance.",
 s:"Pour contourner le détroit, l'Arabie saoudite a construit un oléoduc qui traverse tout le pays jusqu'à la mer Rouge.",q:"Entre quels pays se trouve le détroit d'Ormuz ?",o:["L'Iran et Oman","L'Iran et l'Irak","L'Arabie saoudite et l'Égypte"],a:0,e:"L'Iran au nord, Oman (la péninsule de Musandam) au sud."},
{c:"Sciences",t:"L'entropie, la flèche du temps",x:"Le second principe de la thermodynamique dit que, dans un système isolé, l'entropie (en gros, le désordre) ne peut pas diminuer. C'est pour ça que la chaleur passe toujours du chaud vers le froid, qu'un sucre se dissout dans le café sans jamais se reformer, et qu'un œuf cassé ne se recolle pas. Ce principe donne un sens au temps : les lois de la mécanique marchent aussi bien à l'endroit qu'à l'envers, mais l'entropie, elle, ne fait qu'augmenter. Le physicien Ludwig Boltzmann l'a reliée au nombre de façons d'arranger les particules : S = k log W.",
 s:"La formule S = k log W est gravée sur la tombe de Boltzmann, à Vienne.",q:"Que dit le second principe de la thermodynamique ?",o:["L'entropie d'un système isolé ne peut pas diminuer","L'énergie peut être créée à partir de rien","La chaleur va spontanément du froid vers le chaud"],a:0,e:"Le désordre d'un système isolé augmente ou reste stable : il ne baisse jamais tout seul."},
{c:"Finance",t:"Les intérêts composés et la règle de 72",x:"Avec les intérêts composés, tu gagnes des intérêts sur tes intérêts : chaque année, le capital est multiplié par (1 + taux). C'est une suite géométrique, comme dans ton cours de maths. 1 000 € placés à 7 % par an deviennent environ 7 600 € en 30 ans, sans rien ajouter. Pour estimer vite le temps de doublement, les financiers utilisent la règle de 72 : on divise 72 par le taux en pourcentage. À 6 %, l'argent double en environ 72 ÷ 6 = 12 ans.",
 s:"72 est choisi parce qu'il est proche de 100 × ln 2 ≈ 69, et qu'il se divise par 2, 3, 4, 6, 8, 9 et 12 : parfait pour le calcul mental.",q:"Avec la règle de 72, en combien de temps un placement à 6 % par an double-t-il ?",o:["Environ 12 ans","Environ 6 ans","Environ 20 ans"],a:0,e:"72 ÷ 6 = 12 ; le calcul exact (ln 2 ÷ ln 1,06) donne 11,9 ans."},
{c:"Langue française",t:"Tirer les marrons du feu",x:"Aujourd'hui, on dit souvent « tirer les marrons du feu » pour « profiter d'une situation ». Mais le sens d'origine est presque l'inverse ! L'expression vient de la fable de La Fontaine « Le Singe et le Chat » : le singe Bertrand convainc le chat Raton de sortir des marrons qui grillent dans la cheminée. Raton se brûle les pattes pour les attraper, et Bertrand les croque au fur et à mesure. Tirer les marrons du feu, c'est donc prendre des risques pour le profit d'un autre. Garde le sens d'origine en tête pour briller à l'oral.",
 s:"« La part du lion » vient aussi de La Fontaine : dans une fable du livre I, le lion garde tout le butin pour lui.",q:"Dans la fable, qui se brûle pour tirer les marrons du feu ?",o:["Le chat Raton","Le singe Bertrand","Le renard"],a:0,e:"Raton se brûle les pattes, et c'est Bertrand qui mange les marrons."},
{c:"Arts et lettres",t:"Guernica, de Picasso",x:"Le 26 avril 1937, pendant la guerre d'Espagne, la petite ville basque de Guernica est bombardée par l'aviation allemande et italienne, venue soutenir le camp du général Franco. Picasso, qui doit réaliser une grande toile pour le pavillon espagnol de l'Exposition universelle de Paris, peint en quelques semaines « Guernica » : près de 8 mètres de large, uniquement en noir, blanc et gris. On y voit un cheval hurlant, une mère tenant son enfant mort, un taureau, des corps brisés. Picasso refuse que le tableau aille en Espagne tant que le pays n'est pas une démocratie : il n'y arrive qu'en 1981, après la mort de Franco. Il est aujourd'hui au musée Reina Sofía, à Madrid.",
 s:"Selon une anecdote célèbre, un officier allemand aurait demandé à Picasso devant une photo du tableau : « C'est vous qui avez fait ça ? » Il aurait répondu : « Non, c'est vous. »",q:"Quel événement le tableau dénonce-t-il ?",o:["Le bombardement d'une ville pendant la guerre d'Espagne","Une bataille de la Première Guerre mondiale","La prise de la Bastille"],a:0,e:"Guernica a été bombardée le 26 avril 1937, pendant la guerre civile espagnole."},
{c:"Économie",t:"L'avantage comparatif de Ricardo",x:"En 1817, l'économiste anglais David Ricardo montre une idée contre-intuitive : même si un pays est meilleur que l'autre pour tout produire, les deux ont intérêt à échanger. Il prend l'exemple de l'Angleterre et du Portugal, qui produisent du drap et du vin. Le Portugal est plus efficace pour les deux, mais il l'est relativement plus pour le vin : il a donc intérêt à se spécialiser dans le vin et à acheter le drap anglais. Chacun se concentre sur ce qu'il fait le mieux, en relatif, et la production totale augmente. C'est la base de la théorie du libre-échange, au programme de SES.",
 s:"C'est comme un grand chef qui coupe les légumes plus vite que son commis : il a quand même intérêt à le laisser faire et à se concentrer sur la cuisine.",q:"Quels produits Ricardo utilise-t-il dans son célèbre exemple ?",o:["Le vin et le drap","Le blé et l'acier","Le thé et le coton"],a:0,e:"Le Portugal se spécialise dans le vin, l'Angleterre dans le drap."},
{c:"Maths",t:"Il y a une infinité de nombres premiers",x:"Vers 300 avant J.-C., Euclide prouve dans ses « Éléments » qu'il existe une infinité de nombres premiers, avec un raisonnement par l'absurde très élégant. Suppose qu'il n'y en ait qu'un nombre fini : p₁, p₂, …, pₙ. Considère N = p₁ × p₂ × … × pₙ + 1. Divisé par n'importe lequel de ces nombres premiers, N donne un reste de 1 : aucun ne le divise. Or N a forcément un diviseur premier, qui n'est donc pas dans la liste : c'est une contradiction. Ce raisonnement est au programme de maths expertes.",
 s:"Attention : N n'est pas forcément premier lui-même. 2 × 3 × 5 × 7 × 11 × 13 + 1 = 30 031 = 59 × 509.",q:"Dans la preuve d'Euclide, pourquoi aucun nombre premier de la liste ne divise N ?",o:["Parce que la division de N par chacun donne un reste de 1","Parce que N est forcément premier","Parce que N est pair"],a:0,e:"N = (produit des pᵢ) + 1 : le reste de la division par chaque pᵢ vaut 1."},
{c:"Histoire",t:"Bretton Woods et la fin de l'étalon-or",x:"En juillet 1944, avant même la fin de la guerre, 44 pays se réunissent à Bretton Woods, aux États-Unis, pour reconstruire le système monétaire mondial. Le dollar devient la monnaie centrale : il est convertible en or à 35 dollars l'once, et les autres monnaies ont un taux fixe par rapport au dollar. Ces accords créent aussi le FMI et la Banque mondiale. Mais en 1971, les États-Unis n'ont plus assez d'or pour couvrir tous les dollars en circulation : le président Nixon suspend la convertibilité. Depuis 1973, les grandes monnaies flottent : leur valeur varie chaque jour sur le marché des changes, le Forex, le plus grand marché financier du monde.",
 s:"La décision de Nixon, annoncée le 15 août 1971, a pris le monde entier par surprise : on parle du « choc Nixon ».",q:"En 1971, quel président américain met fin à la convertibilité du dollar en or ?",o:["Richard Nixon","John F. Kennedy","Ronald Reagan"],a:0,e:"Nixon l'annonce le 15 août 1971."},
{c:"Psychologie",t:"Le biais de confirmation",x:"Le biais de confirmation, c'est notre tendance à chercher, retenir et croire surtout les informations qui confirment ce que l'on pense déjà. En 1960, le psychologue Peter Wason donne la suite 2, 4, 6 et demande de trouver la règle en proposant d'autres suites. La plupart des gens testent 8, 10, 12 ou 20, 22, 24, s'entendent répondre « oui » et sont sûrs d'avoir trouvé « des nombres pairs qui se suivent ». La vraie règle était simplement « trois nombres croissants » : il fallait tester des suites qui pouvaient contredire son idée, comme 1, 2, 3. En trading, c'est un piège redoutable : ne lire que les avis qui donnent raison à sa position.",
 s:"Le meilleur antidote : chercher exprès l'argument contraire, comme un « avocat du diable ».",q:"Dans l'expérience 2-4-6 de Wason, quelle était la vraie règle ?",o:["Trois nombres croissants","Trois nombres pairs qui se suivent","Trois multiples de 2"],a:0,e:"Il suffisait que les nombres soient croissants : 1, 2, 3 marchait aussi."},
{c:"Philosophie",t:"Le pari de Pascal",x:"Dans ses « Pensées », publiées en 1670 après sa mort, Blaise Pascal propose un raisonnement célèbre sur la croyance en Dieu. On ne peut prouver ni que Dieu existe ni qu'il n'existe pas : il faut pourtant « parier ». Si tu crois et que Dieu existe, tu gagnes un bonheur infini ; s'il n'existe pas, tu perds peu. Si tu ne crois pas, tu risques de tout perdre. Pour Pascal, le pari raisonnable est donc de croire. Au-delà de la religion, c'est l'un des premiers raisonnements de décision dans l'incertitude, qui compare des gains pondérés par des probabilités.",
 s:"Pascal est aussi l'un des pères du calcul des probabilités, grâce à ses lettres avec Fermat sur les jeux de hasard, en 1654.",q:"Sur quelle notion de maths le pari de Pascal repose-t-il ?",o:["L'espérance (le gain moyen attendu)","La dérivée","Le PGCD"],a:0,e:"On compare des gains pondérés par leurs probabilités : c'est l'idée de l'espérance."},
{c:"Finance",t:"Pourquoi les obligations baissent quand les taux montent",x:"Une obligation, c'est un prêt découpé en titres : un État ou une entreprise emprunte et verse chaque année un intérêt fixe, le coupon. Imagine une obligation de 1 000 € qui rapporte 3 % par an. Si les taux du marché montent à 5 %, plus personne ne voudra payer 1 000 € pour toucher 3 % : son prix baisse, jusqu'à ce que son rendement redevienne intéressant. À l'inverse, si les taux baissent, les anciennes obligations, qui rapportent plus, prennent de la valeur. Retiens : le prix des obligations et les taux d'intérêt évoluent en sens inverse. C'est pour ça que les annonces des banques centrales font tant bouger les marchés.",
 s:"Plus une obligation est longue (10 ou 30 ans), plus son prix réagit fortement aux taux : on mesure cette sensibilité avec la « duration ».",q:"Si les taux d'intérêt montent, le prix des obligations déjà émises…",o:["baisse","monte","ne change pas"],a:0,e:"Leur coupon fixe devient moins attractif que les nouveaux taux, donc leur prix baisse."},
{c:"Sciences",t:"La double hélice de l'ADN",x:"En 1953, James Watson et Francis Crick publient la structure de l'ADN : deux brins enroulés en double hélice, reliés par des paires de bases. Il n'existe que quatre bases : A (adénine), T (thymine), C (cytosine) et G (guanine), et elles s'associent toujours de la même façon : A avec T, C avec G. Cette règle explique comment l'ADN se copie : chaque brin sert de modèle pour fabriquer l'autre. La découverte s'appuie sur une image aux rayons X, la « photo 51 », obtenue dans le laboratoire de Rosalind Franklin. Morte en 1958, elle n'a pas partagé le prix Nobel de 1962.",
 s:"Ton ADN compte environ 3 milliards de paires de bases ; déroulé, celui d'une seule de tes cellules mesurerait environ 2 mètres.",q:"Comment les bases de l'ADN s'associent-elles ?",o:["A avec T, et C avec G","A avec C, et T avec G","A avec G, et C avec T"],a:0,e:"Adénine avec thymine, cytosine avec guanine : c'est la complémentarité des bases."},
{c:"Géopolitique",t:"L'OPEP, le club du pétrole",x:"L'Organisation des pays exportateurs de pétrole (OPEP) est fondée en septembre 1960 à Bagdad par l'Iran, l'Irak, le Koweït, l'Arabie saoudite et le Venezuela. Son but : s'entendre sur la production de pétrole pour peser sur les prix, un peu comme un cartel. En 1973, pendant la guerre du Kippour, les pays arabes producteurs réduisent leur production et imposent un embargo à plusieurs pays occidentaux : le prix du baril est multiplié par quatre, c'est le premier choc pétrolier. Depuis 2016, l'OPEP coopère avec d'autres producteurs, dont la Russie, dans un groupe appelé « OPEP+ ». Ses réunions sont scrutées par tous les traders de matières premières.",
 s:"Le siège de l'OPEP n'est pas au Moyen-Orient mais à Vienne, en Autriche.",q:"Dans quelle ville l'OPEP a-t-elle été fondée ?",o:["Bagdad","Riyad","Vienne"],a:0,e:"Fondée à Bagdad en 1960 ; Vienne est son siège depuis 1965."},
{c:"Arts et lettres",t:"Le procès des Fleurs du mal",x:"En 1857, Charles Baudelaire publie « Les Fleurs du mal ». Quelques semaines plus tard, il est poursuivi pour « outrage à la morale publique » : la justice le condamne à une amende et fait retirer six poèmes du recueil. La même année, Flaubert avait lui aussi été jugé pour « Madame Bovary », mais il avait été acquitté. Baudelaire réorganise son livre et en publie une nouvelle édition en 1861. Le recueil est aujourd'hui considéré comme un sommet de la poésie française, qui ouvre la voie à la poésie moderne.",
 s:"La condamnation de Baudelaire n'a été annulée par la Cour de cassation qu'en 1949, près d'un siècle plus tard.",q:"En quelle année la condamnation des Fleurs du mal a-t-elle été annulée ?",o:["1949","1861","1900"],a:0,e:"La Cour de cassation l'a annulée le 31 mai 1949."},
{c:"Maths",t:"La loi des grands nombres",x:"Si tu lances une pièce équilibrée des milliers de fois, la proportion de « pile » se rapproche de 50 % : c'est la loi des grands nombres. Plus généralement, la moyenne d'un grand nombre d'expériences indépendantes se rapproche de l'espérance. C'est pour ça qu'un casino gagne toujours sur le long terme, et qu'une assurance peut prévoir ses dépenses. Mais attention à l'erreur du joueur : la pièce n'a pas de mémoire. Après cinq « pile » de suite, le sixième lancer a toujours une chance sur deux de donner « pile ». Tu retrouves cette loi en Terminale, avec l'inégalité de Bienaymé-Tchebychev.",
 s:"En 1913, au casino de Monte-Carlo, la bille de la roulette est tombée 26 fois de suite sur le noir : des joueurs ont perdu des fortunes en misant sur le rouge.",q:"Après 5 « pile » de suite avec une pièce équilibrée, quelle est la probabilité d'obtenir « pile » au lancer suivant ?",o:["1/2","Moins de 1/2","Plus de 1/2"],a:0,e:"Les lancers sont indépendants : la pièce ne se souvient pas des résultats d'avant."},
{c:"Économie",t:"L'inflation et le rendement réel",x:"L'inflation, c'est la hausse générale et durable des prix : avec la même somme, tu peux acheter moins de choses. En France, l'Insee la mesure chaque mois avec l'indice des prix à la consommation, calculé sur un grand panier de biens et de services. Ce qui compte pour un épargnant, c'est le rendement réel, à peu près égal au taux d'intérêt moins l'inflation. Un placement à 3 % avec 2 % d'inflation ne rapporte en réalité qu'environ 1 % de pouvoir d'achat. La Banque centrale européenne vise une inflation de 2 % par an à moyen terme.",
 s:"En novembre 1923, en Allemagne, un dollar valait environ 4 200 milliards de marks : des familles se chauffaient en brûlant des billets.",q:"Un placement rapporte 4 % alors que l'inflation est de 5 %. Ton gain réel est d'environ :",o:["−1 %","+9 %","+4 %"],a:0,e:"Rendement réel ≈ 4 % − 5 % = −1 % : ton pouvoir d'achat baisse."},
{c:"Histoire",t:"Le krach de 1929",x:"Le jeudi 24 octobre 1929, le « jeudi noir », la Bourse de New York s'effondre après des années de spéculation, souvent faite avec de l'argent emprunté. Les jours suivants, la panique continue. La crise financière devient une crise économique mondiale, la Grande Dépression : des milliers de banques font faillite et, en 1933, environ un quart des actifs américains sont au chômage. Pour en sortir, le président Roosevelt lance le New Deal, et l'économiste Keynes théorise le rôle de l'État pour relancer la demande. Cette crise a beaucoup inspiré les règles financières d'aujourd'hui.",
 s:"L'indice Dow Jones a perdu près de 90 % entre 1929 et 1932, et n'a retrouvé son sommet de 1929 qu'en 1954.",q:"Combien de temps a-t-il fallu au Dow Jones pour retrouver son sommet de 1929 ?",o:["Environ 25 ans","Environ 2 ans","Environ 10 ans"],a:0,e:"Il n'a retrouvé son niveau de septembre 1929 qu'en novembre 1954."},
{c:"Sciences",t:"La relativité dans ton GPS",x:"En 1905, Albert Einstein publie la relativité restreinte : le temps n'est pas le même pour tout le monde, il ralentit quand on va très vite. Dix ans plus tard, la relativité générale ajoute que le temps s'écoule plus vite là où la gravité est plus faible, donc en altitude. Les satellites GPS combinent les deux effets : leurs horloges avancent d'environ 38 microsecondes par jour par rapport aux nôtres. Ça paraît minuscule, mais sans correction, la position donnée par ton téléphone dériverait d'une dizaine de kilomètres par jour. Sans Einstein, pas de GPS fiable !",
 s:"La formule la plus célèbre du monde, E = mc², date aussi de 1905, l'« année miraculeuse » d'Einstein.",q:"Quel objet du quotidien doit tenir compte de la relativité pour fonctionner ?",o:["Le GPS","Le four à micro-ondes","La calculatrice"],a:0,e:"Les horloges des satellites GPS sont corrigées des effets de la relativité."},
{c:"Finance",t:"La diversification selon Markowitz",x:"« Ne mets pas tous tes œufs dans le même panier » : en 1952, l'économiste Harry Markowitz a transformé ce proverbe en théorie mathématique. Il montre qu'en combinant des actifs qui ne bougent pas exactement ensemble, on réduit le risque d'un portefeuille sans forcément réduire son rendement moyen. Tout se joue dans la covariance : Var(X + Y) = Var(X) + Var(Y) + 2 Cov(X, Y). Si deux actions sont peu corrélées, voire varient en sens opposé, leurs variations se compensent en partie. C'est la base de la gestion de portefeuille moderne, et un outil quotidien des quants.",
 s:"Markowitz a reçu le prix Nobel d'économie en 1990 pour ce travail, commencé pendant ses études.",q:"La diversification réduit surtout le risque si les actifs sont…",o:["peu corrélés entre eux","très corrélés entre eux","tous du même secteur"],a:0,e:"Quand les actifs ne varient pas ensemble, leurs hausses et leurs baisses se compensent en partie."},
{c:"Philosophie",t:"Le rasoir d'Ockham",x:"Guillaume d'Ockham, un moine franciscain anglais du XIVe siècle, a laissé son nom à un principe de bon sens : il ne faut pas multiplier les hypothèses sans nécessité. Entre deux explications qui rendent compte des mêmes faits, on préfère la plus simple. Si ta lampe ne s'allume plus, une ampoule grillée est plus probable qu'une panne de toute la ville. En science, ce « rasoir » sert à trier les théories. En statistiques et en finance quantitative, il rappelle qu'un modèle trop compliqué colle parfaitement aux données passées mais prédit mal l'avenir : c'est le surapprentissage.",
 s:"On parle de « rasoir » parce que le principe « rase » les hypothèses inutiles.",q:"Que conseille le rasoir d'Ockham ?",o:["Préférer l'explication la plus simple qui rend compte des faits","Douter de tout, même de sa propre existence","Toujours choisir l'hypothèse la plus détaillée"],a:0,e:"On ne multiplie pas les hypothèses sans nécessité."},
{c:"Géopolitique",t:"Le Conseil de sécurité de l'ONU",x:"L'ONU est créée en 1945, à la fin de la Seconde Guerre mondiale, pour maintenir la paix. Son organe le plus puissant est le Conseil de sécurité : 15 membres, dont 5 permanents (la Chine, les États-Unis, la France, le Royaume-Uni et la Russie), qui sont les grands vainqueurs de 1945. Les 10 autres membres sont élus pour deux ans. Chaque membre permanent a un droit de veto : il peut bloquer à lui seul une résolution. C'est pour ça que le Conseil est souvent paralysé lors des grandes crises, et que des pays comme l'Inde ou le Brésil réclament une réforme.",
 s:"La Charte des Nations unies a été signée à San Francisco le 26 juin 1945.",q:"Combien de membres permanents compte le Conseil de sécurité ?",o:["5","10","15"],a:0,e:"Chine, États-Unis, France, Royaume-Uni et Russie, chacun avec un droit de veto."},
{c:"Langue française",t:"D'où vient « OK » ?",x:"« OK » est sans doute le mot le plus utilisé au monde, et il est né d'une blague de journalistes. En 1839, à Boston, la mode est aux abréviations de mots volontairement mal écrits. Le Boston Morning Post écrit « O.K. » pour « oll korrect », une façon farfelue d'écrire « all correct » (tout est correct). La blague aurait pu disparaître, mais en 1840 le président Martin Van Buren, surnommé « Old Kinderhook » d'après sa ville natale, se présente à sa réélection : ses partisans créent des « OK Clubs », et le mot devient célèbre. Cette origine a été démontrée par le linguiste Allen Walker Read dans les années 1960.",
 s:"Le 23 mars est parfois présenté comme l'anniversaire de « OK » : c'est la date de l'article de 1839.",q:"D'où vient l'expression « OK » ?",o:["D'une blague de journal à Boston, en 1839","D'un mot grec qui veut dire « tout va bien »","D'un code militaire de la Seconde Guerre mondiale"],a:0,e:"« O.K. » abrégeait « oll korrect », une façon volontairement fautive d'écrire « all correct »."},
{c:"Arts et lettres",t:"Le vol de la Joconde",x:"Le 21 août 1911, la Joconde disparaît du Louvre. Le voleur, Vincenzo Peruggia, est un vitrier italien qui avait travaillé au musée : il s'est caché à l'intérieur, a décroché le tableau, l'a sorti de son cadre et est reparti avec, sous sa blouse. Pendant plus de deux ans, l'enquête piétine : le poète Guillaume Apollinaire est même arrêté quelques jours, et Picasso interrogé. En décembre 1913, Peruggia tente de vendre le tableau à un antiquaire de Florence, qui prévient la police. Ce vol, raconté pendant des mois par les journaux du monde entier, a fait de la Joconde le tableau le plus célèbre du monde.",
 s:"Peruggia disait avoir voulu « rendre » la Joconde à l'Italie, le pays de Léonard de Vinci.",q:"Qui a volé la Joconde en 1911 ?",o:["Un vitrier italien qui avait travaillé au Louvre","Le poète Guillaume Apollinaire","Pablo Picasso"],a:0,e:"Vincenzo Peruggia ; Apollinaire et Picasso ont été soupçonnés à tort."},
{c:"Psychologie",t:"L'effet de halo",x:"En 1920, le psychologue américain Edward Thorndike remarque que des officiers qui notent leurs soldats donnent des notes étrangement cohérentes : un soldat jugé beau et bien tenu est aussi jugé plus intelligent et plus loyal. C'est l'effet de halo : une qualité très visible « éclaire » tout le reste et déforme notre jugement. On le retrouve partout : une copie bien présentée paraît meilleure, une marque prestigieuse semble plus fiable, un candidat sûr de lui paraît plus compétent. À un oral d'admission, la première impression compte donc vraiment… et méfie-toi aussi de tes propres premières impressions.",
 s:"L'effet inverse existe : un seul défaut visible peut faire mal juger tout le reste. On parle parfois d'« effet de corne ».",q:"Qui a décrit l'effet de halo ?",o:["Edward Thorndike","Sigmund Freud","Ivan Pavlov"],a:0,e:"Thorndike l'a décrit en 1920, à partir des notes données par des officiers."},
{c:"Économie",t:"Le dilemme du prisonnier",x:"Deux complices sont interrogés séparément. Si aucun ne parle, ils prennent chacun 1 an de prison. Si un seul dénonce l'autre, il est libéré et l'autre prend 10 ans. Si les deux se dénoncent, ils prennent 5 ans chacun. Quoi que fasse l'autre, chacun a intérêt à dénoncer : résultat, les deux parlent et prennent 5 ans, alors qu'en se taisant ils n'auraient eu qu'un an. C'est un équilibre de Nash, du nom du mathématicien John Nash. Ce jeu explique pourquoi la coopération est fragile : entre entreprises qui se font une guerre des prix, ou entre pays de l'OPEP qui produisent plus que prévu.",
 s:"La vie de John Nash, prix Nobel d'économie 1994, a inspiré le film « Un homme d'exception ».",q:"Dans le dilemme du prisonnier, que font les deux joueurs à l'équilibre de Nash ?",o:["Ils se dénoncent tous les deux","Ils se taisent tous les deux","L'un parle, l'autre se tait"],a:0,e:"Dénoncer est la meilleure réponse quoi que fasse l'autre, même si les deux y perdent."},
{c:"Maths",t:"Le nombre e et les intérêts",x:"En 1683, Jacob Bernoulli se pose une question de banquier : avec 100 % d'intérêts par an, combien devient 1 € ? Versés en une fois : 2 €. En deux fois (50 % tous les six mois) : 1,5² = 2,25 €. Tous les mois : (1 + 1/12)¹² ≈ 2,61 €. Et si on verse les intérêts à chaque instant ? (1 + 1/n)ⁿ se rapproche d'un nombre limite : e ≈ 2,718. C'est le même e que dans ton chapitre sur la fonction exponentielle. Les traders quantitatifs l'utilisent tous les jours pour les intérêts « composés en continu ».",
 s:"C'est Euler qui a donné la lettre e à ce nombre, au XVIIIe siècle.",q:"Avec 100 % d'intérêts par an composés en continu, 1 € devient au bout d'un an…",o:["environ 2,72 €","exactement 2 €","une somme infinie"],a:0,e:"La limite de (1 + 1/n)ⁿ est e ≈ 2,718 : ça ne devient pas infini."},
{c:"Histoire",t:"De Maastricht à l'euro",x:"Signé le 7 février 1992, le traité de Maastricht transforme la Communauté européenne en Union européenne et prévoit une monnaie unique. Pour y entrer, les pays doivent respecter des « critères de convergence », par exemple un déficit public inférieur à 3 % du PIB et une dette inférieure à 60 % du PIB. L'euro naît le 1er janvier 1999, d'abord seulement pour les banques et les marchés financiers. Les pièces et les billets arrivent dans les porte-monnaie le 1er janvier 2002. Sa valeur est gérée par la Banque centrale européenne, installée à Francfort.",
 s:"En France, le référendum sur Maastricht a été très serré : le « oui » l'a emporté avec à peine plus de 51 % des voix.",q:"En quelle année les pièces et les billets en euros sont-ils arrivés ?",o:["2002","1999","1992"],a:0,e:"L'euro existe depuis 1999, mais les pièces et les billets n'arrivent que le 1er janvier 2002."}

{c:"Philosophie",t:"« Je pense, donc je suis »",x:"Dans le « Discours de la méthode » (1637), Descartes cherche une vérité absolument certaine. Il doute de tout ce qui peut l'être : ses sens peuvent le tromper, il peut rêver, un « malin génie » pourrait même le tromper sur les mathématiques. Mais pendant qu'il doute, il pense, et pour penser il faut exister. D'où la première certitude : « je pense, donc je suis » (le cogito). C'est un exemple parfait pour les notions de vérité, de raison et de conscience au bac.",s:"En latin, la formule devient « cogito, ergo sum », dans les « Principes de la philosophie » (1644).",q:"Dans quel ouvrage Descartes écrit-il « je pense, donc je suis » ?",o:["Le Discours de la méthode","La République","Le Léviathan"],a:0,e:"Il l'écrit en français dans le « Discours de la méthode », en 1637."},
{c:"SES",t:"La productivité globale des facteurs",x:"La croissance d'une économie vient de l'augmentation des facteurs de production (le travail et le capital) et de leur meilleure utilisation. En 1957, l'économiste Robert Solow montre qu'une grande partie de la croissance américaine ne s'explique pas par la seule hausse du travail et du capital. Ce « résidu de Solow » est appelé productivité globale des facteurs (PGF). Elle reflète surtout le progrès technique, mais aussi l'organisation du travail et la qualification des travailleurs. C'est une notion clé du chapitre sur les sources de la croissance.",s:"Solow a reçu le prix Nobel d'économie en 1987 pour ses travaux sur la croissance.",q:"Comment appelle-t-on la part de la croissance qui ne s'explique pas par la hausse du travail et du capital ?",o:["La productivité globale des facteurs","Le PIB potentiel","La valeur ajoutée"],a:0,e:"C'est le « résidu » mis en évidence par Solow, qu'on appelle productivité globale des facteurs."},
{c:"Histoire-géo",t:"La crise de Cuba (1962)",x:"En octobre 1962, un avion espion américain photographie des rampes de missiles soviétiques en construction à Cuba, à moins de 200 km des côtes de la Floride. Le président Kennedy décide un blocus naval de l'île. Pendant treize jours, le monde craint une guerre nucléaire. Finalement, Khrouchtchev retire les missiles, en échange de la promesse américaine de ne pas envahir Cuba et, en secret, du retrait de missiles américains installés en Turquie. Après la crise, un « téléphone rouge » relie Washington et Moscou : c'est le début de la détente.",s:"Le « téléphone rouge » n'était pas un téléphone : c'était une ligne de téléscripteurs, pour éviter les malentendus.",q:"Quel pays avait installé des missiles à Cuba en 1962 ?",o:["L'URSS","La Chine","Les États-Unis"],a:0,e:"L'URSS de Khrouchtchev, alliée du régime de Fidel Castro."},
{c:"Enseignement scientifique",t:"L'effet de serre",x:"La Terre reçoit l'énergie du Soleil et en renvoie une partie vers l'espace sous forme de rayonnement infrarouge. Certains gaz de l'atmosphère, comme la vapeur d'eau, le dioxyde de carbone (CO₂) et le méthane, absorbent une partie de ce rayonnement et le réémettent, notamment vers le sol : c'est l'effet de serre. Il est naturel et indispensable à la vie. Mais les activités humaines augmentent la concentration de ces gaz, ce qui renforce l'effet de serre et réchauffe le climat.",s:"Sans effet de serre naturel, la température moyenne à la surface de la Terre serait d'environ −18 °C, au lieu d'environ +15 °C.",q:"Sans effet de serre naturel, la température moyenne de la Terre serait d'environ…",o:["−18 °C","+15 °C","+30 °C"],a:0,e:"L'effet de serre naturel « réchauffe » la surface d'environ 33 °C."},
{c:"Maths spé",t:"Espérance et variance de la loi binomiale",x:"Si X suit la loi binomiale de paramètres n et p (n épreuves de Bernoulli indépendantes, avec une probabilité de succès p), alors son espérance vaut E(X) = np et sa variance V(X) = np(1 − p). L'espérance est le nombre moyen de succès sur un grand nombre de répétitions de l'expérience. Exemple : sur 20 tirs avec 30 % de réussite, on marque en moyenne 20 × 0,3 = 6 paniers. L'écart-type, racine de la variance, mesure la dispersion autour de cette moyenne.",s:"Ces formules se démontrent en écrivant X comme une somme de n variables de Bernoulli indépendantes.",q:"Si X suit la loi binomiale B(20 ; 0,3), que vaut E(X) ?",o:["6","0,3","14"],a:0,e:"E(X) = np = 20 × 0,3 = 6."},
{c:"Maths expertes",t:"Le petit théorème de Fermat",x:"Si p est un nombre premier et a un entier qui n'est pas divisible par p, alors a^(p−1) ≡ 1 (mod p). Autrement dit, a^(p−1) − 1 est un multiple de p. Ce théorème permet de calculer très vite des restes de grandes puissances. Exemple : 11 est premier et ne divise pas 2, donc 2^10 ≡ 1 (mod 11). On vérifie : 2^10 = 1 024 = 93 × 11 + 1. Il est aussi à la base de tests de primalité et de la cryptographie.",s:"Fermat l'a énoncé en 1640 dans une lettre, sans donner la démonstration ; Euler l'a démontré un siècle plus tard.",q:"Quel est le reste de la division de 2^10 par 11 ?",o:["1","2","10"],a:0,e:"11 est premier et ne divise pas 2, donc 2^10 ≡ 1 (mod 11)."},
{c:"Anglais",t:"The American Dream",x:"The expression « American Dream » was popularised in 1931 by the historian James Truslow Adams in his book « The Epic of America ». It describes the idea that in the United States, anyone can succeed through hard work, whatever their origins. It is linked to the Declaration of Independence, which mentions « Life, Liberty and the pursuit of Happiness ». Many novels and films question this dream, like « The Great Gatsby » by F. Scott Fitzgerald. It fits the axes « Identités et échanges » and « Fictions et réalités ».",s:"« The Great Gatsby » was published in 1925, a few years before the expression became popular.",q:"Who popularised the expression « American Dream » in 1931?",o:["James Truslow Adams","F. Scott Fitzgerald","Abraham Lincoln"],a:0,e:"James Truslow Adams, in « The Epic of America » (1931)."},
{c:"Espagnol",t:"La Movida madrileña",x:"Après la mort de Franco en 1975 et le retour de la démocratie, Madrid connaît au début des années 1980 une explosion de créativité : la Movida. Musique, cinéma, photographie, mode : une jeunesse libérée de la censure invente une culture provocante et joyeuse. Le cinéaste Pedro Almodóvar en est la figure la plus connue. La Movida symbolise la transition démocratique espagnole et colle aux axes « Art et pouvoir » et « Territoire et mémoire ».",s:"Le maire de Madrid de l'époque, Enrique Tierno Galván, a soutenu ce mouvement culturel.",q:"Quel cinéaste est la grande figure de la Movida ?",o:["Pedro Almodóvar","Luis Buñuel","Guillermo del Toro"],a:0,e:"Pedro Almodóvar a commencé sa carrière en plein cœur de la Movida."},
{c:"Philosophie",t:"Hobbes et l'état de nature",x:"Dans le « Léviathan » (1651), Thomas Hobbes imagine les hommes avant toute société : c'est l'état de nature. Comme chacun veut se protéger et rien ne limite personne, c'est « la guerre de chacun contre chacun », et la vie y est misérable et brève. Pour en sortir, les hommes passent un contrat : ils confient leur pouvoir à un souverain qui garantit la paix. L'État naît ainsi de la peur et du besoin de sécurité. Utile pour les notions d'État, de liberté et de justice.",s:"Le Léviathan est un monstre biblique : Hobbes l'utilise comme image de la puissance de l'État.",q:"Dans quel ouvrage Hobbes décrit-il l'état de nature comme une « guerre de chacun contre chacun » ?",o:["Le Léviathan","Du contrat social","L'Éthique"],a:0,e:"Dans le « Léviathan » (1651) ; « Du contrat social » est de Rousseau."},
{c:"SES",t:"Table de destinée et table de recrutement",x:"Pour mesurer la mobilité sociale, on compare la position sociale des individus à celle de leurs parents. La table de destinée se lit à partir de l'origine : que deviennent les enfants d'ouvriers, de cadres… ? La table de recrutement se lit à partir de la position actuelle : d'où viennent les cadres d'aujourd'hui, de quel milieu social ? Les deux utilisent les mêmes données de l'Insee, mais répondent à des questions différentes. C'est un piège classique en épreuve de SES.",s:"En France, l'Insee réalise ces enquêtes (« Formation et qualification professionnelle ») depuis les années 1960.",q:"Pour savoir ce que deviennent les enfants d'ouvriers, quelle table utilise-t-on ?",o:["La table de destinée","La table de recrutement","La table de mortalité"],a:0,e:"La destinée part de l'origine sociale et regarde la position atteinte."},
{c:"Histoire-géo",t:"Les zones économiques exclusives",x:"La convention des Nations unies sur le droit de la mer, signée à Montego Bay en 1982, découpe les océans. Chaque État côtier dispose d'une zone économique exclusive (ZEE) jusqu'à 200 milles marins (environ 370 km) de ses côtes : il y contrôle la pêche, le pétrole, le gaz et les autres ressources. Au-delà, c'est la haute mer, ouverte à tous. Grâce à ses territoires d'outre-mer, la France possède l'une des plus grandes ZEE du monde, juste derrière les États-Unis.",s:"Plus de 95 % de la ZEE française se trouve autour des territoires d'outre-mer.",q:"Jusqu'à quelle distance des côtes s'étend une ZEE ?",o:["200 milles marins","12 milles marins","1 000 km"],a:0,e:"200 milles marins ; les 12 milles correspondent aux eaux territoriales."},
{c:"Enseignement scientifique",t:"Le modèle de Hardy-Weinberg",x:"Pour un gène qui a deux versions (allèles) A et a, de fréquences p et q avec p + q = 1, le modèle de Hardy-Weinberg prédit les fréquences des génotypes : p² pour AA, 2pq pour Aa et q² pour aa. Ces fréquences restent stables de génération en génération si la population est très grande, sans sélection, sans mutation, sans migration et avec des unions au hasard. Quand on observe un écart, c'est qu'une force évolutive est à l'œuvre : c'est tout l'intérêt du modèle.",s:"C'est la même identité que (p + q)² = p² + 2pq + q² : de la génétique avec une identité remarquable !",q:"Selon le modèle de Hardy-Weinberg, quelle est la fréquence des hétérozygotes Aa ?",o:["2pq","p²","q²"],a:0,e:"Les hétérozygotes ont la fréquence 2pq."}
];

const MX_KTX="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/";

async function mxIndex(){if(MXI||mxLoad.idx||mxFail.idx)return;mxLoad.idx=1;

/* format des fichiers : @chapitre id | titre | thème, @resume, blocs « == DEF | titre », exercices « == EXO 2 type | titre » avec -- indice / -- reponse / -- solution */
function mxParse(txt){const out=[];let ch=null,bl=null,sub=null;
  String(txt).replace(/\r/g,"").split("\n").forEach(line=>{let m;
    if((m=line.match(/^@chapitre\s+(\S+)\s*\|\s*([^|]+?)\s*(?:\|\s*(.+?))?\s*$/))){ch={id:m[1],t:m[2],th:m[3]||"",res:"",b:[],ex:[]};out.push(ch);bl=null;return}
    if(!ch)return;
    if((m=line.match(/^@resume\s+(.*)$/))){ch.res=m[1].trim();return}
    if((m=line.match(/^==\s*EXO\s+([1-3])\s*([\wéè-]*)\s*\|\s*(.*)$/))){bl={ex:1,lv:+m[1],ty:m[2]||"",t:m[3].trim(),q:"",h:"",r:"",s:""};ch.ex.push(bl);sub="q";return}
    if((m=line.match(/^==\s*([A-ZÉ]+)\s*(?:\|\s*(.*))?$/))){bl={k:m[1],t:(m[2]||"").trim(),x:""};ch.b.push(bl);sub="x";return}
    if(bl&&bl.ex&&(m=line.match(/^--\s*(indice|reponse|réponse|solution)\s*$/i))){sub={indice:"h",reponse:"r","réponse":"r",solution:"s"}[m[1].toLowerCase()];return}
    if(bl)bl[sub]+=(bl[sub]?"\n":"")+line});
  out.forEach(c=>{c.b.forEach(b=>b.x=b.x.trim());c.ex.forEach((e,i)=>{e.n=i+1;["q","h","r","s"].forEach(k=>e[k]=e[k].trim())})});return out}
/* texte → HTML : paragraphes, listes « - » et « 1. », **gras**, code entre ```, formules $…$ et $$…$$ */
function mxFmt(t){let h="",list=null,para=[],code=null;
  const flush=()=>{if(para.length){h+=`<p>${para.join("<br>")}</p>`;para=[]}},closeL=()=>{if(list){h+=`</${list}>`;list=null}},inl=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  String(t||"").split("\n").forEach(l=>{let m;
    if(/^\s*```/.test(l)){if(code!=null){h+=`<pre class="mxcode">${esc(code.join("\n"))}</pre>`;code=null}else{flush();closeL();code=[]}return}
    if(code!=null){code.push(l);return}
    if(!l.trim()){flush();closeL();return}
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){flush();if(list!=="ul"){closeL();h+="<ul>";list="ul"}h+=`<li>${inl(m[1])}</li>`;return}
    if((m=l.match(/^\s*(\d+)[.)]\s+(.*)$/))){flush();if(list!=="ol"){closeL();h+=`<ol start="${m[1]}">`;list="ol"}h+=`<li>${inl(m[2])}</li>`;return}
    closeL();para.push(inl(l))});
  if(code!=null)h+=`<pre class="mxcode">${esc(code.join("\n"))}</pre>`;flush();closeL();return h}

/* ================================================================
   MA JOURNÉE 2 : l'emploi du temps se manipule à la main
   - fais glisser un bloc pour changer l'heure (par pas de 5 min), tire le haut ou le bas pour changer la durée ;

function jIsDone(dk,key){const a=key.indexOf("|"),kind=key.slice(0,a),ref=key.slice(a+1),j=S.jours[dk]||{},dn=j.done||{};
  if(kind==="hab")return!!dn[ref];if(kind==="x")return!!(j.extra||[]).find(x=>x.id===ref&&x.ok);
  if(kind==="pn"){const x=(((S.pronote||{}).data||{}).devoirs||[]).find(y=>y.id===ref);return!!(dn["pn:"+ref]||(x&&x.fait))}return false}

  if(kind==="hab")return habL(ref);if(kind==="x"){const x=(j.extra||[]).find(y=>y.id===ref);return x?x.t:"Tâche"}
  if(kind==="pn"){const x=(((S.pronote||{}).data||{}).devoirs||[]).find(y=>y.id===ref);return x?`${x.m||"Devoir"} : ${String(x.txt||"").split("\n")[0].slice(0,60)}`:"Devoir"}return key}

/* le planificateur : mêmes règles qu'avant, mais les blocs épinglés restent à leur place */
function planDay(d){
  const dk=dkey(d),P=jParams(dk),isT=dk===dkey(today()),nowM=new Date().getHours()*60+new Date().getMinutes(),pins=jPins(d),jd=S.jours[dk]||{};
  const L=jLessons(dk),school=L.length>0,steps=[],pinSteps=[];let t;
  if(school){
    const a=Math.min(...L.map(c=>wallMin(c.d))),b=Math.max(...L.map(c=>wallMin(c.f))),tr=V.jTrajet||P.trajet,arr=b+tr,lunch=arr<14*60,rest=lunch?Math.max(P.pause,45):P.pause;
    const hide=jd.hide||{},base=[{a,b,k:"cours",ref:"cours",step:1,l:"Cours au lycée"},{a:b,b:arr,k:"trajet",ref:"trajet",step:1,l:"Retour à la maison"},{a:arr,b:arr+rest,k:"pause",ref:"retour",step:1,l:lunch?"Déjeuner et te poser":"Te poser (vraie pause, sans écrans si possible)"}];
    base.forEach(s=>{const key="step|"+s.ref;if(hide[key])return;const p=pins[key];if(p&&p.b>p.a){s.a=p.a;s.b=p.b;s.pin=1;s.w=p.w;pinSteps.push(s)}else steps.push(s)});
    t=steps.length?Math.max(...steps.map(s=>s.b)):b;
  }else t=hm(P.debutWE);
  const od=jd.par||{},stop=school||od.stop?hm(P.stop):Math.min(hm(P.stop),hm(P.libreWE)||hm(P.stop));
  let fixed=[{a:hm(P.diner),b:hm(P.diner)+P.dinerDur,k:"repas",ref:"diner",l:"Dîner"}];
  if(!school)fixed.push({a:hm(P.dejWE),b:hm(P.dejWE)+60,k:"repas",ref:"dej",l:"Déjeuner"});
  fixed=fixed.filter(f=>!(jd.hide||{})["repas|"+f.ref]);pinSteps.forEach(s=>fixed.push(s));
  fixed.forEach(f=>{const p=pins["repas|"+f.ref];if(p&&p.b>p.a){f.a=p.a;f.b=p.b;f.pin=1;f.w=p.w}});
  (jd.blocs||[]).forEach(x=>{if(x&&x.b>x.a)fixed.push({a:x.a,b:x.b,k:"bloc",ref:x.id,l:x.l||"Pause",pin:1})});
  let live=false;if(isT&&nowM>t){t=Math.ceil(nowM/5)*5;live=true}
  const q=jTasks(d),plan=[];let since=0;
  /* tâche commencée avec ▶ : elle garde son vrai début ; si elle dépasse, le reste se décale */
  const run=isT?jd.run:null,ri=run?q.findIndex(x=>jKey(x)===run.key):-1;
  if(ri>=0){const x=q.splice(ri,1)[0],a=tsMin(run.start),end=a+x.min+(run.ext||0),over=nowM>end;
    plan.push({...x,a,b:over?Math.ceil((nowM+1)/5)*5:end,run:true,over,overBy:Math.round(nowM-end),el:Math.round(nowM-a),dk});t=Math.max(t,plan[0].b);live=true;since=Math.max(0,nowM-a);}
  /* les tâches épinglées deviennent des blocs fixes */
  for(let i=q.length-1;i>=0;i--){const x=q[i],p=pins[jKey(x)];if(p&&p.b>p.a&&!p.done){q.splice(i,1);fixed.push({...x,a:p.a,b:p.b,pin:1,w:p.w,dk:x.dk})}}
  fixed.sort((x,y)=>x.a-y.a);
  for(let guard=0;guard<120&&q.length;guard++){
    const fb=fixed.find(f=>!f.used&&f.b>t);
    if(fb&&t>=fb.a){fb.used=1;plan.push(fb.pin?{...fb}:{...fb,a:Math.max(fb.a,t)});t=Math.max(t,fb.b);since=0;continue}
    if(t>=stop)break;
    const lim=Math.min(fb?fb.a:stop,stop);
    if(!jd.nap&&since>=50&&lim-t>=25){plan.push({a:t,b:t+10,k:"pause",auto:1,l:"Pause : bouge, bois de l'eau"});t+=10;since=0;continue}
    const i=q.findIndex(x=>x.min<=lim-t);
    if(i<0){if(fb&&fb.a<stop&&fb.a>t){if(fb.a-t>=5&&!jd.nofree)plan.push({a:t,b:fb.a,k:"libre",auto:1,l:"Temps libre"});t=fb.a;continue}break}
    const x=q.splice(i,1)[0];plan.push({...x,a:t,b:t+x.min});t+=x.min;since=x.ref==="sport"?0:since+x.min;
  }
  /* blocs fixes pas encore placés (épinglés, ou repas dans la soirée) */
  fixed.filter(f=>!f.used&&(f.pin||(f.k==="repas"&&f.a<stop+60&&(f.a>=t||!live||f.b>nowM)))).forEach(f=>{f.used=1;plan.push({...f})});
  /* tâches déjà faites et épinglées : elles restent visibles à leur place */
  Object.entries(pins).forEach(([k,p])=>{if(p.done&&p.b>p.a&&jIsDone(dk,k)&&!plan.some(s=>jKey(s)===k)){const a=k.indexOf("|");plan.push({k:k.slice(0,a),ref:k.slice(a+1),l:jLabelK(dk,k),a:p.a,b:p.b,pin:1,w:p.w,done:true,min:p.b-p.a})}});
  plan.sort((x,y)=>x.a-y.a);
  const fin=plan.filter(jWork).reduce((m,s)=>Math.max(m,s.b),0)||t;
  return{dk,school,live,steps:live?[]:steps,steps0:steps,plan,reste:q,fin,stop,first:school?steps[0]:null};
}

/* ---- écrire dans la journée ---- */

/* placer une matière de la palette à l'heure a */

/* enlever un bloc de la journée (il retourne dans la palette) */

/* « chaque lundi à cette heure » : épingle dans l'emploi du temps de la semaine */

/* ▶ commencer : la tâche quitte sa place épinglée et démarre maintenant ; ✓ fini : elle reste visible où elle a été faite */

/* ---- affichage ---- */
function jCol(s){if(s.k==="cours"||s.k==="trajet")return"#8a94a6";if(s.k==="repas")return"#d39b00";if(s.k==="pause"||s.k==="libre"||s.k==="bloc")return"#4fa38a";if(s.k==="pn")return"var(--pron)";if(s.k==="x")return"var(--jour)";
  const r=String(s.ref||"");return/^m/.test(r)?"var(--mx)":/^f/.test(r)?"#e07b39":r==="esp"||r==="ang"?"#0ea5b7":r==="piano"?"#7a5cff":r==="sport"?"#f2407d":"var(--jour)"}
function jLanes(items){const out=new Map(),s=[...items].sort((x,y)=>x.a-y.a||y.b-x.b);let cl=[],cols=[],end=-1;
  const flush=()=>{cl.forEach(it=>out.get(it).n=cols.length);cl=[];cols=[];end=-1};
  s.forEach(it=>{if(cl.length&&it.a>=end)flush();let c=cols.findIndex(e=>e<=it.a);if(c<0){c=cols.length;cols.push(it.b)}else cols[c]=it.b;out.set(it,{c,n:1});cl.push(it);end=Math.max(end,it.b)});if(cl.length)flush();return out}
function jPalette(d,pl){const dk=dkey(d),inPlan=new Set(planOf(d)),items=[];
  pl.reste.forEach(x=>items.push({t:"task",key:jKey(x),min:x.min,l:x.l,k:x.k,ref:x.ref,g:"À caser"}));
  Object.keys(HABITS).filter(h=>!inPlan.has(h)&&!doneOf(d)[h]).forEach(h=>items.push({t:"hab",id:h,l:habL(h),k:"hab",ref:h,min:h==="sport"?jParams(dk).sportDur+jParams(dk).sportTrajet:jDur(h,jBase(h)),g:"Ajouter"}));
  items.push({t:"pause",l:"Pause",k:"bloc",ref:"",min:15,g:"Ajouter"});
  let g="";return items.map((it,i)=>{const h=it.g!==g?`<p class="jpg">${it.g==="À caser"?"Ne rentre pas : glisse-les":"Ajouter"}</p>`:"";g=it.g;
    return h+`<div class="jpi" data-jpal="${i}" style="--b:${jCol(it)}" title="${esc(it.l)}"><span>${jIcon(it.k,it.ref,it.l)}</span><b>${esc(it.l)}</b><small>${fdur(it.min)}</small></div>`}).join("")+`<p class="jpg jdrop">⬅ Glisse un bloc ici pour l'enlever de la journée</p>`}
function jTimeline(d,pl,isT){

  /* les jours de cours, l'emploi du temps commence une heure avant la sortie du lycée : on voit la fin des cours (et on peut la modifier) */
  const own=items.filter(s=>s.k!=="cours"&&s.k!=="trajet").map(s=>s.a),lo0=Math.min(...own,isT?nowM:24*60,pl.school?(pl.steps0.find(x=>x.k==="cours")||pl.plan.find(x=>x.k==="cours")||{b:16*60}).b-60:hm(jParams(dk).debutWE)),hi0=Math.max(...items.map(s=>s.b),pl.stop,isT?nowM+60:0);

  const blocks=items.map(s=>{const ln=lanes.get(s),key=jKeyOf(s),mv=jMovable(s),sel=V.jsel===key&&V.jselDk===dk,h=(s.b-Math.max(s.a,st))*JPX,hd=mv&&!s.done&&(h>=34||sel);

  return`<div class="jcal"><div class="jhrs" style="height:${(en-st)*JPX}px">${hrs.join("")}</div>

    <aside class="jpal" id="jpal" aria-label="Matières à placer">${pal}</aside></div>`}
function jSheet(d,pl){if(!V.jsel||V.jselDk!==dkey(d))return"";const dk=dkey(d),key=V.jsel,s=jFind(dk,key);if(!s){V.jsel=null;return""}
  const w=jWork(s),wd=JOURS[d.getDay()].toLowerCase(),isT=dk===dkey(today()),wk=!!(((edtP().pinw||{})[d.getDay()]||{})[key]);

      ${!s.done&&(w||s.k==="repas"||s.step)?`<button class="ghost ${wk?"on":""}" data-jweek="1">📌 ${wk?"Plus chaque "+wd:"Chaque "+wd+" à cette heure"}</button>`:""}

  if(d.kind==="new"){const g=d.el.cloneNode(true);g.classList.add("jghost");g.removeAttribute("data-jpal");document.body.appendChild(g);d.ghost=g}else d.el.classList.add("drag")}
function jdMove(e){const d=JD,x=e.clientX,y=e.clientY;

function jdEnd(e){const d=JD;JD=null;clearTimeout(d.timer);jTipOff();document.body.classList.remove("jdragging");if(d.ghost)d.ghost.remove();
  if(!d.active){if(d.moved)return;if(d.kind!=="new"){V.jsel=d.key;V.jselDk=V.jdk;return render(true)}

/* ================================================================
   WEEK-END : samedi et dimanche forment un seul bloc dans le suivi d'habitudes.
   Une tâche du week-end compte une seule fois, qu'elle soit faite le samedi ou le dimanche :
   si tu la fais samedi, elle ne revient pas dimanche (ni dans la liste, ni dans Ma journée).
   ================================================================ */
const isWE=d=>d.getDay()===6||d.getDay()===0;
function weBlock(d){const s=d.getDay()===6?d:add(d,-1);return[s,add(s,1)]}
const weHasToday=d=>isWE(d)&&weBlock(d).some(x=>+x===+today());
/* ce qui est coché ce jour-là (pour le week-end : samedi + dimanche) */
function doneOf(d){if(!isWE(d))return(S.jours[dkey(d)]||{}).done||{};const[a,b]=weBlock(d);return{...((S.jours[dkey(a)]||{}).done||{}),...((S.jours[dkey(b)]||{}).done||{})}}
/* les tâches d'un jour, ou du bloc week-end (sans doublon) */
function unitItems(d){const days=isWE(d)?weBlock(d):[d],dn=doneOf(d),hab=[],pn=[],xs=[];
  days.forEach(x=>{planOf(x).forEach(h=>{if(!hab.includes(h))hab.push(h)});pnTasks(x).forEach(y=>{if(!pn.some(z=>z.id===y.id))pn.push({...y,_dk:dkey(x)})});((S.jours[dkey(x)]||{}).extra||[]).forEach(e=>xs.push({...e,_dk:dkey(x)}))});
  return{days,dn,hab,pn,xs}}
function dayStats(d){const u=unitItems(d),k=u.dn;return{n:u.hab.filter(h=>k[h]).length+u.pn.filter(x=>x.fait||k["pn:"+x.id]).length+u.xs.filter(x=>x.ok).length,t:u.hab.length+u.pn.length+u.xs.length}}
/* objectif Top 3 : le bloc week-end compte une fois (le samedi tant que dimanche n'est pas arrivé, sinon le dimanche) */
function dayW(d){if(d.getDay()===6&&+today()>+d)return{n:0,t:0};
  const u=unitItems(d),k=u.dn;let n=0,t=0;u.hab.forEach(h=>{const w=tW(h);t+=w;if(k[h])n+=w});u.pn.forEach(x=>{const w=tW("devoir");t+=w;if(x.fait||k["pn:"+x.id])n+=w});u.xs.forEach(x=>{t+=1;if(x.ok)n+=1});return{n,t}}
/* série de jours parfaits : le week-end compte pour un */
function streak(){const prev=x=>x.getDay()===0?add(x,-2):add(x,-1);let d=today(),s=0;const t=dayStats(d);if(t.n<t.t)d=prev(d);
  for(let i=0;i<400;i++){const x=dayStats(d);if(x.t&&x.n===x.t){s++;d=prev(d)}else break}return s}
function weekSeries(nw){const o=[],m0=monday(today());for(let w=nw-1;w>=0;w--){const m=add(m0,-7*w);let n=0,t=0;
  for(let i=0;i<6;i++){const d=add(m,i);if(d>today())break;const s=dayStats(d);n+=s.n;t+=s.t}o.push({m,p:t?n/t:0})}return o}
/* navigation : lundi ← week-end ← vendredi */
const habPrev=d=>isWE(d)?add(weBlock(d)[0],-1):add(d,-1);
const habNext=d=>isWE(d)?add(weBlock(d)[1],1):add(d,1);
const habCanGo=d=>d<=today()||weHasToday(d);
/* cocher : dans le week-end, la case vaut pour samedi et dimanche */
function habToggle(d,h,on){const ks=isWE(d)?weBlock(d).map(dkey):[dkey(d)],tk=dkey(today());
  if(on){const k=ks.includes(tk)?tk:ks[0],j=S.jours[k]||{};return put("jours",k,{...j,date:k,done:{...(j.done||{}),[h]:true}})}
  ks.forEach(k=>{const j=S.jours[k];if(j&&j.done&&j.done[h]){const dn={...j.done};delete dn[h];put("jours",k,{...j,done:dn})}})}
function pageHab(){
  const d=V.day,we=isWE(d),u=unitItems(d),k=u.dn,{n,t}=dayStats(d),isT=we?weHasToday(d):+d===+today(),m=monday(today());
  const [sa,su]=weBlock(d),addK=we?(weHasToday(d)?dkey(today()):dkey(sa)):dkey(d);
  const week=[0,1,2,3,4,5].map(i=>{const x=add(m,i),s=dayStats(x),wb=i===5,f=wb?!(x<=today()||weHasToday(x)):x>today(),on=wb?isWE(d)&&+weBlock(d)[0]===+x:+x===+d;
    return`<button class="wd ${on?"on":""} ${wb?"wdwe":""}" data-go="${dkey(x)}" ${f?'disabled style="opacity:.4"':""}><b>${wb?"WE":JOURS[x.getDay()].slice(0,1)}</b><span class="vb"><i style="height:${s.t?s.n/s.t*100:0}%"></i></span><span class="num">${s.n}/${s.t}</span></button>`}).join("");
  const title=we?(isT?"Ce week-end":"Week-end"):isT?"Aujourd'hui":JOURS[d.getDay()];
  const sub=we?`sam. ${sa.getDate()}${sa.getMonth()!==su.getMonth()?" "+MOIS[sa.getMonth()]:""} et dim. ${su.getDate()} ${MOIS[su.getMonth()]}`:`${JOURS[d.getDay()].toLowerCase()} ${d.getDate()} ${MOIS[d.getMonth()]}`;
  return`
  <div class="card stack">
    <div class="daybar"><button data-a="prev" aria-label="Précédent">‹</button>
      <div class="dayname"><b>${title}</b><small>${sub}</small></div>
      <button data-a="next" aria-label="Suivant" ${habCanGo(habNext(d))?"":"disabled"}>›</button></div>
    <div class="row" style="gap:14px">${ring(t?n/t:0,"--hab")}<div><b style="font-family:var(--display);font-size:1.4rem" class="num">${n} / ${t}</b><div class="muted">${n===t?(we?"Week-end bouclé":"Journée bouclée"):(t-n)+" à faire"}</div></div></div>
    ${we?`<p class="small muted" style="margin:0">Une tâche du week-end compte une fois : fais-la samedi ou dimanche, comme tu veux.</p>`:""}
    <ul class="list">${u.hab.map(h=>`<li><label class="chk"><input type="checkbox" id="hab-${h}" data-hab="${h}" ${k[h]?"checked":""}><span class="box">${tick}</span><span class="t">${esc(habN(h))}</span><span class="tag">${(HABITS[h]||[])[1]||""}</span></label></li>`).join("")}${u.pn.map(x=>`<li><label class="chk"><input type="checkbox" id="hab-pn-${sid(x.id)}" data-pnd="${esc(x.id)}|${x._dk}" ${x.fait||k["pn:"+x.id]?"checked":""}><span class="box">${tick}</span><span class="t">${esc(x.m||"Devoir")}<small class="pnhw">${esc(String(x.txt||"").slice(0,140))}</small></span><span class="tag">Devoir</span></label></li>`).join("")}${u.xs.map(x=>`<li><label class="chk"><input type="checkbox" id="hab-x-${x.id}" data-jt="x|${x.id}|${x._dk}" ${x.ok?"checked":""}><span class="box">${tick}</span><span class="t">${esc(x.t)}</span><span class="tag">${x.min} min</span></label></li>`).join("")}</ul>
    <form class="row" data-f="jadd" data-dk="${addK}" style="flex-direction:row;flex-wrap:nowrap"><input class="field" id="hab-add" name="t" placeholder="+ Ajouter une tâche pour ${we?"ce week-end":"ce jour"}" autocomplete="off" required><input type="hidden" name="min" value="30"><button class="ghost on" aria-label="Ajouter">Ajouter</button></form>
  </div>
  <div><p class="label">Cette semaine</p><div class="week" style="grid-template-columns:repeat(6,minmax(0,1fr))">${week}</div></div>
  <div class="stats"><div class="stat"><b>${streak()}</b><span>jours parfaits d'affilée (le week-end compte pour un)</span></div>
    <div class="stat"><b>${Math.round(weekSeries(1)[0].p*100)}%</b><span>cette semaine</span></div>
    <div class="stat"><b>${Math.round(weekSeries(4).reduce((a,s)=>a+s.p,0)/4*100)}%</b><span>sur 4 semaines</span></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="label" style="margin:0">Progression</p>
    <div class="seg">${[[4,"1 mois"],[12,"3 mois"],[26,"6 mois"]].map(([v,l])=>`<button data-range="${v}" aria-pressed="${v===V.range}">${l}</button>`).join("")}</div></div>
    <div class="chart">${lineChart(weekSeries(V.range))}</div></div>`;
}

/* ================================================================
   🪶 NOTES : la mise en forme toujours à portée de doigt, comme dans Notes d'Apple
   - sélectionne un mot : une petite barre apparaît juste en dessous (gras, italique, souligné, barré, couleurs) ;
   - pendant que tu écris : une barre reste collée au-dessus du clavier (Aa, cases à cocher, gras, couleurs…).
   Plus besoin de remonter en haut de la note.
   ================================================================ */
const NCOL=[["#af52de","Violet"],["#ff2d55","Rose"],["#ff9500","Orange"],["#34c759","Vert"],["#007aff","Bleu"]];
const NHL="#ffd60a",NSENT="rgb(1, 2, 3)";
/* garder seulement la mise en forme utile, couleurs comprises */
const NOKC=/^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\))$/i;
function cleanHtml(h){
  const t=document.createElement("template");t.innerHTML=String(h||"");
  const walk=el=>[...el.childNodes].forEach(c0=>{let c=c0;
    if(c.nodeType===3)return;
    if(c.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|IMG|VIDEO|AUDIO|LINK|META)$/i.test(c.tagName)){c.remove();return}
    walk(c);
    if(c.tagName==="FONT"){const col=c.getAttribute("color"),sp=document.createElement("span");if(col&&NOKC.test(col))sp.style.color=col;sp.append(...c.childNodes);c.replaceWith(sp);c=sp}
    if(c.tagName==="SPAN"||c.tagName==="MARK"){const col=c.style.color,bg=c.style.backgroundColor;[...c.attributes].forEach(a=>c.removeAttribute(a.name));
      const kc=col&&NOKC.test(col)&&col!==NSENT,kb=bg&&NOKC.test(bg)&&bg!==NSENT&&!/^rgba\(0, 0, 0, 0\)$/.test(bg);
      if(!kc&&!kb){c.replaceWith(...c.childNodes);return}const sp=c.tagName==="SPAN"?c:document.createElement("span");if(kc)sp.style.color=col;if(kb)sp.style.backgroundColor=bg;if(sp!==c){sp.append(...c.childNodes);c.replaceWith(sp)}return}
    if(!NTAGS[c.tagName]){c.replaceWith(...c.childNodes);return}

  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);

 {t:"Le verbe « to be » (être)",x:"« To be » veut dire « être ». Au présent : I am (je suis), you are (tu es), he / she / it is (il / elle est), we are (nous sommes), they are (ils sont).\nÀ l'oral, on raccourcit : I'm, you're, he's, she's, it's, we're, they're.\nNégation : on ajoute not → I'm not, he isn't, they aren't.\nQuestion : on inverse → Are you ready? Is she French?",

 {t:"Le verbe « to have » (avoir)",x:"« To have » veut dire « avoir » : I have, you have, he / she / it has (attention : has avec he, she, it), we have, they have.\nNégation : I don't have, she doesn't have.\nQuestion : Do you have…? Does he have…?",

 {t:"Le présent simple (les habitudes)",x:"Le présent simple sert pour les habitudes : I work (je travaille).\nAvec he, she, it, on ajoute -s : she works, he plays.\nVerbes en -o, -sh, -ch, -x → -es : he goes, she watches. Consonne + y → -ies : he studies.\nalways (toujours), often (souvent), sometimes (parfois), never (jamais) se placent avant le verbe.",

 {t:"Questions et négations au présent (do / does)",x:"Au présent simple, on utilise un petit verbe d'aide : do (does avec he, she, it).\nNégation : I don't like, she doesn't like (après doesn't, le verbe perd son s).\nQuestion : Do you like…? Does he work…?\nRéponses courtes : Yes, I do. / No, she doesn't.",

 {t:"my, your, his, her… et le 's",x:"my (mon), your (ton), his (son, à lui), her (son, à elle), its (pour une chose), our (notre), their (leur).\nAttention : his et her dépendent du propriétaire : his mother = la mère de lui.\nLe 's montre à qui est quelque chose : Tom's car = la voiture de Tom ; the company's profits = les bénéfices de l'entreprise.",

 {t:"Le passé de « to be » (was / were)",x:"I was, you were, he / she / it was, we were, they were.\nNégation : wasn't, weren't. Question : Were you at home? Was it difficult?\nMots utiles : yesterday (hier), last week (la semaine dernière), ago (il y a : two days ago).",

 {t:"Le passé des verbes (-ed et irréguliers)",x:"Pour une action terminée : verbe + -ed : work → worked, play → played, study → studied.\nBeaucoup de verbes sont irréguliers, à apprendre : go → went, have → had, do → did, make → made, buy → bought, sell → sold, see → saw, take → took.\nNégation et question avec did : I didn't go, Did you see… ? (après did, le verbe reste à la base).",

 {t:"Le futur (will / going to)",x:"will + verbe : une décision rapide ou une prédiction : I will help you, prices will rise. Forme courte : I'll ; won't = will not.\ngoing to + verbe : un projet déjà prévu : I'm going to study finance.\nQuestion : Will you come? Are you going to work tonight?",

 {t:"Comparer (cheaper than, the best)",x:"Mots courts : adjectif + -er + than : cheaper than (moins cher que), bigger than.\nLe plus : the + adjectif + -est : the cheapest.\nMots longs : more + adjectif : more expensive than, the most expensive.\nIrréguliers : good → better → the best ; bad → worse → the worst.",
  ex:[["Apple is bigger than Tesla.","Apple est plus grosse que Tesla."],["Gold is more expensive than silver.","L'or est plus cher que l'argent."],["This is the best idea.","C'est la meilleure idée."],["Today is worse than yesterday.","Aujourd'hui est pire qu'hier."]],

 {t:"can, must, should",x:"can = pouvoir, savoir : I can swim. can't = ne pas pouvoir.\nmust = devoir (obligation forte) : You must stop.\nshould = devrais (un conseil) : You should study more.\nAprès can, must, should : verbe sans to et sans s : she can play.",
