<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2ème cerveau</title>
<meta name="description" content="Habitudes, Pronote, notes, finance, lectures et cours : ton deuxième cerveau.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a5cff">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2e cerveau">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one calm column; home = grid of six coloured tiles with small drawings, each opens its own space with its own colour */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --soft:#eef1f5; --line:#e2e7ee; --ink:#1a2230; --muted:#6a7486;
  --hab:#ff6a55; --proj:#7a5cff; --fin:#14a27a; --lect:#f0a30a; --cours:#2d7ff0; --sport:#f2407d;
  --up:#14a27a; --down:#d9443a;
  --display:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tint:12%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b24; --soft:#1c2330; --line:#262e3c; --ink:#edf0f5; --muted:#8f99ab;
  --hab:#ff7c69; --proj:#9479ff; --fin:#2cc394; --lect:#f7b52e; --cours:#4f97ff; --sport:#ff5a91; --up:#2cc394; --down:#ff6b61; --tint:18%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b24; --soft:#1c2330; --line:#262e3c; --ink:#edf0f5; --muted:#8f99ab;
  --hab:#ff7c69; --proj:#9479ff; --fin:#2cc394; --lect:#f7b52e; --cours:#4f97ff; --sport:#ff5a91; --up:#2cc394; --down:#ff6b61; --tint:18%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c,var(--cours));outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:.85rem}

/* home */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.top h1{font-size:2rem;font-weight:700;line-height:1.1}
.top p{margin-top:4px;color:var(--muted)}
.sync{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{--c:var(--cours);position:relative;text-align:left;border:0;border-radius:22px;padding:16px;min-height:168px;
  background:color-mix(in srgb,var(--c) var(--tint),var(--surface));display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile h2{font-size:1.05rem;font-weight:600;padding-right:56px}
.tile .big{font-family:var(--display);font-size:1.45rem;font-weight:700;color:var(--c);line-height:1.1;margin-top:auto;overflow-wrap:anywhere}
.tile small{color:var(--muted);font-size:.82rem;line-height:1.3}
.tile svg.ill{position:absolute;right:-6px;top:-6px;width:84px;height:84px}

/* section */
.sec{--c:var(--cours);display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;gap:12px}
.back{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;flex:none}
.head h1{font-size:1.6rem;color:var(--c);flex:1;min-width:0}
.head svg{width:56px;height:56px;flex:none}
.crumb{border:0;background:none;color:var(--c);font-weight:700;padding:0;text-align:left}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.btn{border:0;border-radius:12px;background:var(--c,var(--proj));color:#fff;font-weight:700;padding:11px 16px}
.btn:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 11px;font-size:.86rem;font-weight:600;color:var(--muted)}
.ghost.on{border-color:var(--c);color:var(--c)}
.ghost.danger{color:var(--down);border-color:var(--down)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.field{flex:1 1 140px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;min-width:0}
textarea.field{width:100%;resize:vertical;min-height:84px;line-height:1.5}
.field:focus{outline:2px solid var(--c);outline-offset:0}
form{display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .3s}
.empty{text-align:center;color:var(--muted);padding:20px 8px;font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.out{white-space:pre-wrap;background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:12px;padding:12px 14px;font-size:.95rem}
.stack{display:flex;flex-direction:column;gap:12px}

/* checklist */
ul.list{list-style:none;margin:0;padding:0}
ul.list>li+li{border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:12px;padding:12px 2px;cursor:pointer;min-height:50px}
.chk input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{opacity:0;width:13px;height:13px}
.chk input:checked+.box{background:var(--c);border-color:var(--c)}
.chk input:checked+.box svg{opacity:1}
.chk .t{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.chk input:checked~.t{color:var(--muted);text-decoration:line-through}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pnhw{display:block;font-weight:400;color:var(--muted);font-size:.86rem;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;text-decoration:none}

/* habits */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem}
.daybar button:disabled{opacity:.3;cursor:default}
.dayname{text-align:center}
.dayname b{display:block;font-family:var(--display);font-size:1.25rem}
.dayname small{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem}
.wd.on{border-color:var(--c)}
.wd .vb{width:8px;height:44px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}
.wd .vb i{position:absolute;left:0;right:0;bottom:0;background:var(--c);border-radius:4px}
.chart svg{display:block;width:100%;height:auto}

/* courses */
.chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 2px;min-height:50px}
.dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.dot.s1{border-color:var(--c);background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.s2{border-color:var(--c);background:var(--c)}
.chap .t{flex:1;min-width:0;font-weight:500}
.chap .st{font-size:.74rem;color:var(--muted);flex:none;text-align:right;font-variant-numeric:tabular-nums}
.bloc+.bloc{margin-top:14px}
.bloc h3{font-size:.95rem;margin-bottom:2px}
.hb{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.q{display:flex;flex-direction:column;gap:10px}
.qn{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--c);font-weight:700}
.qt{font-weight:600;line-height:1.55}
.corr{background:var(--soft);border-radius:12px;padding:12px 14px;line-height:1.6}
.corr code,.qt code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface);padding:1px 4px;border-radius:4px}
.res{display:flex;flex-direction:column;gap:6px}
.res a{color:var(--c);font-weight:600;text-decoration:none}

/* finance */
.snap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.tick span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick b{display:block;font-family:var(--display);font-size:1.02rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tick em{font-style:normal;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.art{display:flex;flex-direction:column;gap:10px}
.art .meta{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.art h3{font-size:1.08rem;line-height:1.35}
.art .take{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.art .take b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--c);margin-bottom:4px}
.voc{display:flex;flex-wrap:wrap;gap:6px}
.voc span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--soft)}
.voc i{font-style:normal;color:var(--muted)}
.art a{color:var(--c);font-weight:700;text-decoration:none;font-size:.9rem}
.flash{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;border:0;width:100%;border-radius:18px;padding:20px;background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.flash b{font-family:var(--display);font-size:1.4rem;line-height:1.25}
.flash small{color:var(--muted)}

/* projects */
.pt{display:flex;align-items:center;gap:10px}
.pt .e{font-size:1.6rem;line-height:1}
.pt h3{font-size:1.1rem;flex:1;min-width:0;overflow-wrap:anywhere}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.emo{display:flex;gap:6px;flex-wrap:wrap}
.emo button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem}
.emo button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.timer{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--c)}
.entry{display:flex;flex-direction:column;gap:6px;padding:12px 0}
.entry+.entry{border-top:1px solid var(--line)}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.prompt{font-family:var(--display);font-size:1.12rem;line-height:1.4}

/* books / sport */
.book{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.cover{width:52px;height:72px;border-radius:6px 10px 10px 6px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:1.3rem;box-shadow:inset 5px 0 0 rgb(0 0 0 / .12)}
.book h3{font-size:1.02rem}
.pages{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.pages input{width:72px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:6px}
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pday{border-radius:16px;padding:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.pday.today{border-color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.pday b{font-family:var(--display);font-size:.95rem}
.pday span{font-size:.82rem;color:var(--muted);line-height:1.35}
.exo{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:12px;align-items:center;padding:10px 0}
.exo b{display:block;font-weight:600;overflow-wrap:anywhere}
.exo small{color:var(--muted)}


/* cours : onglets, fiches, profs IA */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.fiche h4{font-family:var(--display);font-size:.92rem;margin:16px 0 6px;color:var(--c)}
.fiche h4:first-child{margin-top:0}
.fiche ul{margin:0;padding-left:18px}
.fiche li{line-height:1.55}
.fiche li+li{margin-top:6px}
.fiche code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--soft);padding:1px 4px;border-radius:4px}
.gtxt{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.lvl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted)}
.lvl.l2{color:var(--ink)}
.lvl.l3{background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.tutor{display:flex;gap:12px;align-items:center}
.tutorcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.av{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--display);font-weight:700;font-size:1.2rem}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:.95rem}
.msg.u{align-self:flex-end;background:var(--c);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.chip:disabled{opacity:.5;cursor:default}

/* trading lab */
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.choice:disabled{cursor:default;color:var(--ink)}
.choice.right{border-color:var(--up);background:color-mix(in srgb,var(--up) 14%,var(--surface))}
.choice.wrong{border-color:var(--down);background:color-mix(in srgb,var(--down) 12%,var(--surface))}
.newsq{display:block;font-family:var(--display);font-size:1.05rem;line-height:1.4;margin-bottom:10px}
.gdots{display:flex;gap:6px}
.gdots i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.gdots i.ok{background:var(--up)} .gdots i.ko{background:var(--down)} .gdots i.cur{background:var(--c)}
.pchart{display:block;width:100%;height:auto}
.gico{font-size:1.8rem;line-height:1;flex:none}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px}
.gcard b{font-family:var(--display);font-size:.98rem}
.gscore{display:flex;align-items:baseline;gap:12px}
.gscore b{font-family:var(--display);font-size:2.4rem;color:var(--c)}
.lvname{font-family:var(--display);font-size:1.3rem;color:var(--c)}
.streak{font-family:var(--display);font-size:1.3rem}
.wdots{display:flex;gap:6px;flex-wrap:wrap}
.wdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;background:var(--soft);color:var(--muted)}
.wdot.on{background:var(--c);color:#fff}
.wdot.now{outline:2px solid var(--c);outline-offset:1px}
.daily{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.simprice{font-family:var(--display);font-size:1.3rem}
.simprice em{font-style:normal;font-size:.85rem;margin-left:6px}
.newsflash{border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--lect) 18%,var(--surface));font-weight:600}
.simbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn.buy{background:var(--up)} .btn.sell{background:var(--down)}
.simlog{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.corr a{color:var(--c);font-weight:700}

/* 🪶 : façon Notes d'Apple */
.tiles>.tile:first-child{grid-column:1/-1;min-height:136px}
.tile[data-page="proj"] svg.ill{display:none}
.tile[data-page="proj"] h2{font-size:2.3rem;line-height:1;padding:0}
.notesapp{--ny:#d99a00;--ncell:var(--surface);--nsep:var(--line);gap:10px;padding-bottom:72px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .notesapp{--ny:#ffd60a}}
:root[data-theme="dark"] .notesapp{--ny:#ffd60a}
.notesapp h1,.notesapp h2,.notesapp h3{font-family:inherit;letter-spacing:-.01em}
.nbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.nback{border:0;background:none;color:var(--ny);font-size:1.06rem;padding:6px 0;display:inline-flex;align-items:center;min-width:0;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nback::before{content:"";flex:none;width:11px;height:11px;border-left:2.6px solid currentColor;border-bottom:2.6px solid currentColor;border-radius:1px;transform:rotate(45deg);margin:0 7px 0 5px}
.nlink{border:0;background:none;color:var(--ny);font-size:1rem;font-weight:600;padding:6px 8px}
.nbig{font-size:2.1rem;font-weight:700;line-height:1.1;margin:0 0 4px;overflow-wrap:anywhere}
.nsearch{display:flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--muted) 15%,transparent);border-radius:11px;padding:0 10px;height:38px;color:var(--muted)}
.nsearch svg{flex:none;width:17px;height:17px}
.nsearch input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:1rem;color:var(--ink)}
.nsearch input::-webkit-search-cancel-button{opacity:.6}
.ngroup{background:var(--ncell);border-radius:12px;overflow:hidden;margin-top:6px}
.nhead{font-size:1.2rem;font-weight:700;margin:14px 2px 0}
.nsub,.nempty{color:var(--muted);font-size:.9rem;text-align:center;padding:14px 8px}

const Q={
mspe:{

["Démontre par récurrence que pour tout entier n ≥ 1 : 1 + 2 + … + n = n(n+1)/2.","<b>Initialisation</b> : pour n = 1, on a 1 = 1×2/2. ✓<br><b>Hérédité</b> : on suppose 1 + … + n = n(n+1)/2. Alors 1 + … + n + (n+1) = n(n+1)/2 + (n+1) = (n+1)(n+2)/2, c'est la formule au rang n+1.<br><b>Conclusion</b> : la propriété est vraie pour tout n ≥ 1."],
["On pose u<sub>0</sub> = 1 et u<sub>n+1</sub> = 0,5u<sub>n</sub> + 3. Montre par récurrence que u<sub>n</sub> ≤ 6 pour tout n.","u<sub>0</sub> = 1 ≤ 6. Si u<sub>n</sub> ≤ 6, alors 0,5u<sub>n</sub> ≤ 3, donc u<sub>n+1</sub> = 0,5u<sub>n</sub> + 3 ≤ 6. La propriété est héréditaire, elle est donc vraie pour tout n."],
["Même suite. On pose v<sub>n</sub> = u<sub>n</sub> − 6. Montre que (v<sub>n</sub>) est géométrique, puis exprime u<sub>n</sub> en fonction de n.","v<sub>n+1</sub> = u<sub>n+1</sub> − 6 = 0,5u<sub>n</sub> − 3 = 0,5(u<sub>n</sub> − 6) = 0,5v<sub>n</sub>.<br>C'est une suite géométrique de raison 0,5 et de premier terme v<sub>0</sub> = −5, donc v<sub>n</sub> = −5 × 0,5<sup>n</sup> et <b>u<sub>n</sub> = 6 − 5 × 0,5<sup>n</sup></b>."]],
"0-1":[

"0-2":[
["Détermine la limite de e<sup>x</sup> / x² quand x → +∞.","Par <b>croissance comparée</b>, l'exponentielle l'emporte sur toute puissance de x : e<sup>x</sup>/x² → +∞."],

["Montre que l'équation x³ + x − 1 = 0 admet une unique solution α sur [0 ; 1].","f(x) = x³ + x − 1 est continue, et f'(x) = 3x² + 1 > 0 donc f est strictement croissante. f(0) = −1 < 0 et f(1) = 1 > 0. D'après le <b>corollaire du TVI</b>, l'équation a une unique solution α dans [0 ; 1]."],

"0-5":[
["Résous ln(2x − 1) = 0.","Domaine : 2x − 1 > 0, soit x > 1/2. ln(2x − 1) = 0 ⇔ 2x − 1 = 1 ⇔ <b>x = 1</b>, qui est bien dans le domaine."],
["Un capital augmente de 5 % par an. À partir de combien d'années aura-t-il doublé ?","On cherche n tel que 1,05<sup>n</sup> > 2, soit n ln 1,05 > ln 2, donc n > ln 2 / ln 1,05 ≈ 14,2. Il faut <b>15 ans</b>."],
["Dérive f(x) = x ln x − x sur ]0 ; +∞[.","f'(x) = (1 × ln x + x × 1/x) − 1 = ln x + 1 − 1 = <b>ln x</b>."]],
"0-6":[
["Dérive f(x) = sin(2x) + cos(x).","<b>f'(x) = 2cos(2x) − sin(x)</b>."],
["Résous cos x = 1/2 sur [0 ; 2π].","Sur le cercle trigonométrique : <b>x = π/3 ou x = 5π/3</b>."],
["La fonction f(x) = x sin x est-elle paire, impaire, ou ni l'une ni l'autre ?","f(−x) = (−x) × sin(−x) = (−x) × (−sin x) = x sin x = f(x). Elle est <b>paire</b>."]],
"0-7":[
["Donne une primitive de f(x) = 3x² − 4x + 1.","<b>F(x) = x³ − 2x² + x</b> (à une constante près)."],
["Donne une primitive de f(x) = 2x e<sup>x²</sup>.","C'est la forme u'e<sup>u</sup> avec u = x². Une primitive est <b>F(x) = e<sup>x²</sup></b>."],
["Résous y' = −2y + 6 avec y(0) = 1.","Les solutions sont y(x) = Ce<sup>−2x</sup> + 3 (la solution constante est −b/a = 3). y(0) = C + 3 = 1 donne C = −2. Donc <b>y(x) = 3 − 2e<sup>−2x</sup></b>."]],
"0-8":[
["Calcule ∫<sub>0</sub><sup>1</sup> (2x + 1) dx.","[x² + x] de 0 à 1 = (1 + 1) − 0 = <b>2</b>."],
["Calcule ∫<sub>1</sub><sup>e</sup> (1/x) dx.","[ln x] de 1 à e = ln e − ln 1 = <b>1</b>."],
["Calcule la valeur moyenne de f(x) = x² sur [0 ; 3].","μ = (1/3) ∫<sub>0</sub><sup>3</sup> x² dx = (1/3) × [x³/3] de 0 à 3 = (1/3) × 9 = <b>3</b>."]],
"1-0":[
["A(1 ; 0 ; 2), B(3 ; 1 ; 0), C(5 ; 2 ; −2). Ces points sont-ils alignés ?","AB(2 ; 1 ; −2) et AC(4 ; 2 ; −4) = 2 AB. Les vecteurs sont colinéaires : <b>A, B, C sont alignés</b>."],
["u(1 ; 2 ; 0), v(0 ; 1 ; 1), w(2 ; 5 ; 1). Ces vecteurs sont-ils coplanaires ?","On cherche a, b tels que w = au + bv : a = 2, puis 2a + b = 5 donne b = 1, et b = 1 pour la 3e coordonnée. ✓ w = 2u + v : <b>ils sont coplanaires</b>."],
["Quelles sont les positions relatives possibles de deux droites dans l'espace ?","Elles peuvent être <b>sécantes</b>, <b>parallèles</b> (strictement ou confondues) ou <b>non coplanaires</b>. Seules les deux premières situations sont possibles dans un plan."]],
"1-1":[
["Donne une représentation paramétrique de (AB) avec A(1 ; 2 ; 3) et B(2 ; 0 ; 4).","Vecteur directeur AB(1 ; −2 ; 1). <b>x = 1 + t, y = 2 − 2t, z = 3 + t</b>, t ∈ ℝ."],
["Donne une équation cartésienne du plan passant par A(1 ; 2 ; 3) et de vecteur normal n(2 ; −1 ; 1).","2x − y + z + d = 0 et A appartient au plan : 2 − 2 + 3 + d = 0, donc d = −3. <b>2x − y + z − 3 = 0</b>."],
["Trouve le point d'intersection de la droite x = 1 + t, y = 2 − 2t, z = 3 + t avec le plan x − y + 2z − 1 = 0.","On remplace : (1 + t) − (2 − 2t) + 2(3 + t) − 1 = 4 + 5t = 0, donc t = −0,8. Le point est <b>(0,2 ; 3,6 ; 2,2)</b>. Vérification : 0,2 − 3,6 + 4,4 − 1 = 0 ✓."]],
"1-2":[
["Les vecteurs u(1 ; 2 ; −1) et v(3 ; −1 ; 1) sont-ils orthogonaux ?","u·v = 3 − 2 − 1 = 0 : <b>oui, ils sont orthogonaux</b>."],
["Calcule la distance AB avec A(1 ; 2 ; 3) et B(3 ; 0 ; 4).","AB = √(2² + (−2)² + 1²) = √9 = <b>3</b>."],
["Calcule la distance du point M(1 ; 1 ; 1) au plan P : 2x − y + 2z − 9 = 0, en passant par le projeté orthogonal H.","La droite passant par M et dirigée par n(2 ; −1 ; 2) : (1 + 2t ; 1 − t ; 1 + 2t). Dans P : 9t − 6 = 0, donc t = 2/3 et H(7/3 ; 1/3 ; 7/3). MH = |t| × ‖n‖ = (2/3) × 3 = <b>2</b>."]],
"2-0":[
["Combien de codes à 4 chiffres (de 0 à 9) peut-on former ?","4-uplets d'un ensemble à 10 éléments : 10⁴ = <b>10 000</b>."],
["Combien de podiums (1er, 2e, 3e) possibles avec 8 coureurs ?","Arrangements : 8 × 7 × 6 = <b>336</b>."],
["De combien de façons choisir 3 délégués parmi 10 élèves ?","L'ordre ne compte pas : C(10 ; 3) = 10×9×8 / 6 = <b>120</b>."]],
"2-1":[
["X suit la loi binomiale B(10 ; 0,3). Calcule P(X = 2).","P(X = 2) = C(10 ; 2) × 0,3² × 0,7⁸ = 45 × 0,09 × 0,0576… ≈ <b>0,233</b>."],
["Même loi : donne E(X) et V(X).","E(X) = np = <b>3</b> et V(X) = np(1 − p) = 10 × 0,3 × 0,7 = <b>2,1</b>."],
["Même loi : calcule P(X ≥ 1).","P(X ≥ 1) = 1 − P(X = 0) = 1 − 0,7¹⁰ ≈ 1 − 0,028 = <b>0,972</b>."]],
"2-2":[
["E(X) = 2 et E(Y) = 5. Calcule E(X + Y) et E(3X − 1).","Par linéarité : E(X + Y) = <b>7</b> et E(3X − 1) = 3 × 2 − 1 = <b>5</b>."],
["X et Y sont indépendantes, V(X) = 4 et V(Y) = 9. Calcule V(X + Y) et l'écart-type.","Indépendance : V(X + Y) = 4 + 9 = <b>13</b>, donc σ = <b>√13 ≈ 3,6</b>."],
["V(X) = 4. Calcule V(2X) et V(X + 10).","V(aX) = a²V(X) donc V(2X) = <b>16</b>. Ajouter une constante ne change pas la variance : V(X + 10) = <b>4</b>."]],
"2-3":[
["E(X) = 50 et V(X) = 25. Majore P(|X − 50| ≥ 10).","Inégalité de <b>Bienaymé-Tchebychev</b> : P(|X − μ| ≥ δ) ≤ V(X)/δ² = 25/100 = <b>0,25</b>."],
["On lance n fois une pièce équilibrée, M<sub>n</sub> est la fréquence de pile. Combien de lancers pour que P(|M<sub>n</sub> − 0,5| ≥ 0,05) ≤ 0,01 ?","Inégalité de concentration : P ≤ V(X)/(nδ²) = 0,25/(n × 0,0025) = 100/n. On veut 100/n ≤ 0,01, donc <b>n ≥ 10 000</b>."],
["Énonce la loi faible des grands nombres.","Pour tout δ > 0, P(|M<sub>n</sub> − μ| ≥ δ) → 0 quand n → +∞ : la moyenne d'un échantillon se <b>concentre autour de l'espérance</b> μ."]],
"3-0":[
["Écris une fonction Python qui renvoie le plus petit n tel que 1,05<sup>n</sup> > 2.","<code>def seuil():<br>&nbsp;&nbsp;n, u = 0, 1<br>&nbsp;&nbsp;while u &lt;= 2:<br>&nbsp;&nbsp;&nbsp;&nbsp;u = u * 1.05<br>&nbsp;&nbsp;&nbsp;&nbsp;n = n + 1<br>&nbsp;&nbsp;return n</code><br>Elle renvoie <b>15</b>."],
["Que renvoie f(10) ?<br><code>def f(n):<br>&nbsp;&nbsp;s = 0<br>&nbsp;&nbsp;for k in range(1, n+1):<br>&nbsp;&nbsp;&nbsp;&nbsp;s = s + k<br>&nbsp;&nbsp;return s</code>","La somme 1 + 2 + … + 10 = <b>55</b>."],
["Explique le principe de la dichotomie pour encadrer α, solution de f(x) = 0 sur [a ; b].","On calcule f au milieu m de l'intervalle. On garde la moitié où f change de signe ([a ; m] ou [m ; b]) et on recommence. L'amplitude est <b>divisée par 2 à chaque étape</b>, jusqu'à la précision voulue."]]

mexp:{
"0-0":[
["Calcule (2 + 3i)(1 − i).","2 − 2i + 3i − 3i² = 2 + i + 3 = <b>5 + i</b>."],
["Écris 1/(1 + i) sous forme algébrique.","On multiplie par le conjugué : (1 − i)/((1 + i)(1 − i)) = (1 − i)/2 = <b>1/2 − i/2</b>."],
["Résous (1 + i)z = 3 − i.","z = (3 − i)/(1 + i) = (3 − i)(1 − i)/2 = (3 − 3i − i + i²)/2 = (2 − 4i)/2 = <b>1 − 2i</b>."]],
"0-1":[
["Donne le module et un argument de 1 + i√3.","|z| = √(1 + 3) = <b>2</b>. cos θ = 1/2 et sin θ = √3/2, donc θ = <b>π/3</b>."],
["Écris −2i sous forme exponentielle.","Module 2, argument −π/2 : <b>−2i = 2e<sup>−iπ/2</sup></b>."],
["Calcule (1 + i)⁸.","1 + i = √2 e<sup>iπ/4</sup>, donc (1 + i)⁸ = (√2)⁸ e<sup>i2π</sup> = 16 × 1 = <b>16</b>."]],
"0-2":[
["Résous z² + 4 = 0 dans ℂ.","z² = −4 = (2i)², donc <b>z = 2i ou z = −2i</b>."],
["Résous z² − 2z + 5 = 0 dans ℂ.","Δ = 4 − 20 = −16 < 0. z = (2 ± 4i)/2, soit <b>z = 1 + 2i ou z = 1 − 2i</b>."],
["Vérifie que 1 est racine de z³ − 1, factorise, puis donne toutes les racines.","1³ − 1 = 0 ✓. z³ − 1 = (z − 1)(z² + z + 1). Pour z² + z + 1 : Δ = −3, donc z = (−1 ± i√3)/2. Racines : <b>1, (−1 + i√3)/2, (−1 − i√3)/2</b>."]],
"0-3":[
["A, B, C ont pour affixes 1, i et −1. Quelle est la nature du triangle ABC ?","AB = |i − 1| = √2, BC = |−1 − i| = √2, AC = 2. AB = BC et AB² + BC² = 4 = AC² : triangle <b>isocèle rectangle en B</b>."],
["Quel est l'ensemble des points M d'affixe z tels que |z − 2i| = 3 ?","C'est le <b>cercle de centre le point d'affixe 2i et de rayon 3</b>."],
["Quel est l'ensemble des points M tels que |z − 1| = |z + i| ?","M est à égale distance de A(1) et de B(−i) : c'est la <b>médiatrice de [AB]</b>, la droite d'équation y = −x."]],
"1-0":[
["Quel est le reste de 2<sup>2026</sup> dans la division par 7 ?","2³ = 8 ≡ 1 [7]. 2026 = 3 × 675 + 1, donc 2<sup>2026</sup> = (2³)<sup>675</sup> × 2 ≡ 2 [7]. Reste : <b>2</b>."],
["Montre que n(n + 1) est pair pour tout entier n.","Modulo 2 : si n ≡ 0, le produit ≡ 0 ; si n ≡ 1, alors n + 1 ≡ 0 et le produit ≡ 0. Dans tous les cas <b>n(n + 1) ≡ 0 [2]</b>."],
["Résous 3x ≡ 2 [5].","L'inverse de 3 modulo 5 est 2 (3 × 2 = 6 ≡ 1). On multiplie par 2 : x ≡ 4 [5]. Solutions : <b>x = 4 + 5k</b>, k ∈ ℤ."]],
"1-1":[
["Calcule PGCD(252 ; 198) avec l'algorithme d'Euclide.","252 = 1 × 198 + 54 ; 198 = 3 × 54 + 36 ; 54 = 1 × 36 + 18 ; 36 = 2 × 18 + 0. Dernier reste non nul : <b>18</b>."],
["Trouve un couple (u ; v) d'entiers tel que 17u + 5v = 1.","17 × (−2) + 5 × 7 = −34 + 35 = 1. <b>(u ; v) = (−2 ; 7)</b>."],
["Résous 17x + 5y = 1 dans ℤ².","Avec la solution particulière : 17(x + 2) = 5(7 − y). Comme 17 et 5 sont premiers entre eux, 5 divise x + 2 (Gauss). Solutions : <b>x = −2 + 5k et y = 7 − 17k</b>, k ∈ ℤ."]],
"1-2":[
["221 est-il premier ?","√221 ≈ 14,9 : on teste les premiers jusqu'à 13. 221 = <b>13 × 17</b>, donc il n'est pas premier."],
["Décompose 360 en facteurs premiers et compte ses diviseurs.","360 = <b>2³ × 3² × 5</b>. Nombre de diviseurs : (3 + 1)(2 + 1)(1 + 1) = <b>24</b>."],
["Quel est le reste de 3<sup>100</sup> dans la division par 11 ?","11 est premier et ne divise pas 3. Petit théorème de Fermat : 3<sup>10</sup> ≡ 1 [11]. Donc 3<sup>100</sup> = (3<sup>10</sup>)<sup>10</sup> ≡ 1. Reste : <b>1</b>."]],
"2-0":[
["A = (1 2 ; 3 4) et B = (0 1 ; 1 0), écrites ligne par ligne. Calcule AB.","Ligne 1 : (1×0 + 2×1 ; 1×1 + 2×0) = (2 ; 1). Ligne 2 : (3×0 + 4×1 ; 3×1 + 4×0) = (4 ; 3). <b>AB = (2 1 ; 4 3)</b>."],
["Calcule l'inverse de A = (1 2 ; 3 4).","det A = 1×4 − 2×3 = −2 ≠ 0. A⁻¹ = (1/−2) × (4 −2 ; −3 1) = <b>(−2 1 ; 1,5 −0,5)</b>."],
["Résous x + 2y = 5 et 3x + 4y = 11 avec la matrice A.","AX = (5 ; 11) donc X = A⁻¹(5 ; 11) = (−10 + 11 ; 7,5 − 5,5) = <b>(1 ; 2)</b>. Vérification : 1 + 4 = 5 ✓ et 3 + 8 = 11 ✓."]],
"2-1":[
["Un graphe a 5 sommets de degrés 3, 3, 2, 2, 2. Combien a-t-il d'arêtes ?","Somme des degrés = 2 × nombre d'arêtes. 12 = 2a, donc <b>6 arêtes</b>."],
["Un graphe peut-il avoir des sommets de degrés 3, 3, 3, 2, 2 ?","La somme vaut 13, impaire. Or elle doit être paire (lemme des poignées de main) : <b>impossible</b>."],
["M est la matrice d'adjacence d'un graphe. Que représente le coefficient (i ; j) de M³ ?","Le <b>nombre de chaînes de longueur 3</b> allant du sommet i au sommet j."]],
"2-2":[
["Deux états A et B. P(A→A) = 0,8 et P(B→A) = 0,4. Écris la matrice de transition P.","Chaque ligne correspond à l'état de départ et a une somme de 1 : <b>P = (0,8 0,2 ; 0,4 0,6)</b>."],
["On part de A : π<sub>0</sub> = (1 ; 0). Calcule π<sub>2</sub>.","π<sub>1</sub> = π<sub>0</sub>P = (0,8 ; 0,2). π<sub>2</sub> = π<sub>1</sub>P = (0,64 + 0,08 ; 0,16 + 0,12) = <b>(0,72 ; 0,28)</b>."],
["Détermine l'état stable π = (a ; b) de cette chaîne.","π = πP et a + b = 1. a = 0,8a + 0,4b donne 0,2a = 0,4b, soit a = 2b. Donc <b>π = (2/3 ; 1/3)</b>."]]

ses:{
"0-0":[
["Qu'est-ce que la productivité globale des facteurs (PGF) ?","C'est la part de la croissance <b>qui ne s'explique pas</b> par l'augmentation des quantités de travail et de capital. Elle traduit surtout le progrès technique, mais aussi l'organisation du travail ou la qualité des institutions."],
["Montre que les institutions peuvent favoriser la croissance.","Des droits de propriété protégés (brevets, contrats respectés, justice fiable) <b>sécurisent les gains</b> des entreprises. Elles sont alors incitées à investir et à innover, ce qui augmente la production à long terme."],
["Distingue soutenabilité faible et soutenabilité forte.","<b>Faible</b> : les capitaux (naturel, physique, humain) sont substituables, le progrès technique peut compenser la perte de ressources. <b>Forte</b> : une partie du capital naturel est irremplaçable et doit être préservée."]],
"0-1":[
["Explique la théorie des avantages comparatifs de Ricardo.","Chaque pays a intérêt à se spécialiser là où il est <b>relativement le plus efficace</b> (ou le moins inefficace), puis à échanger. L'échange est gagnant même pour un pays qui n'a aucun avantage absolu."],
["Que dit la théorie des dotations factorielles (HOS) ?","Un pays se spécialise dans les biens qui utilisent intensément le <b>facteur de production qu'il possède en abondance</b> (travail peu qualifié, capital, terres…)."],
["Qu'est-ce que la fragmentation de la chaîne de valeur ?","La production d'un bien est <b>découpée en étapes réparties dans plusieurs pays</b>, souvent par des firmes multinationales, selon les coûts, les compétences et l'accès aux marchés."]],
"0-2":[
["Distingue chômage structurel et chômage conjoncturel.","<b>Conjoncturel</b> : lié à une demande insuffisante lors d'un ralentissement de l'activité. <b>Structurel</b> : lié aux caractéristiques durables du marché du travail (problèmes d'appariement, institutions, coût du travail)."],
["Comment l'Insee mesure-t-il le chômage au sens du BIT ?","Est chômeur une personne <b>sans emploi, disponible sous 15 jours et en recherche active</b>. Le taux de chômage = chômeurs / population active × 100."],
["Cite deux politiques contre le chômage structurel.","Exemples : <b>formation et qualification</b> des actifs, amélioration de l'appariement (accompagnement par France Travail), baisse du coût du travail peu qualifié."]],
"0-3":[
["Qu'est-ce qu'une bulle spéculative ?","Le prix d'un actif devient <b>durablement supérieur à sa valeur fondamentale</b>, entretenu par des anticipations de hausse auto-réalisatrices, jusqu'à l'éclatement."],
["Qu'est-ce qu'une panique bancaire ?","Des déposants retirent massivement leur argent en même temps par peur d'une faillite. La banque, même solvable, manque de liquidités : <b>la peur peut provoquer la faillite</b>."],
["Cite deux outils de régulation du système financier.","<b>Ratios de solvabilité</b> (fonds propres exigés par Bâle III), <b>supervision bancaire</b> (BCE), garantie des dépôts."]],
"0-4":[
["Quel est l'objectif principal de la BCE ?","La <b>stabilité des prix</b> : une inflation de 2 % à moyen terme dans la zone euro."],
["Qu'est-ce qu'un choc asymétrique et pourquoi pose-t-il problème ?","Un choc qui touche <b>un seul pays ou quelques pays</b> de la zone euro. La politique monétaire est commune : elle ne peut pas être adaptée au pays touché, qui ne peut compter que sur sa politique budgétaire."],
["Quelles règles budgétaires fixe le Pacte de stabilité ?","Un <b>déficit public inférieur à 3 % du PIB</b> et une <b>dette publique inférieure à 60 % du PIB</b>, avec des trajectoires d'ajustement pour les pays qui dépassent."]],
"1-0":[
["Que sont les PCS ?","La nomenclature des <b>professions et catégories socioprofessionnelles</b> de l'Insee. Elle classe la population selon la profession, le statut et la qualification (6 groupes pour les actifs)."],
["Compare les analyses de Marx et de Weber sur la stratification sociale.","<b>Marx</b> : des classes définies par la place dans les rapports de production (bourgeoisie / prolétariat) et la conscience de classe. <b>Weber</b> : trois dimensions distinctes, économique (classes), sociale (prestige) et politique (partis)."],
["Cite deux évolutions de la structure socioprofessionnelle depuis 1950.","<b>Tertiarisation</b>, salarisation, hausse du niveau de qualification, féminisation des emplois, recul des agriculteurs et des ouvriers."]],
"1-1":[
["Distingue massification et démocratisation scolaires.","<b>Massification</b> : beaucoup plus d'élèves accèdent aux études longues. <b>Démocratisation</b> : les inégalités d'accès selon l'origine sociale diminuent. La première n'entraîne pas forcément la seconde."],
["Explique le rôle du capital culturel selon Bourdieu.","Les familles favorisées transmettent des savoirs, un langage et des goûts <b>valorisés par l'école</b>. Leurs enfants réussissent mieux, et l'école transforme ainsi des inégalités sociales en inégalités scolaires."],
["Qu'est-ce que la démocratisation ségrégative ?","L'accès au lycée et au bac s'élargit, mais les élèves se répartissent dans des <b>filières hiérarchisées selon leur origine sociale</b>."]],
"1-2":[
["Distingue mobilité intergénérationnelle et intragénérationnelle.","<b>Intergénérationnelle</b> : comparer la position d'un individu à celle de ses parents. <b>Intragénérationnelle</b> : l'évolution de sa position au cours de sa propre carrière."],
["Que montre une table de destinée ?","Pour 100 individus d'une même origine sociale, elle indique <b>la répartition de leurs positions sociales actuelles</b> : elle répond à « que deviennent les enfants de… ? »."],
["Qu'est-ce que la mobilité structurelle ?","La part de la mobilité due à <b>l'évolution de la structure des emplois</b> entre deux générations (moins d'agriculteurs, plus de cadres…), qui oblige une partie des individus à changer de position."]],
"1-3":[
["Distingue travail et emploi.","Le <b>travail</b> est toute activité productive. L'<b>emploi</b> est un travail rémunéré, déclaré, qui donne un statut social et des droits."],
["Compare taylorisme et post-taylorisme.","<b>Taylorisme</b> : tâches parcellisées, chronométrées, séparation conception / exécution. <b>Post-taylorisme</b> : polyvalence, travail en équipe, plus d'autonomie, juste-à-temps."],
["Montre que le numérique brouille les frontières du travail.","Télétravail, smartphones et messageries rendent floue la limite <b>vie professionnelle / vie privée</b>. Les plateformes créent des travailleurs entre salariat et indépendance."]],
"1-4":[
["Qu'est-ce que le paradoxe de l'action collective (Olson) ?","Un individu rationnel a intérêt à <b>laisser les autres se mobiliser</b> tout en profitant du résultat : c'est le comportement de passager clandestin."],
["Qu'est-ce qu'une incitation sélective ?","Un <b>avantage réservé aux participants</b> (services d'un syndicat, rétributions symboliques…) qui permet de surmonter le paradoxe d'Olson."],
["Cite trois formes d'engagement politique autres que le vote.","Manifestation, pétition, militantisme dans un parti ou une association, boycott, grève."]],
"2-0":[
["Distingue égalité des droits, des chances et des situations.","<b>Droits</b> : mêmes règles pour tous. <b>Chances</b> : mêmes possibilités d'accéder aux positions. <b>Situations</b> : réduction des écarts réels de revenus ou de conditions de vie."],
["Qu'est-ce que le principe de différence de Rawls ?","Les inégalités sont acceptables <b>si elles profitent aux plus défavorisés</b> et si les positions restent ouvertes à tous."],
["Cite deux outils de redistribution.","<b>Impôt progressif</b> sur le revenu, prestations sociales (allocations), services publics gratuits."]],
"2-1":[
["Qu'est-ce qu'une externalité négative ?","L'action d'un agent impose un <b>coût à des tiers sans compensation</b>. Exemple : une usine qui pollue une rivière."],
["Compare taxe carbone et marché de quotas d'émission.","La <b>taxe</b> fixe le prix de la pollution, la quantité émise s'ajuste. Le <b>marché de quotas</b> fixe la quantité totale autorisée, le prix s'ajuste par l'offre et la demande."],
["Pourquoi la lutte contre le changement climatique est-elle difficile à négocier ?","Le climat stable est un <b>bien commun mondial</b> : chaque pays profite des efforts des autres sans payer. Ce comportement de passager clandestin freine les accords (COP)."]]

"0-0":[["Sujet : l'art nous éloigne-t-il de la réalité ?","Pistes : Platon (l'art imite une apparence, il nous éloigne du vrai) contre Bergson (l'artiste nous fait voir ce que nous ne remarquons plus). Distinguer réalité perçue et réalité profonde."]],
"0-1":[["Sujet : le bonheur dépend-il de nous ?","Pistes : les stoïciens, Épictète (ce qui dépend de nous / ce qui n'en dépend pas) ; Aristote (le bonheur demande aussi des biens extérieurs) ; Kant (le bonheur, idéal de l'imagination)."]],
"0-2":[["Sujet : peut-on se connaître soi-même ?","Pistes : Descartes (le cogito, une certitude immédiate) contre Freud (une part de nous échappe à la conscience). Nuancer : la connaissance de soi passe aussi par les autres et par nos actes."]],
"0-3":[["Sujet : faire son devoir, est-ce renoncer à sa liberté ?","Pistes : Kant, l'autonomie, obéir à la loi qu'on se donne par la raison c'est être libre. Distinguer contrainte extérieure et obligation morale."]],
"0-4":[["Sujet : l'État est-il l'ennemi de la liberté ?","Pistes : Hobbes (sans État, guerre de tous contre tous) ; Rousseau (la loi, expression de la volonté générale, rend libre) ; les limites quand l'État devient autoritaire."]],
"0-5":[["Sujet : sommes-nous responsables de ce que nous ignorons de nous-mêmes ?","Pistes : Freud (l'inconscient détermine en partie nos actes) contre Sartre (la mauvaise foi, on se cache ce qu'on sait). Enjeu : la responsabilité morale."]],
"0-6":[["Sujet : est-il toujours juste d'obéir aux lois ?","Pistes : distinguer légal et légitime. Antigone, Thoreau et la désobéissance civile ; Socrate qui refuse de fuir sa condamnation."]],
"0-7":[["Sujet : les mots trahissent-ils la pensée ?","Pistes : Bergson (les mots généralisent et figent ce qu'on ressent) contre Hegel (la pensée n'existe vraiment qu'une fois exprimée dans les mots)."]],
"0-8":[["Sujet : être libre, est-ce faire ce que l'on veut ?","Pistes : distinguer liberté et caprice. Spinoza (on se croit libre parce qu'on ignore les causes de nos désirs) ; Rousseau (l'obéissance à la loi qu'on s'est prescrite est liberté)."]],
"0-9":[["Sujet : l'homme est-il un être naturel ?","Pistes : Aristote (animal politique par nature) ; Rousseau (la perfectibilité, l'homme se transforme) ; la culture comme seconde nature."]],
"0-10":[["Sujet : la raison peut-elle tout expliquer ?","Pistes : Leibniz (principe de raison suffisante) ; Pascal (le cœur a ses raisons) ; Kant (les limites de la raison face à ce qui dépasse l'expérience)."]],
"0-11":[["Sujet : la religion n'est-elle qu'une illusion ?","Pistes : Freud (une illusion née du désir de protection) ; Marx (l'opium du peuple) ; Durkheim (la religion fait tenir la société, elle a une fonction réelle)."]],
"0-12":[["Sujet : la science peut-elle tout démontrer ?","Pistes : Popper (une théorie scientifique est réfutable, jamais définitivement prouvée) ; les questions de valeur ou de sens échappent à la démonstration."]],
"0-13":[["Sujet : la technique nous libère-t-elle ?","Pistes : Descartes (se rendre comme maîtres et possesseurs de la nature) ; Heidegger (la technique transforme le monde en stock disponible) ; dépendance aux outils numériques."]],
"0-14":[["Sujet : peut-on échapper au temps ?","Pistes : saint Augustin (le temps existe dans l'esprit : mémoire, attention, attente) ; Bergson (la durée vécue) ; l'art ou la contemplation comme évasion."]],
"0-15":[["Sujet : le travail est-il seulement une contrainte ?","Pistes : étymologie (tripalium) ; Marx (le travail aliéné) ; Hegel (par le travail, l'homme se forme et se reconnaît dans ce qu'il produit)."]],
"0-16":[["Sujet : la vérité est-elle toujours bonne à dire ?","Pistes : Kant (mentir n'est jamais permis) face à Benjamin Constant (le devoir de vérité envers qui y a droit) ; vérité et bienveillance."]]

"0-0":[["Quelle est l'origine du dioxygène de l'atmosphère ?","La <b>photosynthèse</b>, d'abord par les cyanobactéries. Le dioxygène s'accumule dans l'atmosphère à partir d'environ 2,4 milliards d'années."]],
"0-1":[["Explique l'effet de serre.","La Terre émet un rayonnement infrarouge. Des gaz (H₂O, CO₂, CH₄) l'<b>absorbent puis le réémettent</b>, en partie vers le sol, ce qui réchauffe la surface."]],
"0-2":[["Que sont les scénarios du GIEC ?","Des <b>trajectoires possibles d'émissions</b> de gaz à effet de serre, utilisées dans les modèles pour projeter l'évolution des températures selon nos choix."]],
"0-3":[["Pourquoi brûler des combustibles fossiles augmente-t-il le CO₂ atmosphérique ?","Le charbon, le pétrole et le gaz contiennent du <b>carbone stocké depuis des millions d'années</b>. Leur combustion le libère en quelques décennies, plus vite que les puits naturels ne peuvent l'absorber."]],

"1-1":[["Comment une cellule photovoltaïque produit-elle de l'électricité ?","Les photons absorbés par un <b>semi-conducteur</b> (silicium) libèrent des électrons, qui créent un courant électrique."]],
"1-2":[["Pourquoi transporte-t-on l'électricité sous très haute tension ?","P = U × I. À puissance égale, une tension U élevée permet une intensité I faible. Les pertes par effet Joule valent <b>R × I²</b> : elles diminuent fortement."]],
"1-3":[["Cite trois critères pour choisir une source d'énergie.","Émissions de CO₂, coût, <b>intermittence</b> (solaire, éolien), déchets produits, impact sur les paysages et la biodiversité."]],
"2-0":[["Qu'est-ce que la dérive génétique ?","La variation <b>aléatoire</b> de la fréquence des allèles d'une génération à l'autre. Elle est d'autant plus forte que la population est petite."]],
"2-1":[["Donne un exemple d'évolution observable aujourd'hui.","La <b>résistance des bactéries aux antibiotiques</b> : les bactéries résistantes survivent au traitement et se multiplient (sélection naturelle)."]],
"2-2":[["L'être humain descend-il du chimpanzé ?","Non. Ils partagent un <b>ancêtre commun</b> qui vivait il y a environ 7 millions d'années ; ce sont deux lignées cousines."]],
"2-3":[["Compare les modèles démographiques de Malthus et de Verhulst.","<b>Malthus</b> : croissance exponentielle de la population. <b>Verhulst</b> : croissance logistique, qui ralentit à l'approche d'une capacité maximale du milieu."]],
"2-4":[["Qu'est-ce que l'apprentissage supervisé ?","Un algorithme est entraîné sur des <b>données déjà étiquetées</b> (photo → « chat ») pour apprendre à prédire l'étiquette de nouvelles données."]]

mspe:{
"0-0":FI(["<b>Arithmétique</b> : u<sub>n+1</sub> = u<sub>n</sub> + r, donc u<sub>n</sub> = u<sub>0</sub> + nr. Somme de termes consécutifs = nombre de termes × (premier + dernier) / 2.","<b>Géométrique</b> : u<sub>n+1</sub> = q·u<sub>n</sub>, donc u<sub>n</sub> = u<sub>0</sub>·q<sup>n</sup>. Pour q ≠ 1 : 1 + q + … + q<sup>n</sup> = (1 − q<sup>n+1</sup>) / (1 − q).","<b>Sens de variation</b> : signe de u<sub>n+1</sub> − u<sub>n</sub>, ou comparaison de u<sub>n+1</sub>/u<sub>n</sub> à 1 si les termes sont strictement positifs.","<b>Récurrence</b> : initialisation (vrai au premier rang), hérédité (si vrai au rang n, alors vrai au rang n+1), conclusion."],
 ["Suite <b>arithmético-géométrique</b> u<sub>n+1</sub> = a·u<sub>n</sub> + b : on calcule le point fixe ℓ = b/(1 − a), on pose v<sub>n</sub> = u<sub>n</sub> − ℓ, qui est géométrique de raison a.","Pour u<sub>n+1</sub> = f(u<sub>n</sub>) avec f croissante, on prouve un encadrement ou la monotonie par récurrence en appliquant f à l'hypothèse."],
 ["Dans l'hérédité, on suppose la propriété vraie pour <b>un</b> rang n fixé, pas pour tout n.","Ne pas oublier l'initialisation : sans elle, rien n'est démontré."]),
"0-1":FI(["q<sup>n</sup> : si q > 1, → +∞ ; si −1 < q < 1, → 0 ; si q = 1, → 1 ; si q ≤ −1, pas de limite.","Formes indéterminées : ∞ − ∞, 0 × ∞, ∞/∞, 0/0.","<b>Comparaison</b> : si u<sub>n</sub> ≥ v<sub>n</sub> et v<sub>n</sub> → +∞, alors u<sub>n</sub> → +∞. <b>Gendarmes</b> : si v<sub>n</sub> ≤ u<sub>n</sub> ≤ w<sub>n</sub> et v<sub>n</sub>, w<sub>n</sub> → ℓ, alors u<sub>n</sub> → ℓ.","<b>Convergence monotone</b> : croissante et majorée ⇒ convergente ; croissante non majorée ⇒ → +∞.","Si u<sub>n+1</sub> = f(u<sub>n</sub>), u<sub>n</sub> → ℓ et f continue en ℓ, alors f(ℓ) = ℓ."],
 ["Lever une forme indéterminée : factoriser par le terme dominant (n², 3<sup>n</sup>…).","Avec des racines : multiplier par la quantité conjuguée.","Pour (−1)<sup>n</sup>, cos n ou sin n : encadrer puis gendarmes."],

"0-3":FI(["f est continue en a si f(x) → f(a) quand x → a. Les fonctions usuelles sont continues sur leur ensemble de définition.","Toute fonction dérivable est continue (la réciproque est fausse : |x| en 0).","<b>TVI</b> : f continue sur [a ; b] et k compris entre f(a) et f(b) ⇒ il existe c ∈ [a ; b] tel que f(c) = k.","<b>Corollaire</b> : si de plus f est strictement monotone, c est unique."],

function streak(){let d=today(),s=0;const t=dayStats(d);if(t.n<t.t)d=add(d,-1);for(let i=0;i<400;i++){const x=dayStats(d);if(x.t&&x.n===x.t){s++;d=add(d,-1)}else break}return s}
function ring(p,c){const r=24,L=2*Math.PI*r;return`<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--soft)" stroke-width="7"/><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(${c})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p)}" transform="rotate(-90 30 30)"/></svg>`}
function weekSeries(nw){const o=[],m0=monday(today());for(let w=nw-1;w>=0;w--){const m=add(m0,-7*w);let n=0,t=0;for(let i=0;i<7;i++){const d=add(m,i);if(d>today())break;const s=dayStats(d);n+=s.n;t+=s.t}o.push({m,p:t?n/t:0})}return o}
function lineChart(sr){
  const W=520,H=200,L=38,R=14,T=16,B=28,iw=W-L-R,ih=H-T-B,x=i=>L+(sr.length<2?iw/2:i*iw/(sr.length-1)),y=p=>T+ih*(1-p);

  const pts=sr.map((s,i)=>`${x(i)},${y(s.p)}`);const st=Math.ceil(sr.length/5);

function calcTool(){return{name:"calculer",
  description:"Calcule une expression numérique et renvoie sa valeur décimale. Syntaxe : + - * / ^, parenthèses, point décimal (pas de virgule), fonctions sqrt, ln (népérien), log (base 10), exp, sin, cos, tan, asin, acos, atan, abs, pow(a,b), fact(n), C(n,k), min, max, round, floor, constantes pi et e. Exemple : ln(2)/ln(1.05).",
  inputSchema:{type:"object",properties:{expression:{type:"string",description:"Expression à calculer"}},required:["expression"]},
  execute:inp=>String(safeEval(String(inp&&inp.expression||"")))}}
function safeEval(src){
  const s=String(src).replace(/×/g,"*").replace(/÷/g,"/").replace(/π/g,"pi").replace(/√\s*(\d+(?:\.\d+)?|pi|e)/g,"sqrt($1)").replace(/√/g,"sqrt").replace(/\*\*/g,"^").replace(/−/g,"-");
  const toks=s.match(/\d+(?:\.\d+)?(?:e[+-]?\d+)?|\.\d+|[A-Za-z_]+|[+\-*/^(),]|\S/g)||[];
  let i=0;const peek=()=>toks[i],next=()=>toks[i++];
  const fact=n=>{n=Math.round(n);if(n<0||n>170)throw new Error("fact hors limites");let r=1;for(let k=2;k<=n;k++)r*=k;return r};
  const Fn={sqrt:Math.sqrt,ln:Math.log,log:Math.log10,exp:Math.exp,sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,abs:Math.abs,pow:Math.pow,floor:Math.floor,round:Math.round,min:Math.min,max:Math.max,fact,C:(n,k)=>fact(n)/(fact(k)*fact(n-k))};
  const K={pi:Math.PI,e:Math.E};
  function expr(){let v=term();while(peek()==="+"||peek()==="-"){const o=next(),w=term();v=o==="+"?v+w:v-w}return v}
  function term(){let v=unary();while(peek()==="*"||peek()==="/"){const o=next(),w=unary();v=o==="*"?v*w:v/w}return v}
  function unary(){if(peek()==="-"){next();return -unary()}if(peek()==="+"){next();return unary()}return power()}
  function power(){const b=primary();if(peek()==="^"){next();return Math.pow(b,unary())}return b}
  function primary(){const t=next();if(t===undefined)throw new Error("Expression incomplète");
    if(/^[\d.]/.test(t))return parseFloat(t);
    if(t==="("){const v=expr();if(next()!==")")throw new Error("Parenthèse fermante manquante");return v}
    if(/^[A-Za-z_]+$/.test(t)){
      if(Object.prototype.hasOwnProperty.call(K,t)&&peek()!=="(")return K[t];
      if(!Object.prototype.hasOwnProperty.call(Fn,t))throw new Error("Fonction inconnue : "+t);
      if(next()!=="(")throw new Error("Parenthèse attendue après "+t);
      const a=[expr()];while(peek()===","){next();a.push(expr())}
      if(next()!==")")throw new Error("Parenthèse fermante manquante");return Fn[t](...a)}
    throw new Error("Symbole inattendu : "+t)}
  const v=expr();if(i<toks.length)throw new Error("Symbole inattendu : "+toks[i]);
  if(typeof v!=="number"||!isFinite(v))throw new Error("Résultat non défini");
  return +v.toPrecision(12);
}

    let P=rint(r,20,160)+pick(r,[0,0.5]);if(P<d*4)P=d*4+rint(r,5,20);if(N*P>C)P=Math.max(d*2,Math.floor(C/N*0.8));const S=P-d;
    rounds.push({kind:"num",unit:"actions",ans:N,tol:0,
      q:`Capital : <b>${euro(C)}</b>. Tu acceptes de risquer <b>${nfa(rp)} %</b> du capital sur ce trade. Tu achètes à <b>${nf(P)} €</b> avec un stop-loss à <b>${nf(S)} €</b>. Combien d'actions au maximum ?`,
      expl:`Risque maximum : ${euro(C)} × ${nfa(rp)} % = ${euro(risk,2)}. Risque par action : ${nf(P)} − ${nf(S)} = ${nf(d)} €. ${nf(risk)} ÷ ${nf(d)} = ${nf(risk/d)}, donc <b>${N} actions</b> (on arrondit toujours à l'inférieur).`});
  }
  const d=pick(r,[2,3,4,5]),k=pick(r,[1.5,2,3]),g=d*k,opts=shuffle(r,[1,1.5,2,3].map(x=>x));
  rounds.push({kind:"choice",q:`Tu vises un gain de <b>${nfa(g)} €</b> par action pour un risque de <b>${nfa(d)} €</b> par action. Quel est ton ratio gain / risque ?`,
    choices:opts.map(x=>nfa(x)+" pour 1"),a:opts.indexOf(k),
    expl:`${nfa(g)} ÷ ${nfa(d)} = <b>${nfa(k)}</b>. Avec un ratio de 2 pour 1, tu peux te tromper une fois sur deux et rester gagnant.`});
  return{rounds,lesson:"La règle d'or : ne jamais risquer plus de 1 à 2 % de ton capital sur un seul trade. Même après 10 pertes d'affilée, tu es toujours dans la partie."};
}
/* ---- 3. Lis le graphique ---- */
function genGraph(r){
  let regime=pick(r,["up","down","range"]),P,okR=false;
  for(let tries=0;tries<80&&!okR;tries++){
    const p0=rint(r,40,150);P=[p0];
    for(let t=1;t<40;t++){const prev=P[t-1];let ret=0.012*gauss(r);
      if(regime==="up")ret+=0.006;else if(regime==="down")ret-=0.006;else ret+=0.15*(p0-prev)/prev;
      P.push(r2(prev*(1+ret)))}
    const ch=(P[39]-P[0])/P[0];
    okR=(regime==="up"&&ch>0.1)||(regime==="down"&&ch<-0.1)||(regime==="range"&&Math.abs(ch)<0.03&&Math.max(...P)/Math.min(...P)>1.06);
  }
  if(!okR){const ch=(P[39]-P[0])/P[0];regime=ch>0.04?"up":ch<-0.04?"down":"range"}
  const ma=P.slice(30).reduce((a,b)=>a+b,0)/10,last=P[39],hi=Math.max(...P),lo=Math.min(...P),ch=r2((last-P[0])/P[0]*100);
  const chart=priceChart(P,{ma:true});
  const hiOpts=[];[hi,r2(hi*1.05),r2((hi+lo)/2),r2(lo)].forEach(x=>{if(!hiOpts.includes(x))hiOpts.push(x)});
  const ho=shuffle(r,hiOpts);
  return{rounds:[
    {kind:"choice",chart,q:"Quelle est la tendance de cette action sur la période ?",choices:["📈 Haussière","📉 Baissière","↔️ Latérale (sans tendance)"],a:{up:0,down:1,range:2}[regime],
      expl:regime==="range"?"Le cours oscille entre un plancher (support) et un plafond (résistance) sans direction nette.":`Les sommets et les creux sont de plus en plus ${regime==="up"?"hauts":"bas"} : c'est la définition d'une tendance ${regime==="up"?"haussière":"baissière"}.`},
    {kind:"choice",chart,q:`Le dernier cours (${nf(last)} €) est-il au-dessus ou en dessous de sa moyenne mobile sur 10 séances (pointillés) ?`,choices:["Au-dessus","En dessous"],a:last>=ma?0:1,
      expl:`La moyenne des 10 derniers cours vaut ${nf(ma)} €. ${last>=ma?"Un cours au-dessus de sa moyenne mobile est souvent lu comme un signal plutôt positif.":"Un cours sous sa moyenne mobile est souvent lu comme un signal de faiblesse."}`},
    {kind:"choice",chart,q:"Quel est le plus haut de la période ?",choices:ho.map(x=>nf(x)+" €"),a:ho.indexOf(hi),expl:`Le plus haut est <b>${nf(hi)} €</b> : c'est une résistance potentielle, un niveau où les vendeurs sont apparus.`},
    {kind:"num",chart,unit:"%",ans:ch,tol:0.6,q:`Premier cours : <b>${nf(P[0])} €</b>, dernier : <b>${nf(last)} €</b>. Quelle est la variation en % ?`,
      expl:`(${nf(last)} − ${nf(P[0])}) ÷ ${nf(P[0])} × 100 = <b>${spct(ch)}</b>.`}],
   lesson:"« La tendance est ton amie » : repère les sommets et les creux, et sers-toi de la moyenne mobile pour lisser le bruit des séances."};
}
/* ---- 4. Effet de levier ---- */
function genLevier(r){
  const rounds=[];
  for(let i=0;i<3;i++){
    const M=pick(r,[500,1000,2000]),L=i===2?20:pick(r,[2,5,10]),m=(i===2?5:pick(r,[1,2,3,4,5]))*(i===2?-1:pick(r,[1,-1]));
    const raw=M*L*m/100,wipe=raw<=-M,res=wipe?-M:raw;
    const correct=wipe?`−${euro(M)} (toute ta mise)`:seuro(res);
    const labels=[correct];[seuro(M*m/100),seuro(-raw),seuro(raw*2),seuro(M*m*L/1000)].forEach(x=>{if(!labels.includes(x)&&labels.length<4)labels.push(x)});
    const ch=shuffle(r,labels);
    rounds.push({kind:"choice",q:`Tu places <b>${euro(M)}</b> avec un levier <b>×${L}</b> (exposition de ${euro(M*L)}). Le prix ${m>0?"monte":"baisse"} de <b>${Math.abs(m)} %</b>. Quel est ton résultat ?`,
      choices:ch,a:ch.indexOf(correct),
      expl:`Le levier multiplie la variation : ${Math.abs(m)} % × ${L} = ${Math.abs(m*L)} % de ta mise, soit ${seuro(raw)}.${wipe?" La perte atteint ta mise entière : la position est fermée automatiquement (appel de marge) et tu perds tout.":""}`});
  }
  const L=pick(r,[4,5,10,20,25]),ans=100/L,opts=[];[ans,ans*2,L,50].forEach(x=>{if(!opts.includes(x))opts.push(x)});const o=shuffle(r,opts);
  rounds.push({kind:"choice",q:`Avec un levier <b>×${L}</b>, quelle baisse du prix suffit à perdre 100 % de ta mise ?`,choices:o.map(x=>nfa(x)+" %"),a:o.indexOf(ans),
    expl:`100 % ÷ ${L} = <b>${nfa(ans)} %</b>. Plus le levier est grand, plus une petite baisse suffit à tout perdre.`});
  return{rounds,lesson:"Le levier ne change pas tes chances d'avoir raison : il multiplie les gains et les pertes. Selon les régulateurs européens, la majorité des particuliers qui tradent avec un fort levier perdent de l'argent."};
}
/* ---- 5. Calculs de trader ---- */
function genCalc(r){
  const A=rint(r,20,200),p=pick(r,[-25,-20,-15,-10,-5,5,10,15,20,25,30,40]),B=r2(A*(1+p/100));
  const x=pick(r,[10,20,25,50]),tot=-x*x/100;
  const P=pick(r,[40,50,60,80,100,120]),y=pick(r,[2,2.5,3,4,5]),D=r2(P*y/100);
  const per=pick(r,[10,12,15,20,25,30]),E=pick(r,[2,3,4,5,6]);
  const rr=pick(r,[5,6,7,8,10]),n=pick(r,[5,10,15]),fv=Math.round(1000*Math.pow(1+rr/100,n));
  return{rounds:[
    {kind:"num",unit:"%",ans:p,tol:0.15,q:`Une action passe de <b>${nf(A)} €</b> à <b>${nf(B)} €</b>. Quelle est sa variation en % ?`,expl:`(${nf(B)} − ${nf(A)}) ÷ ${nf(A)} × 100 = <b>${spct(p,0)}</b>.`},
    {kind:"num",unit:"%",ans:tot,tol:0.05,q:`Une action baisse de <b>${x} %</b>, puis remonte de <b>${x} %</b>. Quelle est la variation totale en % ?`,expl:`(1 − ${x/100}) × (1 + ${x/100}) = ${nfa(1+tot/100)}, soit <b>${spct(tot)}</b>. Après une baisse, il faut une hausse plus forte pour revenir : après −50 %, il faut +100 %.`},
    {kind:"num",unit:"%",ans:y,tol:0.05,q:`Une action cote <b>${nf(P,0)} €</b> et verse un dividende annuel de <b>${nf(D)} €</b>. Quel est son rendement du dividende en % ?`,expl:`${nf(D)} ÷ ${nf(P,0)} × 100 = <b>${nfa(y)} %</b>.`},
    {kind:"num",unit:"",ans:per,tol:0.05,q:`Une action cote <b>${nf(per*E,0)} €</b> et son bénéfice par action (BPA) est de <b>${E} €</b>. Quel est son PER (cours ÷ bénéfice par action) ?`,expl:`${per*E} ÷ ${E} = <b>${per}</b> : le marché paie ${per} fois le bénéfice annuel. Un PER élevé signifie que de fortes croissances sont attendues.`},
    {kind:"num",unit:"€",ans:fv,tol:2,q:`Tu places <b>1 000 €</b> à <b>${rr} %</b> par an, intérêts réinvestis. Combien auras-tu au bout de <b>${n} ans</b> (à l'euro près) ?`,expl:`1 000 × 1,${String(rr).padStart(2,"0")}<sup>${n}</sup> ≈ <b>${euro(fv)}</b>. Astuce : 72 ÷ ${rr} ≈ ${nfa(72/rr)} ans pour doubler un capital (règle de 72).`}],
   lesson:"Les intérêts composés : les gains produisent eux-mêmes des gains. Le temps est le meilleur allié de l'investisseur."};
}
/* ---- 6. Séance simulée ---- */
const POSN=["NOVA décroche un contrat géant en Asie","Résultats trimestriels bien au-dessus des attentes","Un fonds réputé entre au capital de NOVA","Le nouveau robot de NOVA est salué par la presse","Un analyste relève son objectif de cours"];
const NEGN=["NOVA rappelle des milliers de produits défectueux","Le patron de NOVA démissionne par surprise","Enquête de l'autorité de la concurrence sur NOVA","NOVA revoit ses prévisions annuelles en baisse","Un analyste passe à « vendre » sur NOVA"];
function genSimu(r){
  const p0=rint(r,40,120),drift=(r()-0.45)*0.006,vol=0.015+r()*0.01,P=[p0],news={};
  for(let t=1;t<=20;t++){let ret=drift+vol*gauss(r);
    if(r()<0.17){const up=r()<0.5,s=0.05+r()*0.07;ret+=up?s:-s;news[t]=up?pick(r,POSN):pick(r,NEGN)}
    P.push(r2(Math.max(1,P[t-1]*(1+ret))))}
  return{sim:true,P,news,lesson:"Une bonne partie des mouvements est imprévisible : ce qui fait un bon trader, c'est de couper vite ses pertes et de limiter son risque, pas de deviner l'avenir."};
}
const GEN={news:genNews,risk:genRisk,graph:genGraph,levier:genLevier,calc:genCalc,simu:genSimu};

/* ---- graphique ---- */
function priceChart(P,o={}){
  const W=320,H=150,L=8,R=46,T=10,B=12,n=P.length,full=o.full||n,mn=Math.min(...(o.range||P)),mx=Math.max(...(o.range||P)),sp=(mx-mn)||1;
  const x=i=>L+i*(W-L-R)/Math.max(1,full-1),y=v=>T+(H-T-B)*(1-(v-mn)/sp);
  const pts=P.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  let ma="";if(o.ma&&n>10){const m=[];for(let i=9;i<n;i++)m.push(x(i).toFixed(1)+","+y(P.slice(i-9,i+1).reduce((a,b)=>a+b,0)/10).toFixed(1));ma=`<polyline points="${m.join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`}
  const up=P[n-1]>=P[0];
  const marks=(o.marks||[]).map(k=>`<circle cx="${x(k.i)}" cy="${y(P[k.i])}" r="4.5" fill="${k.buy?"var(--up)":"var(--down)"}" stroke="var(--surface)" stroke-width="1.5"/>`).join("");
  return`<svg class="pchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique du cours">
    <line x1="${L}" x2="${W-R}" y1="${y(mx)}" y2="${y(mx)}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${y(mn)}" y2="${y(mn)}" stroke="var(--line)"/>
    <text x="${W-R+4}" y="${y(mx)+4}" font-size="10" fill="var(--muted)">${nf(mx)}</text><text x="${W-R+4}" y="${y(mn)+4}" font-size="10" fill="var(--muted)">${nf(mn)}</text>
    <polyline points="${L},${H-B} ${pts} ${x(n-1)},${H-B}" fill="${up?"var(--up)":"var(--down)"}" opacity=".08" stroke="none"/>
    ${ma}<polyline points="${pts}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="2" stroke-linejoin="round"/>
    ${marks}<circle cx="${x(n-1)}" cy="${y(P[n-1])}" r="4" fill="${up?"var(--up)":"var(--down)"}"/></svg>`;
}

/* ---- progression ---- */
function prog(){const p=S.jeu.progress||{};return{xp:p.xp||0,days:p.days||{},actu:p.actu||{}}}
function levelOf(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});return{i,name:LEVELS[i][1],from:LEVELS[i][0],to:(LEVELS[i+1]||[null])[0]}}
function gameStreak(p){let d=today(),s=0;if(!p.days[dkey(d)])d=add(d,-1);while(p.days[dkey(d)]){s++;d=add(d,-1)}return s}
function addXp(fn){const p=prog();fn(p);return put("jeu","progress",p)}

/* ---- déroulé d'une partie ---- */
function startGame(mode,k){
  const seed=mode==="daily"?hashStr("2cerveau|"+dkey(today())+"|"+k):(Date.now()%2147483647);
  const data=GEN[k](rngOf(seed));
  V.g={mode,k,data,i:0,pick:null,val:null,res:[],done:false};V.gin="";
  if(data.sim)V.g.sim={t:0,cash:10000,sh:0,entry:0,stop:true,fees:0,trades:[],marks:[],log:[]};
  render(true);
}
function gAnswer(val){
  const g=V.g,R=g.data.rounds[g.i];if(g.pick!==null)return;
  let ok;if(R.kind==="choice"){g.pick=val;ok=val===R.a}else{const v=parseNum(val);if(isNaN(v))return;g.pick=v;ok=Math.abs(v-R.ans)<=R.tol+1e-9}
  g.res.push(ok);render(true);
}
function gNext(){const g=V.g;g.pick=null;V.gin="";if(g.i<g.data.rounds.length-1){g.i++;render(true)}else finishGame(g.res.filter(Boolean).length,g.data.rounds.length)}
function finishGame(score,max){
  const g=V.g;g.done=true;g.score=score;g.max=max;g.xp=0;
  const p=prog(),t=dkey(today());
  if(g.mode==="daily"&&!p.days[t]){g.xp=score*10+10;addXp(q=>{q.xp+=g.xp;q.days[t]={k:g.k,s:score,m:max}})}else render(true);
}
/* séance simulée */
const FEE=0.001;
function simStep(action){
  const g=V.g,s=g.sim,P=g.data.P,price=P[s.t];if(g.done)return;
  if(action==="buy"&&s.sh===0){const n=Math.floor(s.cash/(price*(1+FEE)));if(n>0){const f=n*price*FEE;s.cash-=n*price+f;s.fees+=f;s.sh=n;s.entry=price;s.entryFee=f;s.marks.push({i:s.t,buy:true});s.log.unshift(`Séance ${s.t} : achat de ${n} actions à ${nf(price)} €`)}}
  if(action==="sell"&&s.sh>0)simSell(price,"vente");
  s.t++;
  if(s.sh>0&&s.stop&&P[s.t]<=s.entry*0.95)simSell(P[s.t],"stop-loss déclenché");
  if(s.t>=P.length-1){if(s.sh>0)simSell(P[P.length-1],"clôture de fin de partie");simFinish();return}
  render(true);
}
function simSell(price,why){const s=V.g.sim,v=s.sh*price,f=v*FEE;s.cash+=v-f;s.fees+=f;const pnl=(price-s.entry)*s.sh-f-(s.entryFee||0);
  s.trades.push({pnl,pct:(price/s.entry-1)*100});s.marks.push({i:s.t,buy:false});s.log.unshift(`Séance ${s.t} : ${why}, ${s.sh} actions à ${nf(price)} € (${seuro(pnl)})`);s.sh=0;s.entry=0}
function simFinish(){
  const g=V.g,s=g.sim,P=g.data.P,n=Math.floor(10000/(P[0]*(1+FEE))),bh=10000-n*P[0]*(1+FEE)+n*P[P.length-1]*(1-FEE);
  s.final=s.cash;s.bh=bh;const worst=s.trades.reduce((a,t)=>Math.min(a,t.pct),0);
  const score=(s.final>=10000?2:0)+(s.final>=bh-100?2:0)+(worst>-8?1:0);
  finishGame(score,5);
}

const nMaj=n=>n.maj||n.ts||0;
const nLines=n=>String(n.txt||"").split("\n").map(s=>s.trim()).filter(Boolean);
const nTitle=n=>(nLines(n)[0]||"Nouvelle note").slice(0,120);
const nPrev=n=>nLines(n).slice(1).join(" ").slice(0,160)||"Aucun texte supplémentaire";
const nRealF=f=>f&&f!=="all"&&f!=="none"&&f!=="trash"&&!!S.projets[f];
function fName(f){return f==="all"?"Toutes les notes":f==="none"?"Notes":f==="trash"?"Suppr. récemment":f&&S.projets[f]?S.projets[f].nom:"Dossiers"}
function nIn(f){
  const all=Object.entries(S.notes).filter(([,n])=>n&&typeof n==="object");
  const a=f==="trash"?all.filter(([,n])=>n.suppr):all.filter(([,n])=>!n.suppr&&(f==="all"||(f==="none"?!nRealF(n.projet):n.projet===f)));
  return a.sort((x,y)=>(f==="trash"?(y[1].suppr-x[1].suppr):nMaj(y[1])-nMaj(x[1])));
}
function nDays(ts){const d=new Date(ts);d.setHours(0,0,0,0);return Math.round((today()-d)/864e5)}
function nWhen(ts){const d=new Date(ts),k=nDays(ts);
  if(k<=0)return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  if(k===1)return"Hier";if(k<7)return JOURS[d.getDay()].toLowerCase();
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})}
function nGroup(ts){const d=new Date(ts),k=nDays(ts);
  if(k<=0)return"Aujourd'hui";if(k===1)return"Hier";if(k<=7)return"7 jours précédents";if(k<=30)return"30 jours précédents";
  return MOIS[d.getMonth()].replace(/^./,c=>c.toUpperCase())+(d.getFullYear()!==today().getFullYear()?" "+d.getFullYear():"")}
function nLong(ts){const d=new Date(ts);return d.getDate()+" "+MOIS[d.getMonth()]+" "+d.getFullYear()+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}

/* ---- HTML des notes : on ne garde que la mise en forme utile ---- */
const NTAGS={H1:1,H2:1,H3:1,P:1,DIV:1,BR:1,B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,UL:1,OL:1,LI:1};
function cleanHtml(h){
  const t=document.createElement("template");t.innerHTML=String(h||"");
  const walk=el=>[...el.childNodes].forEach(c=>{
    if(c.nodeType===3)return;
    if(c.nodeType!==1||/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|IMG|VIDEO|AUDIO|LINK|META)$/i.test(c.tagName)){c.remove();return}
    walk(c);
    if(!NTAGS[c.tagName]){c.replaceWith(...c.childNodes);return}
    const ck=c.tagName==="UL"&&c.classList.contains("ck"),ok=c.tagName==="LI"&&c.getAttribute("data-ok")==="1";
    [...c.attributes].forEach(a=>c.removeAttribute(a.name));if(ck)c.className="ck";if(ok)c.setAttribute("data-ok","1");
  });
  walk(t.content);return t.innerHTML;
}
function nHtml(n){return n.html!=null?cleanHtml(n.html):String(n.txt||"").split("\n").map(l=>`<div>${esc(l)||"<br>"}</div>`).join("")}
function edText(el){return String(el.innerText||"").replace(/ /g," ").replace(/\n{3,}/g,"\n\n").trim()}

/* ---- rangement : anciens projets, corbeille de 30 jours ---- */
function nHousekeep(){
  const lim=Date.now()-30*864e5;
  Object.entries(S.notes).forEach(([id,n])=>{if(n&&n.suppr&&n.suppr<lim)del("notes",id)});
  Object.entries(S.projets).forEach(([pid,p])=>{if(!p||p.migre)return;const ts=p.taches||[],cl=p.clair||{},now=Date.now();
    const qa=CLAIR.map((q,i)=>cl[i]?[q,cl[i]]:null).filter(Boolean);if(!ts.length&&!qa.length)return;
    if(ts.length&&!S.notes["mig-et-"+pid])put("notes","mig-et-"+pid,{projet:pid,html:`<h1>Étapes</h1><ul class="ck">${ts.map(t=>`<li${t.ok?' data-ok="1"':""}>${esc(t.t)}</li>`).join("")}</ul>`,txt:"Étapes\n"+ts.map(t=>t.t).join("\n"),ts:p.cree||now,maj:now},true);
    if(qa.length&&!S.notes["mig-cl-"+pid])put("notes","mig-cl-"+pid,{projet:pid,html:"<h1>Y voir clair</h1>"+qa.map(([q,a])=>`<h3>${esc(q)}</h3>${String(a).split("\n").map(l=>`<div>${esc(l)||"<br>"}</div>`).join("")}`).join(""),txt:"Y voir clair\n"+qa.map(([q,a])=>q+"\n"+a).join("\n"),ts:p.cree||now,maj:now},true);
    put("projets",pid,{...p,migre:true},true);
  });
}

  q=String(q||"").trim().toLowerCase();

  if(!scope){
    const fs=Object.entries(S.projets).filter(([,p])=>p&&p.nom).sort((a,b)=>a[1].nom.localeCompare(b[1].nom,"fr")),tr=nIn("trash").length;
    return`<div class="ngroup">${fs.length?nFolderCell("all",nIn("all").length):""}${nFolderCell("none",nIn("none").length)}${fs.map(([id])=>nFolderCell(id,nIn(id).length)).join("")}</div>

  const pins=list.filter(([,n])=>n.epingle),rest=list.filter(([,n])=>!n.epingle),groups=[];
  rest.forEach(([id,n])=>{const g=nGroup(nMaj(n)),last=groups[groups.length-1];if(last&&last[0]===g)last[1].push([id,n]);else groups.push([g,[[id,n]]])});
  return(pins.length?[["Épinglées",pins],...groups]:groups).map(([g,a])=>`<p class="nhead">${g}</p><div class="ngroup">${a.map(([id,n])=>nRow(id,n,scope==="all")).join("")}</div>`).join("");
}

/* ---- édition ---- */
let nT=null;
function nSaveSoon(){clearTimeout(nT);nT=setTimeout(nSave,500)}
function nSave(){
  clearTimeout(nT);const el=document.getElementById("ned");if(!el)return;
  const id=el.dataset.ned,n=S.notes[id]||(V.ndraft&&V.ndraft.id===id?V.ndraft.n:null);if(!n)return;
  const html=cleanHtml(el.innerHTML),txt=edText(el);
  if(html===cleanHtml(nHtml(n)))return;
  if(!S.notes[id]&&!txt)return;
  put("notes",id,{...n,html,txt,maj:Date.now()},true);
  if(V.ndraft&&V.ndraft.id===id)V.ndraft=null;
}
function nBack(){
  nSave();const id=V.note,n=S.notes[id];
  if(n&&!n.suppr&&!String(n.txt||"").trim())del("notes",id);
  V.note=null;V.ndraft=null;V.confirm=null;render(true);window.scrollTo(0,0);
}
function nCompose(){
  const id=uid(),now=Date.now();V.ndraft={id,n:{projet:nRealF(V.nf)?V.nf:null,html:"",txt:"",ts:now,maj:now}};V.note=id;V.confirm=null;render(true);window.scrollTo(0,0);
  const el=document.getElementById("ned");if(el){el.focus();const r=document.createRange();r.selectNodeContents(el.firstChild||el);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
}
let nRange=null;
document.addEventListener("selectionchange",()=>{const el=document.getElementById("ned"),s=getSelection();if(el&&s.rangeCount&&el.contains(s.anchorNode))nRange=s.getRangeAt(0).cloneRange()});
const upTo=(node,sel,root)=>{let x=node&&node.nodeType===3?node.parentNode:node;while(x&&x!==root){if(x.matches&&x.matches(sel))return x;x=x.parentNode}return null};
function nFormat(cmd){
  const el=document.getElementById("ned");if(!el)return;
  if(document.activeElement!==el){el.focus();if(nRange){const s=getSelection();s.removeAllRanges();s.addRange(nRange)}}
  try{document.execCommand("defaultParagraphSeparator",false,"div")}catch(e){}
  const at=()=>getSelection().anchorNode;
  if(cmd==="ck"){
    const li=upTo(at(),"li",el),ul=li&&li.parentNode;
    if(ul&&ul.tagName==="UL"&&ul.classList.contains("ck"))document.execCommand("insertUnorderedList");
    else{if(!(ul&&ul.tagName==="UL"))document.execCommand(ul?"insertOrderedList":"insertUnorderedList");if(ul&&ul.tagName==="OL")document.execCommand("insertUnorderedList");const u=upTo(at(),"ul",el);if(u)u.className="ck"}
  }else if(cmd==="ul"||cmd==="ol"){
    const u=upTo(at(),"ul",el);if(cmd==="ul"&&u&&u.classList.contains("ck")){u.removeAttribute("class");[...u.children].forEach(li=>li.removeAttribute("data-ok"))}
    else document.execCommand(cmd==="ul"?"insertUnorderedList":"insertOrderedList");
  }else if(/^(h1|h2|h3|div)$/.test(cmd))document.execCommand("formatBlock",false,cmd==="div"?"div":"<"+cmd+">");
  else document.execCommand(cmd);
  nSaveSoon();
}
function nToggle(id){["nfmt","nmenu","nfmenu"].forEach(k=>{const p=document.getElementById(k);if(p)p.hidden=k===id?!p.hidden:true})}
function nDebloque(id){
  nSave();const n=S.notes[id];if(!n||!String(n.txt||"").trim())return;
  stream("deb|"+id,`Tu aides un lycéen à démêler ce qui lui prend la tête. Sois chaleureux, direct et concret, sans jugement et sans psychologiser.
Voici sa note${nRealF(n.projet)?` (dossier « ${S.projets[n.projet].nom} »)`:""} :
${String(n.txt).slice(0,4000)}
Réponds en français, sans titres markdown, en trois parties courtes séparées par une ligne vide :
1) Ce que tu comprends de la situation (2 phrases).
2) Trois questions pour l'aider à avancer (tirets).

const OBJ_W={n:50,h:30,f:20},OBJ_CIBLE=17;
const OBJ_Q={
 notes:[["Vingt fois sur le métier remettez votre ouvrage.","Nicolas Boileau"],
  ["Le génie est fait d'un pour cent d'inspiration et de quatre-vingt-dix-neuf pour cent de transpiration.","Thomas Edison"],
